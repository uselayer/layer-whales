<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layer Whales</title>
<style>
  @font-face { font-family: "Host Grotesk"; src: url(/static/fonts/HostGrotesk-latin-var.woff2) format("woff2");
    font-weight: 300 600; font-display: swap; }
  :root {
    --bg: #fafaf9; --card: #ffffff; --fg: #111112; --muted: #6c6c72; --faint: #a1a1a6; --line: #ececea;
    --soft: #f3f3f1; --green: #12a150; --green-soft: #e9f7ef; --danger: #c43d2f;
    --shadow: 0 1px 2px rgba(17, 17, 18, .04), 0 2px 8px rgba(17, 17, 18, .03);
    --av-l: 93%; --av-fg-l: 48%; --av-s: 42%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
      --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
    --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
    --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "Host Grotesk", -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  body.noscroll { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--muted); }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs a { padding: 7px 12px; border-radius: 999px; color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .tabs a:hover { color: var(--fg); }
  .tabs a.on { background: var(--soft); color: var(--fg); }
  .pill { margin-left: auto; font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .tabbar { display: none; }
  main.wrap { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }
  footer.foot { color: var(--faint); font-size: 12.5px; padding-top: 8px; padding-bottom: 36px; text-align: center; }
  footer.foot a { color: var(--muted); }

  /* bits */
  .av { --h: 200; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
    background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 45% var(--av-fg-l)); }
  .av svg { width: 62%; height: 62%; display: block; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tier { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.35; }
  .tier.t1 { background: var(--fg); color: var(--bg); }
  .tier.t2 { border: 1px solid var(--line); color: var(--fg); padding: 1px 7px; }
  .tier.t3 { background: var(--soft); color: var(--muted); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .badge svg { width: 13px; height: 13px; }
  .chip { display: inline-block; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 8px; background: var(--soft); color: var(--fg); }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--fg); color: var(--bg); white-space: nowrap; transition: transform .08s ease, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.wide { width: 100%; padding: 13px 16px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.done { background: var(--soft); color: var(--fg); }
  .link { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; }
  .link:hover { text-decoration-color: currentColor; }
  .sep { color: var(--faint); margin: 0 6px; }

  /* status */
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .status.in { color: var(--green); } .status.in i { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .status.done { color: var(--fg); } .status.done i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }

  /* feed controls */
  .follow { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .stack { display: flex; }
  .stack .av { box-shadow: 0 0 0 2px var(--bg); }
  .stack .av + .av { margin-left: -8px; }
  .follow b { font-weight: 500; font-size: 14px; white-space: nowrap; }
  .follow .chev { color: var(--faint); }
  .feedtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .updated { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 14px;
    font-weight: 500; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .cats button.on { background: var(--fg); color: var(--bg); box-shadow: none; }
  .cats button .n { color: var(--faint); font-weight: 400; margin-left: 4px; }
  .cats button.on .n { color: color-mix(in srgb, var(--bg) 60%, transparent); }
  .switch { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 36px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .track { background: var(--green); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* cards */
  .cards { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); }
  .bet { cursor: pointer; transition: border-color .15s, transform .15s; }
  .bet:hover { border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
  .bet-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .bet-top .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 14px; }
  .when { color: var(--faint); font-size: 13px; white-space: nowrap; margin-left: auto; }
  .bet-title { font-size: 19px; line-height: 1.25; margin: 14px 0 8px; overflow-wrap: anywhere; }
  .bet-nums { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .bet-nums b { color: var(--fg); font-weight: 600; }
  .bet-nums .amt { color: var(--fg); font-weight: 500; white-space: nowrap; }
  .bet-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); min-height: 50px; }
  .bet.compact .bet-title { font-size: 17px; margin-top: 0; }

  /* lists */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .trow { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); cursor: pointer; }
  .trow:first-child { border-top: 0; }
  .trow:hover { background: var(--soft); }
  .trow.norank { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .rank { color: var(--faint); font-size: 14px; text-align: center; }
  .tmain { min-width: 0; display: grid; gap: 4px; }
  .tmain .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .tmain .sub { color: var(--muted); font-size: 13px; }
  .tnum { text-align: right; white-space: nowrap; }
  .tnum b { display: block; font-size: 16px; font-weight: 600; }
  .tnum small { color: var(--muted); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .t { font-weight: 500; overflow-wrap: anywhere; }
  .row .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row .r { text-align: right; white-space: nowrap; font-size: 14px; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 13px; color: var(--muted); font-weight: 500; cursor: pointer; }
  .more:hover { color: var(--fg); }

  /* page bits */
  .seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; margin-bottom: 16px; max-width: 100%; }
  .seg a { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg a.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lede { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
  .h2 { font-size: 17px; margin: 32px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .foot-note { color: var(--faint); font-size: 13px; margin: 14px 2px 0; }
  .foot-note a, .foot-note button { color: var(--muted); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .opts button { border: 0; background: none; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .opts button.on { color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
  .opts button:disabled { opacity: .4; cursor: default; }
  .opts .gap { width: 10px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 18px; }
  .back:hover { color: var(--fg); }
  .th { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .th h1 { font-size: 26px; line-height: 1.15; }
  .th .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .reason { font-size: 16px; margin: 18px 0 0; line-height: 1.5; }
  .hero { margin: 24px 0 6px; }
  .hero .big { font-size: 44px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .hero .cap { color: var(--muted); margin-top: 8px; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile span { display: block; color: var(--muted); font-size: 12.5px; }
  .tile b { display: block; font-size: 17px; font-weight: 600; margin-top: 3px; }
  .tile small { color: var(--muted); font-size: 12.5px; }
  .copybox { margin-top: 20px; }
  .copybox p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .copybox .head { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .copybox .on-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .catpick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .catpick button { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--soft); color: var(--muted); }
  .catpick button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  details.fold { margin-top: 32px; border-top: 1px solid var(--line); }
  details.fold > summary { list-style: none; cursor: pointer; padding: 16px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "Show"; color: var(--muted); font-weight: 500; font-size: 14px; }
  details.fold[open] > summary::after { content: "Hide"; }
  .fold h3 { font-size: 15px; margin: 22px 0 8px; }
  .fold p.note { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl .n { text-align: right; white-space: nowrap; }
  .tbl td .s { color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ext { color: var(--muted); font-size: 14px; font-weight: 500; }
  .ext:hover { color: var(--fg); }

  /* states */
  .state { text-align: center; padding: 44px 24px; color: var(--muted); }
  .state b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 6px; }
  .state p { margin: 0 auto 16px; max-width: 380px; }
  .state.err b { color: var(--danger); }
  .inline-err { color: var(--danger); font-size: 13.5px; margin: 10px 0; }
  .skel { background: linear-gradient(90deg, var(--soft) 25%, color-mix(in srgb, var(--soft) 40%, var(--card)) 50%, var(--soft) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 8px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

  /* sheet + toast */
  #sheet { position: fixed; inset: 0; z-index: 50; display: none; }
  #sheet.on { display: block; }
  #sheet .scrim { position: absolute; inset: 0; background: rgba(10, 10, 12, .38); animation: fade .18s ease; }
  #sheet .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px));
    max-height: calc(100% - 48px); overflow-y: auto; background: var(--card); border-radius: 22px; padding: 24px 22px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .18); animation: pop .2s ease; }
  #sheet .x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  #sheet h2 { font-size: 21px; line-height: 1.25; padding-right: 36px; }
  #sheet ol, #sheet ul { padding-left: 20px; margin: 10px 0; } #sheet li { margin: 8px 0; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; margin: 18px 0; }
  .kv div { background: var(--card); padding: 11px 14px; }
  .kv span { display: block; color: var(--muted); font-size: 12.5px; }
  .kv b { font-weight: 600; font-size: 16px; }
  .explain { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .sheet-who { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--soft); margin-top: 16px; }
  .sheet-who .grow { flex: 1; min-width: 0; display: grid; }
  .fine { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0 0; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 60; opacity: 0; pointer-events: none;
    background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px);
    transition: opacity .2s, transform .2s; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast a { text-decoration: underline; text-underline-offset: 3px; margin-left: 6px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
  @keyframes up { from { transform: translateY(30px); opacity: .6; } }

  /* phone */
  @media (max-width: 640px) {
    header.top .wrap { height: 54px; }
    .tabs { display: none; }
    .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
    .tabbar a { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 4px 0; font-size: 11.5px; font-weight: 500; color: var(--faint); }
    .tabbar a.on { color: var(--fg); }
    .tabbar svg { width: 22px; height: 22px; }
    body { padding-bottom: 72px; }
    #toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
    main.wrap { padding-top: 20px; }
    .stack .av:nth-child(n+4) { display: none; }
    .updated .long { display: none; }
    .card { padding: 15px 16px; border-radius: 16px; }
    .bet-title { font-size: 18px; }
    .trow { grid-template-columns: 18px 36px minmax(0, 1fr) auto; gap: 10px; padding: 13px 14px; }
    .trow.norank { grid-template-columns: 36px minmax(0, 1fr) auto; }
    .row { padding: 12px 14px; }
    .hero .big { font-size: 38px; }
    .th h1 { font-size: 22px; }
    .filters { flex-direction: column; align-items: stretch; gap: 12px; }
    #sheet .panel { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-height: 88%; border-radius: 22px 22px 0 0;
      padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation: up .22s ease; }
    #sheet .panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 4px; background: var(--line); }
  }
</style>
</head>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const VENUE = { kalshi: "Kalshi", polymarket: "Polymarket", polymarket_us: "Polymarket US" };
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body?.detail?.message || (typeof body?.detail === "string" ? body.detail : "") || `Request failed (${r.status})`);
  return body;
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

// ---- numbers ----
// Prices in whole cents; tenths only under 1¢ (or between 99¢ and 100¢), or when two prices would look equal.
const tenths = (p) => `${Math.round(p * 1000) / 10}¢`;
function cents(p) {
  if (p == null) return "—";
  const c = p * 100;
  return c < 1 || (c > 99 && c < 100) ? tenths(p) : `${Math.round(c)}¢`;
}
function centsPair(a, b) {
  if (a == null || b == null) return [cents(a), cents(b)];
  const lookSame = Math.round(a * 100) === Math.round(b * 100) && Math.round(a * 1000) !== Math.round(b * 1000);
  return lookSame ? [tenths(a), tenths(b)] : [cents(a), cents(b)];
}
const centsSigned = (x) => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(Math.round(x * 1000) / 10)}¢`;
function usd(x, signed = false) {
  if (x == null) return "—";
  const a = Math.abs(x);
  const s = a >= 1e9 ? `${(a / 1e9).toFixed(1)}B` : a >= 1e6 ? `${(a / 1e6).toFixed(a >= 1e8 ? 0 : 1)}M`
    : a >= 1e3 ? `${(a / 1e3).toFixed(a >= 1e5 ? 0 : 1)}K` : a >= 10 ? `${Math.round(a)}` : a.toFixed(2);
  return `${x < 0 ? "−" : signed && x > 0 ? "+" : ""}$${s.replace(/\.0([KMB])$/, "$1")}`;
}
function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t)) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}
function updatedAgo(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  return `<span class="long">Updated </span>${s < 5 ? "just now" : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`}`;
}

// ---- who: names, aliases, avatars, tiers ----
// No wallet addresses on screen: a trader without a real name gets "Trader 0x91…76" and an identicon.
const ADDR = /^0x[0-9a-f]{6,}/i;
function displayName(name, id) {
  const n = String(name || "").trim();
  if (n && !ADDR.test(n)) return n;
  const w = ADDR.test(id || "") ? id : (n.match(/^0x[0-9a-f]+/i) || [""])[0];
  return w ? `Trader ${w.slice(0, 4)}…${w.slice(-2)}` : "Anonymous";
}
function hash32(s) { // FNV-1a, then a murmur3 finish so every bit is well mixed
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
function avatar(seed, size = 36) {
  seed = String(seed || "?").toLowerCase();
  const h = hash32(seed), bits = hash32(`${seed}#cells`);
  let cells = "";
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
    if (!((bits >>> (y * 3 + x)) & 1)) continue;
    cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    if (x < 2) cells += `<rect x="${4 - x}" y="${y}" width="1" height="1"/>`;
  }
  return `<span class="av" style="--h:${h % 360};width:${size}px;height:${size}px" aria-hidden="true"><svg viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges">${cells}</svg></span>`;
}
const TIER = {
  proven: ["Proven sharp", "t1"], quiet: ["Quiet sharp", "t1"], rising: ["Rising", "t2"],
  too_fast: ["Too fast to copy", "t3"], lucky: ["Lucky", "t3"], no_edge: ["No clear edge", "t3"], no_view: ["No view", "t3"],
};
const tier = (seg) => TIER[seg] ? `<span class="tier ${TIER[seg][1]}">${TIER[seg][0]}</span>` : "";
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function oddsEdge(s) { // how much more often their bets won than the price said they would, in points
  if (!s.settled || s.odds == null) return null;
  return Math.round(100 * (s.won / s.settled - s.odds));
}
const beatsBadge = (s) => (oddsEdge(s) ?? 0) > 0 ? `<span class="badge">${CHECK}Beats the odds</span>` : "";

// ---- bet status: one line with a dot ----
const STATUS = {
  in: ["You can still get in", "in"], moved: ["Price moved away", "moved"],
  won: ["Won", "done"], lost: ["Lost", "done"], closed: ["Closed", "done"],
};
const statusLine = (st) => STATUS[st] ? `<span class="status ${STATUS[st][1]}"><i></i>${STATUS[st][0]}</span>` : `<span class="status"><i></i>Price unknown</span>`;
const SETTLED = new Set(["won", "lost", "closed"]);
const GET_IN = 0.03; // the same limit copying uses
function statusExplain(b) {
  const d = b.price_now != null && b.price != null ? b.price_now - b.price : null;
  const gap = (x) => Math.abs(x) < 0.01 ? "less than 1¢" : `${Math.round(Math.abs(x) * 100)}¢`; // rounded like the prices shown
  switch (b.status) {
    case "in": return d > 0.0005 ? `The price is ${gap(d)} above what they paid. Copies buy at most 3¢ above their price, so you can still get in.`
      : d < -0.0005 ? `The price is ${gap(d)} below what they paid, so you can still get in.` : "The price is about what they paid, so you can still get in.";
    case "moved": return `The price is ${gap(d)} above what they paid, more than the 3¢ copying allows. Most of their edge is already in the price.`;
    case "won": return "The price is 98¢ or more: the market has settled their way, or as good as.";
    case "lost": return "The price is 2¢ or less: the market has settled against them, or as good as. Not a bargain.";
    case "closed": return "They no longer hold it: they sold, or the market settled and paid out.";
    default: return "";
  }
}

// ---- sheet + toast ----
function sheet(html) {
  const el = $("#sheet");
  el.innerHTML = `<div class="scrim"></div><div class="panel" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button>${html}</div>`;
  el.classList.add("on"); document.body.classList.add("noscroll");
  $(".scrim", el).onclick = closeSheet; $(".x", el).onclick = closeSheet;
  return $(".panel", el);
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#sheet").innerHTML = ""; document.body.classList.remove("noscroll"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
let toastTimer = null;
function toast(html) {
  const t = $("#toast"); t.innerHTML = html; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 4200);
}

// ---- states ----
const skelCard = () => `<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="skel" style="width:28px;height:28px;border-radius:50%"></div><div class="skel" style="width:140px;height:12px"></div></div>
  <div class="skel" style="width:78%;height:18px;margin:18px 0 10px"></div><div class="skel" style="width:60px;height:22px"></div>
  <div class="skel" style="width:55%;height:13px;margin-top:18px"></div></div>`;
const skelCards = (n = 3) => `<div class="cards">${Array.from({ length: n }, skelCard).join("")}</div>`;
const skelRows = (n = 6) => `<div class="list">${Array.from({ length: n }, () => `<div class="trow norank"><div class="skel" style="width:36px;height:36px;border-radius:50%"></div><div><div class="skel" style="width:45%;height:13px"></div><div class="skel" style="width:30%;height:11px;margin-top:8px"></div></div><div class="skel" style="width:56px;height:16px"></div></div>`).join("")}</div>`;
const emptyState = (title, body = "", action = "") => `<div class="state"><b>${title}</b>${body ? `<p>${body}</p>` : ""}${action}</div>`;
const errorState = (msg) => `<div class="state err"><b>Couldn't load this</b><p>${esc(msg)}</p><button class="btn ghost" data-retry>Try again</button></div>`;

// ---- copying (paper) ----
let copy = null; // { rules: {size, max_above, traders: [...]}, recent: [...] }
const isCopied = (venue, id) => !!copy?.rules.traders.find((t) => t.venue === venue && t.id === id);
async function loadCopy() { try { copy = await api("/api/copy"); } catch {} return copy; }
setInterval(loadCopy, 15000);
async function startCopy(t, categories = []) {
  copy = await post("/api/copy/traders", { venue: t.venue, id: t.id, name: t.name, categories });
  toast(`Copying ${esc(displayName(t.name, t.id))}'s next buys with paper money.<a href="#/mine">My trades</a>`);
}
async function stopCopy(venue, id) { copy = await api(`/api/copy/traders/${venue}/${encodeURIComponent(id)}`, { method: "DELETE" }); }
function copyButton(t, cls = "") {
  if (isCopied(t.venue, t.id)) return `<button class="btn done ${cls}" data-goto="#/mine">Copying ✓</button>`;
  return `<button class="btn ${cls}" data-copy='${esc(JSON.stringify({ venue: t.venue, id: t.id, name: t.name }))}'>Copy with paper money</button>`;
}

// ---- bet cards (feed, and a trader's open bets) ----
let shown = []; // the bets on screen, so a card can open its sheet
function betCard(b, i, { who = true } = {}) {
  const [paid, now] = centsPair(b.price, b.price_now);
  const name = displayName(b.name, b.wallet);
  const top = who ? `<div class="bet-top">${avatar(b.wallet, 28)}<span class="who"><span class="name">${esc(name)}</span>${tier(b.segment)}</span>
      <span class="when">${[b.category, b.at ? ago(b.at) : ""].filter(Boolean).map(esc).join(" · ")}</span></div>` : "";
  const act = who && !SETTLED.has(b.status) && b.wallet ? copyButton({ venue: "polymarket", id: b.wallet, name: b.name }, "small") : "";
  return `<article class="card bet${who ? "" : " compact"}" data-bet="${i}" tabindex="0">
    ${top}
    <h3 class="bet-title">${esc(b.title || "Untitled market")}</h3>
    ${b.outcome ? `<span class="chip">${esc(b.outcome)}</span>` : ""}
    <div class="bet-nums"><span>Bought at <b>${paid}</b><span class="sep">·</span>Now <b>${now}</b></span><span class="amt">${usd(b.usd)} in</span></div>
    <div class="bet-foot">${statusLine(b.status)}${act}</div>
  </article>`;
}
function betSheet(b) {
  const [paid, now] = centsPair(b.price, b.price_now);
  const name = displayName(b.name, b.wallet);
  const panel = sheet(`
    <h2>${esc(b.title || "Untitled market")}</h2>
    ${b.outcome ? `<div style="margin-top:10px"><span class="chip">${esc(b.outcome)}</span></div>` : ""}
    <div style="margin-top:18px">${statusLine(b.status)}<p class="explain">${statusExplain(b)}</p></div>
    <div class="kv">
      <div><span>Bought at</span><b>${paid}</b></div><div><span>Price now</span><b>${now}</b></div>
      <div><span>They put in</span><b>${usd(b.usd)}</b></div><div><span>Contracts</span><b>${b.size != null ? Math.round(b.size).toLocaleString() : "—"}</b></div>
      ${b.at || b.category ? `<div><span>When</span><b>${b.at ? ago(b.at) : "—"}</b></div><div><span>Category</span><b>${esc(b.category || "—")}</b></div>` : ""}
    </div>
    ${b.wallet ? `<a class="sheet-who" href="#/worth/${esc(b.wallet)}">${avatar(b.wallet, 36)}<span class="grow"><span class="name">${esc(name)}</span><span class="muted" style="font-size:13px">See their record</span></span>${tier(b.segment)}</a>` : ""}
    ${b.wallet && !SETTLED.has(b.status) ? `<div style="margin-top:16px">${copyButton({ venue: "polymarket", id: b.wallet, name: b.name }, "wide")}</div>
      <p class="fine">Copies their next buys as paper orders, from now on. Bets they already made aren't copied.</p>` : ""}
    ${b.url ? `<p style="text-align:center;margin:16px 0 0"><a class="ext" href="${esc(b.url)}" target="_blank" rel="noopener">Open on Polymarket ↗</a></p>` : ""}`);
  bindActions(panel);
}

// one handler for the clickable things inside a container
function bindActions(root) {
  $$("[data-bet]", root).forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("button, a")) betSheet(shown[+el.dataset.bet]); };
    el.onkeydown = (e) => { if (e.key === "Enter" && e.target === el) betSheet(shown[+el.dataset.bet]); };
  });
  $$("[data-copy]", root).forEach((btn) => (btn.onclick = async (e) => {
    e.stopPropagation(); btn.disabled = true;
    try { await startCopy(JSON.parse(btn.dataset.copy)); } catch (err) { btn.disabled = false; toast(esc(err.message)); return; }
    refreshCopyButtons();
  }));
  $$("[data-goto]", root).forEach((btn) => (btn.onclick = (e) => { e.stopPropagation(); closeSheet(); location.hash = btn.dataset.goto; }));
  $$("[data-retry]", root).forEach((btn) => (btn.onclick = () => route()));
  $$("[data-href]", root).forEach((el) => (el.onclick = () => (location.hash = el.dataset.href)));
}
function refreshCopyButtons() {
  $$("[data-copy], [data-goto='#/mine']").forEach((btn) => {
    const t = btn.dataset.copy ? JSON.parse(btn.dataset.copy) : null;
    if (t && isCopied(t.venue, t.id)) {
      btn.outerHTML = `<button class="btn done ${btn.classList.contains("small") ? "small" : ""} ${btn.classList.contains("wide") ? "wide" : ""}" data-goto="#/mine">Copying ✓</button>`;
    }
  });
  bindActions(document);
}

// ---- feed ----
const feed = { data: null, at: 0, err: null, cat: "All", onlyIn: true };
const BASE_CATS = ["All", "Sports", "Politics", "Crypto", "Esports"];
let feedTimer = null;
const onFeed = () => routeName() === "feed";

async function feedPage() {
  $("#app").innerHTML = `<div id="fbar"></div><div id="flist">${skelCards(3)}</div>`;
  if (feed.data) renderFeed();
  await loadFeed();
}
async function loadFeed() {
  clearTimeout(feedTimer);
  try { feed.data = await api("/api/live"); feed.at = Date.now(); feed.err = null; } catch (e) { feed.err = e.message; }
  if (!onFeed()) return;
  feedTimer = setTimeout(() => { if (onFeed()) loadFeed(); }, 30000);
  renderFeed();
}
function renderFeed() {
  const r = feed.data;
  if (!r) { $("#flist").innerHTML = errorState(feed.err || "No answer from the app."); bindActions($("#flist")); return; }
  if (!r.traders.length) {
    $("#fbar").innerHTML = "";
    $("#flist").innerHTML = emptyState("No traders to follow yet",
      "The first check of Polymarket traders takes 20–30 minutes. The feed fills in once it finds traders worth following.",
      `<a class="btn ghost" href="#/traders">See the traders</a>`);
    return;
  }
  const n = r.traders.length;
  const counts = {};
  const pool = r.bets.filter((b) => !feed.onlyIn || b.status === "in");
  pool.forEach((b) => { if (b.category) counts[b.category] = (counts[b.category] || 0) + 1; });
  const cats = [...BASE_CATS, ...Object.keys(counts).filter((c) => !BASE_CATS.includes(c)).sort()];
  if (!cats.includes(feed.cat)) feed.cat = "All";
  $("#fbar").innerHTML = `
    <div class="feedtop">
      <button class="follow" id="following">${`<span class="stack">${r.traders.slice(0, 5).map((t) => avatar(t.wallet, 28)).join("")}</span>`}
        <b>Following ${plural(n, "trader")}</b><span class="chev">›</span></button>
      <span class="updated" id="updated">${updatedAgo(feed.at)}</span>
    </div>
    <div class="filters">
      <div class="cats" role="tablist">${cats.map((c) => `<button data-cat="${esc(c)}" class="${c === feed.cat ? "on" : ""}">${esc(c)}${c !== "All" && counts[c] ? `<span class="n">${counts[c]}</span>` : ""}</button>`).join("")}</div>
      <label class="switch"><input type="checkbox" id="onlyin" ${feed.onlyIn ? "checked" : ""}><span class="track"></span>Only bets I can still get into</label>
    </div>
    ${feed.err ? `<p class="inline-err">Couldn't refresh: ${esc(feed.err)}. Showing the last update.</p>` : ""}
    ${r.failed ? `<p class="foot-note" style="margin:0 0 12px">${plural(r.failed, "trader")} couldn't be read just now; retrying.</p>` : ""}`;
  $$("[data-cat]").forEach((b) => (b.onclick = () => { feed.cat = b.dataset.cat; renderFeed(); }));
  $("#onlyin").onchange = (e) => { feed.onlyIn = e.target.checked; renderFeed(); };
  $("#following").onclick = () => followingSheet(r.traders);

  shown = pool.filter((b) => feed.cat === "All" || b.category === feed.cat);
  let html;
  if (!r.bets.length) html = emptyState(`None of your traders bet in the last ${r.hours} hours`, "New bets show up here within a few minutes of being made. Polymarket shows trades a few minutes late.");
  else if (!shown.length) html = emptyState(feed.onlyIn ? "Nothing you can still get into" : `No ${esc(feed.cat)} bets`,
    feed.onlyIn ? `Every ${feed.cat === "All" ? "" : esc(feed.cat) + " "}bet from the last ${r.hours} hours has moved away or settled.` : `Nothing in ${esc(feed.cat)} in the last ${r.hours} hours.`,
    feed.onlyIn ? `<button class="btn ghost" id="showall">Show all bets</button>` : "");
  else html = `<div class="cards">${shown.map((b, i) => betCard(b, i)).join("")}</div>`;
  $("#flist").innerHTML = html;
  const all = $("#showall");
  if (all) all.onclick = () => { feed.onlyIn = false; renderFeed(); };
  bindActions($("#flist"));
}
setInterval(() => { const u = $("#updated"); if (u && feed.at) u.innerHTML = updatedAgo(feed.at); }, 5000);

function followingSheet(traders) {
  const panel = sheet(`<h2>Following ${plural(traders.length, "trader")}</h2>
    <p class="explain">The feed shows new bets from traders rated Proven sharp, Quiet sharp or Rising. <button class="link" id="howlink">How we pick traders</button></p>
    <div class="list" style="margin-top:16px">${traders.map((t) => `<a class="trow norank" href="#/worth/${esc(t.wallet)}">${avatar(t.wallet, 36)}
      <span class="tmain"><span class="name">${esc(displayName(t.name, t.wallet))}</span></span>${tier(t.segment)}</a>`).join("")}</div>`);
  $$("a", panel).forEach((a) => a.addEventListener("click", closeSheet));
  $("#howlink", panel).onclick = howSheet;
}

function howSheet() {
  sheet(`<h2>How we pick traders</h2>
    <p class="explain" style="margin-top:12px">We look at Polymarket traders on the leaderboards and in busy markets, and check up to 60 of each one's bets from the last 30 days against Polymarket's own price history.</p>
    <ol>
      <li><b>The price moves their way.</b> A few minutes after they buy, has the market come round to their view? That's the main sign of skill.</li>
      <li><b>Enough bets to trust it.</b> One good week isn't a record. Bets on the same game count once.</li>
      <li><b>Not one lucky win.</b> Their edge has to hold without their best bets, and their profit without their biggest win.</li>
      <li><b>You can copy it.</b> Buying the same thing a few minutes after them, and paying the fee, still has to pay off.</li>
      <li><b>They take a side.</b> Market makers and arbitrage traders have no view to follow, so they're left out.</li>
    </ol>
    <h3 style="font-size:15px;margin:18px 0 6px">The tiers</h3>
    <ul>
      <li><b>Proven sharp:</b> a long record that passes every check.</li>
      <li><b>Quiet sharp:</b> the same, on a small account no leaderboard lists.</li>
      <li><b>Rising:</b> good early signs, too few bets to be sure yet.</li>
      <li><b>Too fast to copy:</b> real skill, but the price has moved by the time you'd get in. Copying isn't offered.</li>
      <li><b>Lucky:</b> big profit, but the price doesn't move their way after they buy. Not worth following.</li>
    </ul>
    <p class="explain"><b>Beats the odds</b> means their bets won more often than the prices they paid said they would. A reading of the past, not a promise. Copying is paper money only.</p>`);
}

// ---- traders ----
const SEG_ORDER = ["proven", "quiet", "rising", "too_fast", "lucky"];
const RANKED = 25;
let worthTimer = null;
const topOpts = { venue: "all", by: "pnl" };

async function tradersPage(view) {
  const app = $("#app");
  app.innerHTML = `<nav class="seg"><a href="#/traders" class="${view === "worth" ? "on" : ""}">Worth following</a><a href="#/traders/top" class="${view === "top" ? "on" : ""}">Top profit</a><a href="#/traders/big" class="${view === "big" ? "on" : ""}">Big bets</a></nav>
    <div id="tview">${skelRows(7)}</div>`;
  if (view === "top") return topView();
  if (view === "big") return bigView();
  return worthView();
}

async function worthView() {
  clearTimeout(worthTimer);
  const box = $("#tview");
  let r;
  try { r = await api("/api/worth"); } catch (e) { box.innerHTML = errorState(e.message); bindActions(box); return; }
  if (routeName() !== "traders:worth") return;
  const st = r.status, res = r.result;
  if (st.running) worthTimer = setTimeout(() => { if (routeName() === "traders:worth") worthView(); }, 4000);
  if (!res) {
    box.innerHTML = st.running
      ? emptyState("Checking traders", `Reading about 200 Polymarket traders' last 30 days of bets${st.total ? ` (${st.done} of ${st.total} done)` : ""}. The first check takes 20–30 minutes; after that the last result shows at once.`)
      : emptyState("No traders checked yet", st.error ? esc(st.error) : "", `<button class="btn" id="wrefresh">Check traders</button>`);
    const b = $("#wrefresh"); if (b) b.onclick = async () => { await api("/api/worth/refresh", { method: "POST" }); worthView(); };
    return;
  }
  const ranked = res.scores.filter((s) => SEG_ORDER.includes(s.segment))
    .sort((a, b) => SEG_ORDER.indexOf(a.segment) - SEG_ORDER.indexOf(b.segment) || (b.edge?.z ?? -99) - (a.edge?.z ?? -99));
  const left = res.scores.length - ranked.length;
  const row = (s, i) => {
    const hero = s.pnl_window != null ? [usd(s.pnl_window, true), "30 days"] : [usd(s.pnl, true), "all time"];
    return `<a class="trow" href="#/worth/${esc(s.wallet)}" ${i >= RANKED ? "hidden data-extra" : ""}>
      <span class="rank">${i + 1}</span>${avatar(s.wallet, 40)}
      <span class="tmain"><span class="line"><span class="name">${esc(displayName(s.name, s.wallet))}</span></span>
        <span class="line">${tier(s.segment)}${beatsBadge(s)}</span>
        ${s.copy ? `<span class="sub">If you'd copied them: ${centsSigned(s.copy.mean)} a contract</span>` : ""}</span>
      <span class="tnum"><b>${hero[0]}</b><small>${hero[1]}</small></span></a>`;
  };
  box.innerHTML = `<p class="lede">Polymarket traders whose bets beat the odds, checked on their last 30 days. <button class="link" id="how">How we pick traders</button></p>
    ${ranked.length ? `<div class="list">${ranked.map(row).join("")}${ranked.length > RANKED ? `<button class="more" id="more">Show ${ranked.length - RANKED} more</button>` : ""}</div>`
      : emptyState("No trader passed the checks this time")}
    <p class="foot-note">${st.running ? `Checking again${st.total ? ` (${st.done} of ${st.total})` : ""}…` : `Checked ${plural(res.scores.length, "trader")} ${ago(res.finished)} · <button class="link" id="wrefresh" style="font-weight:400">Check again</button>`}${left ? ` · ${left} left out: market makers, arbitrage and traders with no clear edge` : ""}${st.error ? ` · <span style="color:var(--danger)">Last check failed: ${esc(st.error)}</span>` : ""}</p>`;
  $("#how").onclick = howSheet;
  const more = $("#more"); if (more) more.onclick = () => { $$("[data-extra]").forEach((r) => (r.hidden = false)); more.remove(); };
  const again = $("#wrefresh"); if (again) again.onclick = async () => { await api("/api/worth/refresh", { method: "POST" }); worthView(); };
}

async function loadOpenBets(s, venue = "polymarket", id = s.wallet) {
  const box = $("#open");
  let d;
  try { d = await api(`/api/trader/${venue}/${encodeURIComponent(id)}`); } catch (e) { if (box.isConnected) box.innerHTML = `<p class="inline-err">${esc(e.message)}</p>`; return; }
  if (!box.isConnected) return;
  if (d.visibility === "hidden") { box.innerHTML = `<div class="card">${emptyState("Hidden by the trader", "They hide their bets on Kalshi, so they can't be copied directly.")}</div>`; return; }
  const order = { in: 0, moved: 1 };
  const bets = d.positions.map((p) => ({ title: p.title || p.market, outcome: p.outcome, price: p.avg_price, price_now: p.current_price,
    usd: p.avg_price != null ? p.avg_price * p.size : p.value, size: p.size, status: p.status }))
    .sort((a, b) => (order[a.status] ?? 2) - (order[b.status] ?? 2) || (b.usd || 0) - (a.usd || 0)).slice(0, 12);
  shown = bets;
  box.innerHTML = bets.length ? `<div class="cards">${bets.map((b, i) => betCard(b, i, { who: false })).join("")}</div>` : `<div class="card">${emptyState("No open bets")}</div>`;
  bindActions(box);
}

function worthCopyBox(s) {
  const box = $("#copybox");
  if (s.action === "signal") { box.innerHTML = `<div class="head">Copying isn't offered</div><p style="margin:0">Their edge is gone by the time a copier gets in. Watch their bets instead.</p>`; return; }
  if (s.action === "avoid" || s.action === "skip") { box.innerHTML = `<div class="head">Not worth copying</div><p style="margin:0">${esc(s.reason)}</p>`; return; }
  copyBox(box, { venue: "polymarket", id: s.wallet, name: s.name }, { categories: s.categories.map((c) => c.category), strong: s.strong_categories,
    note: s.action === "watch" ? "They're still a maybe: too few bets to be sure." : "" });
}

// The copy card on a trader's page: start copying (optionally only some categories), or stop.
async function copyBox(box, t, opts = {}) {
  if (!copy) { box.innerHTML = `<div class="skel" style="width:60%;height:14px"></div>`; await loadCopy(); }
  if (!box.isConnected) return;
  const r = copy?.rules || { size: 5 };
  const on = copy?.rules.traders.find((x) => x.venue === t.venue && x.id === t.id);
  const name = esc(displayName(t.name, t.id));
  if (on) {
    box.innerHTML = `<div class="on-row"><div><div class="head">Copying <span class="name">${name}</span> ✓</div>
      <p style="margin:4px 0 0">Their new buys${on.categories?.length ? ` in ${esc(on.categories.join(", "))}` : ""} become paper orders on the same bet on ${VENUE[t.venue]}.${on.checked_s_ago != null ? ` Checked ${Math.round(on.checked_s_ago)}s ago.` : ""}</p>
      ${on.error ? `<p class="inline-err">${esc(on.error)}</p>` : ""}</div><button class="btn ghost small" id="stop">Stop</button></div>`;
    $("#stop", box).onclick = async () => { await stopCopy(t.venue, t.id); copyBox(box, t, opts); };
    return;
  }
  const cats = opts.categories || [], strong = opts.strong || [];
  box.innerHTML = `<div class="head">Copy their buys</div>
    <p>Each new buy becomes your own paper order on the same bet on ${VENUE[t.venue]}: ${r.size} contracts, at most 3¢ above their price, held until it settles. Real prices, fake money.${opts.note ? " " + esc(opts.note) : ""}</p>
    ${cats.length > 1 ? `<div class="catpick">${cats.map((c) => `<button aria-pressed="${!strong.length || strong.includes(c)}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
    <button class="btn wide" id="docopy">Copy with paper money</button>`;
  $$(".catpick button", box).forEach((b) => (b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));
  $("#docopy", box).onclick = async () => {
    $("#docopy", box).disabled = true;
    const picked = $$(".catpick button[aria-pressed=true]", box).map((b) => b.dataset.c);
    try { await startCopy(t, cats.length > 1 && picked.length < cats.length ? picked : []); copyBox(box, t, opts); }
    catch (e) { $("#docopy", box).disabled = false; box.insertAdjacentHTML("beforeend", `<p class="inline-err">${esc(e.message)}</p>`); }
  };
}

  app.innerHTML = `
    <div class="hero" style="margin-top:4px"><div class="big">${t.trades ? usd(t.net, true) : "$0"}</div>
      <div class="cap">${t.trades ? `Paper profit after fees on ${plural(t.trades, "copied trade")}<span class="sep">·</span>${t.open} open · ${t.won} won · ${t.lost} lost${t.void ? ` · ${t.void} refunded` : ""}` : "Paper profit · no copied trades yet"}</div></div>
    <p class="explain">Paper money: real prices and fees, fake money. Each copy is held until its market settles; open ones count at what they'd sell for now.</p>
    ${d.unvalued ? `<p class="explain">${plural(d.unvalued, "open bet")} ${d.unvalued === 1 ? "has" : "have"} no buyer right now, so ${d.unvalued === 1 ? "it isn't" : "they aren't"} in the total.</p>` : ""}

    <h2 class="h2">Who you're copying</h2>
    ${r.traders.length ? `<div class="list">${r.traders.map((x) => `<div class="trow norank" style="cursor:default">
        ${avatar(x.venue === "polymarket" ? x.id : `${x.venue}:${x.id}`, 36)}
        <a class="tmain" href="${x.venue === "polymarket" ? `#/worth/${esc(x.id)}` : `#/t/${x.venue}/${encodeURIComponent(x.id)}`}"><span class="name">${esc(displayName(x.name, x.id))}</span>
          <span class="sub">${VENUE[x.venue]}${x.categories?.length ? ` · only ${esc(x.categories.join(", "))}` : ""}${x.checked_s_ago != null ? ` · checked ${Math.round(x.checked_s_ago)}s ago` : ""}</span>
          ${x.error ? `<span class="inline-err" style="margin:0">${esc(x.error)}</span>` : ""}</a>
        <button class="btn ghost small" data-rm="${esc(x.venue)}/${esc(x.id)}">Stop</button></div>`).join("")}</div>`
      : `<div class="card">${emptyState("You're not copying anyone yet", "Find someone on the Feed or in Traders, then tap Copy with paper money.", `<a class="btn" href="#/traders">Find traders</a>`)}</div>`}

    <h2 class="h2">Copied trades</h2>
    ${d.rows.length ? `<div class="list">${d.rows.map((x) => { const res = x.result || {};
      return `<div class="row"><div><div class="t">${esc(x.source.title || x.market)}</div>
        <div class="s">${esc(x.source.outcome || (x.side || "").toUpperCase())} · copied from <span class="name" style="font-weight:500">${esc(displayName(x.trader.name, x.trader.id))}</span> · ${ago(x.at)}</div>
        <div class="s">${res.contracts ?? "—"} contracts at ${cents(res.avg_price)} on ${VENUE[x.venue] || x.venue}${res.status === "open" && res.mark != null ? ` · now ${cents(res.mark)}` : ""}</div></div>
        <div class="r"><b>${usd(res.pnl, true)}</b><div class="s">${RESULT[res.status] || "—"}</div></div></div>`; }).join("")}</div>`
      : `<div class="card">${emptyState("Nothing copied yet", "New buys from the traders you copy show up here within seconds of them making one.")}</div>`}

    ${skipped.length ? `<details class="fold"><summary>Not copied (${skipped.length} recent)</summary><div class="list">${skipped.map((e) => `<div class="row"><div><div class="t">${esc(e.source.title || e.source.market)}</div>
      <div class="s"><span class="name" style="font-weight:500">${esc(displayName(e.trader.name, e.trader.id))}</span> · ${esc(e.reason)}</div></div><div class="r s">${ago(e.at)}</div></div>`).join("")}</div></details>` : ""}

    <p class="foot-note" style="margin-top:32px;text-align:center"><button class="link" id="reset" style="font-weight:400">Start the paper account over</button><br>Clears positions and copied trades. The traders you copy stay.</p>`;
  $$("[data-rm]").forEach((b) => (b.onclick = async () => { const [v, id] = b.dataset.rm.split("/"); await stopCopy(v, id); minePage(); }));
  $("#reset").onclick = async () => { $("#reset").disabled = true; await api("/api/paper/reset", { method: "POST" }); minePage(); };
}

// ---- routing ----
// #/ feed · #/traders[/top|/big] · #/mine · #/worth/<wallet> · #/t/<venue>/<id>. Old links still work.
const OLD = { "#/live": "#/", "#/worth": "#/traders", "#/copied": "#/mine" };
function routeName() {
  const h = location.hash || "#/";
  if (h === "#/" || h === "#") return "feed";
  if (h === "#/traders") return "traders:worth";
  if (h === "#/traders/top") return "traders:top";
  if (h === "#/traders/big") return "traders:big";
  if (h === "#/mine") return "mine";
  return h;
}
function route() {
  if (OLD[location.hash]) { location.replace(OLD[location.hash]); return; }
  closeSheet(); clearTimeout(feedTimer); clearTimeout(worthTimer);
  const name = routeName();
  const w = location.hash.match(/^#\/worth\/(0x[0-9a-fA-F]{40})$/);
  const t = location.hash.match(/^#\/t\/(kalshi|polymarket)\/(.+)$/);
  const tab = name === "mine" ? "mine" : name === "feed" ? "feed" : "traders";
  $$("[data-tab]").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  window.scrollTo(0, 0);
  if (name === "feed") feedPage();
  else if (name.startsWith("traders:")) tradersPage(name.split(":")[1]);
  else if (name === "mine") minePage();
  else if (w) worthTraderPage(w[1].toLowerCase());
  else if (t) traderPage(t[1], decodeURIComponent(t[2]));
  else location.replace("#/");
}
window.addEventListener("hashchange", route);
loadCopy().then(() => { if (onFeed()) refreshCopyButtons(); });
route();
</script>
