// A tier pill that's a button (on Feed cards) opens what that tier means.
document.addEventListener("click", (e) => { const t = e.target.closest("[data-tier]"); if (t) howSheet("tiers", t.dataset.tier); });

// ---- interests: asked once per browser ----
// Kept in localStorage; [] means all markets, null not asked yet. Storage can be blocked (private windows),
// so the choice then holds for this visit only and onboarding never traps anyone. Onboarding, Traders' chips and
// the Feed's Change all set the same choice, from the four markets.
const INTERESTS = ["Politics", "Sports", "Crypto", "Esports"];
const INTERESTS_KEY = "signals.interests";
let interests = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(INTERESTS_KEY));
    if (Array.isArray(v)) return v.filter((c) => typeof c === "string" && c && c.length <= 40);
  } catch {}
  return null;
})();
// `picked`: the choice came from onboarding's question or the Feed's "Your markets · Change", the two places that
// ask which markets interest you. Only such a choice is kept on your account; Traders' chips only filter the view.
function setInterests(v, { picked = false } = {}) {
  interests = v;
  try { localStorage.setItem(INTERESTS_KEY, JSON.stringify(v)); } catch {}
  if (picked) {
    try { localStorage.setItem(PICKED_KEY, "1"); } catch {}
    saveInterests();
  }
}
const PICKED_KEY = "signals.interests.picked";
const wasPicked = () => { try { return localStorage.getItem(PICKED_KEY) === "1"; } catch { return false; } };
// Signed in, a picked choice is also kept on your account (the engine's /api/me/interests), so big trades in those
// markets can alert you on Telegram. Nobody saved, or [] (Skip, all markets: no choice made), gets none.
function saveInterests() {
  if (!signedIn() || !auth.me || !Array.isArray(interests)) return;
  const v = interests.filter((c) => INTERESTS.includes(c));
  if (JSON.stringify(auth.me.interests) === JSON.stringify(v)) return;
  api("/api/me/interests", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ interests: v }) })
    .then((me) => { auth.me = me; }, () => {});
}
// On signing in: markets picked before signing in go to the account (never an unchosen [] over a saved choice);
// a new browser takes the account's.
function syncInterests() {
  if (auth.me.interests == null) { if (wasPicked() && interests?.length) saveInterests(); return; }
  if (interests === null) {
    interests = auth.me.interests;
    try { localStorage.setItem(INTERESTS_KEY, JSON.stringify(interests)); localStorage.setItem(PICKED_KEY, "1"); } catch {}
    if ($(".onb")) route(); // past onboarding: they've answered it already
  }
}
// A market chip on Traders (and the Feed's "Show all markets"): "" (All) clears them; any other turns that market on or off.
function toggleInterest(c) {
  const now = new Set(interests || []);
  if (!c) now.clear(); else now.has(c) ? now.delete(c) : now.add(c);
  setInterests([...INTERESTS.filter((x) => now.has(x)), ...[...now].filter((x) => !INTERESTS.includes(x)).sort()]);
}
const interestNames = (cs) => cs.length < 2 ? cs.join("") : `${cs.slice(0, -1).join(", ")} or ${cs[cs.length - 1]}`;
// A trader matches when an interest is their most-traded category or one they're strong in.
const matchesInterests = (s, picked) => !picked.length || picked.includes(s.categories[0]?.category)
  || s.strong_categories.some((c) => picked.includes(c));

function interestPicker(el, { selected = [], go, alt, onDone }) {
  const picked = new Set(selected);
  el.innerHTML = `<div class="pick"><h2>What markets interest you?</h2>
    <div class="picks" role="group" aria-label="Markets">${INTERESTS.map((c) => `<button type="button" data-pick="${c}" aria-pressed="${picked.has(c)}">${c}</button>`).join("")}</div>
    <button class="btn wide" data-go ${picked.size ? "" : "disabled"}>${go}</button>
    <button class="link alt" data-alt>${alt}</button></div>`;
  $$("[data-pick]", el).forEach((b) => (b.onclick = () => {
    const c = b.dataset.pick;
    picked.has(c) ? picked.delete(c) : picked.add(c);
    b.setAttribute("aria-pressed", picked.has(c));
    $("[data-go]", el).disabled = !picked.size;
  }));
  $("[data-go]", el).onclick = () => onDone(INTERESTS.filter((c) => picked.has(c)));
  $("[data-alt]", el).onclick = () => onDone([]); // all markets, Economy, Weather and the rest included
}
function onboardingPage() {
  $$("[data-tab]").forEach((a) => a.classList.remove("on"));
  $("#app").innerHTML = `<section class="onb"><h1>Find traders worth following.</h1>
    <p class="lede">Discover interesting traders, understand how they trade, and decide who to follow.</p><div id="onbpick"></div></section>`;
  interestPicker($("#onbpick"), { go: "Discover traders →", alt: "Skip", onDone: (v) => {

// ---- traders: a leaderboard of the traders we recommend ----
// One bar: market chips (the onboarding interests), Copyable only, search by name or wallet, period, sort.
// Profit history (weeks in profit, trend, 7D/90D) comes from the SDK's next release; until then those columns
// show "—" and "Most consistent" waits. Never a made-up number for a real trader (sample data is local-only).
const SEG_ORDER = ["proven", "quiet", "rising"]; // the tiers we recommend, in order
const RANKED = 25;
let worthTimer = null, worthLast = null;
const topOpts = { venue: "all", by: "pnl" };
const lb = { copyOnly: false, q: "", sort: null, period: "30d", all: false, more: {} }; // more: "Show more" pressed, per section
// Traders' sections, from the engine's section_of: by tier alone, so the list and its tests agree. Copying is
// each row's copy status, and "Copyable only" filters on it.
const SECTIONS = [
  ["sharp", "Sharps", "The price moves their way after they buy, over enough trades to trust it. Each one's copy status is apart."],
  ["rising", "Rising", "Good early signs, too few trades to be sure yet."],
];

// With Explore on, Traders has two tabs: Recommended (the check's picks) and Explore (everyone the directory found).
const trTabs = (on) => !exploreOn ? "" : `<nav class="tr-tabs" aria-label="Traders">${[["worth", "#/traders", "Recommended"], ["explore", "#/traders/explore", "Explore"]]
  .map(([k, h, l]) => `<a href="${h}" ${on === k ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>`;

async function tradersPage(view) {
  const app = $("#app");
  if (view === "worth") { app.innerHTML = `${trTabs("worth")}<div id="tview">${skelRows(7)}</div>`; return worthView(); }
  if (view === "explore") { app.innerHTML = `${trTabs("explore")}<div id="tview">${skelRows(7)}</div>`; return exploreView(); }

    <div id="tview">${skelRows(7)}</div>`;
  return topView(); // Big trades moved to the Feed (#/big)
}

// The picked markets go with the request: when Traders reads the directory, their traders come first (no id, no account).
const worthUrl = (picked) => picked?.length ? `/api/worth?markets=${encodeURIComponent(picked.join(","))}` : "/api/worth";

async function worthView() {
  clearTimeout(worthTimer);
  const box = $("#tview");
  if (exploreOn) api("/api/traders?group=passed").then((x) => { const n = x.counts?.passed ?? null; if (n !== passedCount) { passedCount = n; renderWorth(); } }).catch(() => {});
  let r;

  if (routeName() !== "traders:worth") return;

  renderWorth();
}

// Copying is offered by one rule, the engine's (copy_offer): a recommended tier, and copies a few minutes late
// reliably above zero after fees (the bottom of the 95% range). Traders, a profile, the Feed and the copy routes
// all use it, so none can offer what another refuses.
const isCopyable = (s) => s.copy_ok === true;
// A trader's copy status, apart from their tier, in the engine's words (copy_status): Copyable, Copy not proven,
// Costly to copy or Not offered.
const COPY_LABELS = ["Copyable", "Copy not proven", "Costly to copy", "Not offered"];
const copyLabel = (s) => isCopyable(s) ? "Copyable" : COPY_LABELS.includes(s?.copy_label) ? s.copy_label : "Copy not proven";
// What a copy kept after fees is an estimate: always with its 95% range, and never shown as a gain unless the
// whole range is above zero.
const copyRange = (s) => s.copy_return_low != null && s.copy_return_high != null ? `${lbPct(s.copy_return_low)} to ${lbPct(s.copy_return_high)}` : null;
const copyFigure = (s) => s.copy_return == null ? null : `If you'd bought after them: ${lbPct(s.copy_return)} after fees${copyRange(s) ? ` (range ${copyRange(s)})` : ""}`;
// with no reason beside it (a list row), a gain that isn't Copyable says why
const copyEstimate = (s) => s.copy_return == null ? null : `${copyFigure(s)}${!isCopyable(s) && s.copy_return > 0 ? ", but we can't tell that from luck." : "."}`;
// Weeks in profit out of the weeks they have history for: a week before their first trade isn't a losing week.
const weeksUp = (s) => s.weeks_up ?? null;
// What "up" means for a week: trading profit, so open trades count at their value that week.
const WEEK_COUNTS = "A week counts profit taken plus the change in value of trades still open.";
const weeksOf = (s) => s.weeks_known ?? null;
// Trading profit only: never Polymarket's own figure (rewards and rebates in) when it's missing.
const profitOf = (s, p) => s.periods?.[p]?.trading_pnl ?? (p === "30d" ? s.trading_pnl_window : null) ?? null;
const perDollarOf = (s, p) => s.periods?.[p]?.return_per_dollar ?? (p === "30d" ? s.return_per_dollar : null) ?? null;
// Sorts rank by the bottom of each figure's 95% range, and only from enough of a sample (the engine leaves the
// rest null, at the bottom): 1 of 1 settled isn't the best win rate, 2 of 2 weeks isn't the most consistent.
const winRateOf = (s) => s.win_low ?? null;
// New markets they bought into (adding to a trade they already have isn't a new one), from the SDK's decisions.
const perDayText = (n) => n == null ? "" : n >= 1 ? `${plural(Math.round(n), "market")} a day`
  : Math.round(n * 7) ? `${plural(Math.round(n * 7), "market")} a week` : "fewer than one market a week"; // never a made-up one
// The days their win record, usual trade and markets a day cover: 30, or fewer for a busy trader whose last
// 5,000 fills (all the SDK reads) start later than that (covered_days, from the engine).
const readDays = (s) => s.covered_days != null && s.covered_days < 29 ? s.covered_days : 30;
const readPeriod = (s) => `last ${readDays(s)} days`;
const isWalletQuery = (q) => /^0x[0-9a-f]{40}$/i.test(q.trim());
const PERIOD_DAYS = { "7d": 7, "30d": 30, "90d": 90 };
const byDesc = (f) => (a, b) => (f(b) ?? -Infinity) - (f(a) ?? -Infinity);
// returns here are small (copies keep fractions of a percent), so one decimal under 10%
const lbPct = (x) => {
  if (x == null) return "—";
  const v = Math.abs(x) < 0.1 ? (Math.abs(x) * 100).toFixed(1) : String(Math.round(Math.abs(x) * 100));
  return `${Number(v) === 0 ? "" : x > 0 ? "+" : "−"}${v}%`; // rounds to zero: no sign
};
const LB_SORTS = {
  recommended: ["Recommended", (a, b) => SEG_ORDER.indexOf(a.segment) - SEG_ORDER.indexOf(b.segment) || (b.edge?.z ?? -99) - (a.edge?.z ?? -99)],
  consistent: ["Most consistent", (a, b) => (b.consistency_low ?? -1) - (a.consistency_low ?? -1) || (profitOf(b, "30d") ?? 0) - (profitOf(a, "30d") ?? 0)],
  profit: ["Profit", byDesc((s) => profitOf(s, lb.period))],
  won: ["Win rate", byDesc(winRateOf)],
  active: ["Most active", byDesc((s) => s.trades_per_day)],
  copying: ["Copy estimate", byDesc((s) => s.copy_rank)],
};
function lbSpark(s, days, w = 76, h = 26) {
  const pts = (s.pnl_daily || []).slice(-(days + 1)).map((p) => p[1]); // n days: n + 1 end-of-day points
  if (pts.length < 2) return `<span class="lb-none">—</span>`;
  const base = pts[0], ys = pts.map((v) => v - base), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = hi - lo || 1;
  const xy = ys.map((v, i) => [2 + (i / (ys.length - 1)) * (w - 4), h - 2 - ((v - lo) / span) * (h - 4)]);
  const [lx, ly] = xy[xy.length - 1], end = ys[ys.length - 1];
  return `<svg class="${end > 0 ? "gain" : end < 0 ? "loss" : ""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Profit trend"><polyline points="${xy.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.2" fill="currentColor"/></svg>`;
}

function renderWorth() {
  const box = $("#tview"), r = worthLast;
  if (!box || !r || routeName() !== "traders:worth") return;
  const st = r.status, res = r.result;
  if (!res) {
    box.innerHTML = (st.running
      ? emptyState("Checking traders", `Reading about 200 Polymarket traders' last 30 days of trades${st.total ? ` (${st.done} of ${st.total} done)` : ""}. The first check takes 20–30 minutes; after that the last result shows at once.`)
      : emptyState("No traders checked yet", st.error ? esc(st.error) : "", `<button class="btn" id="wrefresh">Check traders</button>`)) + passedLink();
    const b = $("#wrefresh"); if (b) b.onclick = async () => { await api("/api/worth/refresh", { method: "POST" }); worthView(); };
    return;
  }
  const scores = res.scores;
  const paused = !scores.some(isCopyable); // nobody's copies are offered: "Copyable only" has nothing to show
  if (paused) lb.copyOnly = false;
  const history = scores.some((s) => Array.isArray(s.pnl_weeks));
  const periods = scores.some((s) => s.periods);
  if (!periods) lb.period = "30d";
  const sort = lb.sort && (lb.sort !== "consistent" || history) ? lb.sort : "recommended";
  const n = lb.period, days = PERIOD_DAYS[n];
  const picked = interests || [], names = interestNames(picked), q = lb.q.trim().toLowerCase();
  const recommended = scores.filter((s) => SEG_ORDER.includes(s.segment));
  const pool = lb.all ? scores.filter((s) => s.segment !== "no_view") : recommended;
  const shown = pool.filter((s) => matchesInterests(s, picked))
    .filter((s) => !lb.copyOnly || isCopyable(s))
    .filter((s) => !q || (s.name || "").toLowerCase().includes(q) || s.wallet.startsWith(q))
    .sort(LB_SORTS[sort][1]);

  const head = (key, label) => `<button type="button" data-lbsort="${key}" aria-pressed="${sort === key}" ${key === "consistent" && !history ? "disabled" : ""}>${label}</button>`;
  const row = (s, i, open) => {
    const up = weeksUp(s), known = weeksOf(s), profit = profitOf(s, n), perDollar = perDollarOf(s, n), copy = s.copy_return;
    const notRec = !SEG_ORDER.includes(s.segment) ? ` · ${esc(TIER[s.segment]?.[0] || "Not recommended")}` : "";
    const cat = s.categories?.[0]?.category;
    // Copyable or not: a trader who isn't never gets a figure that reads as a gain, only their status (copyLabel).
    const copyMain = isCopyable(s) ? (copy == null ? `<span class="lb-none">—</span>` : `<span class="lb-main">${pl(copy, lbPct(copy))}</span>`)
      : `<span class="lb-main lb-muted">${copyLabel(s)}</span>`;
    const copySub = isCopyable(s) ? (copyRange(s) ? `range ${copyRange(s)}` : "estimate, after fees")
      : copy != null ? `estimate ${lbPct(copy)}` : "";
    return `<a class="lb-cols lb-row" href="#/worth/${esc(s.wallet)}" ${i >= RANKED && !open ? "hidden" : ""}>
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-who">${avatar(s.wallet, 40)}<span style="min-width:0"><span class="nm">${esc(displayName(s.name, s.wallet))}</span><span class="lb-sub">${[cat, s.last_buy ? `active ${ago(s.last_buy)}` : ""].filter(Boolean).map(esc).join(" · ")}${notRec}</span></span></span>
      <span class="lb-cons">${up == null || !known ? `<span class="lb-none">—</span>` : `<span class="lb-weeks" aria-hidden="true">${s.pnl_weeks.map((w) => `<i class="${w == null ? "none" : w > 0 ? "up" : w < 0 ? "down" : ""}"></i>`).join("")}</span><span class="lb-sub">${up} of ${known} weeks up</span>`}</span>
      <span class="lb-pnl">${profit == null ? `<span class="lb-none">—</span>` : `<span class="lb-main">${pl(profit, usd(profit, true))}</span><span class="lb-sub">${perDollar != null ? `${lbPct(perDollar)} per $ traded` : `${days} days`}</span>`}</span>
      <span class="lb-trend">${lbSpark(s, days)}</span>
      <span class="lb-won">${s.settled ? `<span class="lb-main">${s.won} of ${s.settled}</span><span class="lb-sub">${readDays(s) < 30 ? `settled · ${readDays(s)} days` : "settled"}</span>` : `<span class="lb-none">—</span>`}</span>
      <span class="lb-usual">${s.typical_usd != null ? `<span class="lb-main">${usd(s.typical_usd)}</span><span class="lb-sub">${perDayText(s.trades_per_day)}</span>` : `<span class="lb-none">—</span>`}</span>
      <span class="lb-copy">${copyMain}<span class="lb-sub">${copySub}</span></span>
      <span class="lb-meta">${[s.settled ? `${readPeriod(s).replace("l", "L")}: won ${s.won} of ${s.settled}` : "", s.typical_usd != null ? `usually ${usd(s.typical_usd)}` : "", perDayText(s.trades_per_day)].filter(Boolean).join(" · ")}</span>
      <span class="lb-copyline">${isCopyable(s) ? `Copyable.${copy != null ? ` ${copyEstimate(s)}` : ""}` : `<span class="lb-muted">${copyLabel(s)}.${copy != null ? ` ${copyEstimate(s)}` : ""}</span>`}</span>
    </a>`;
  };

  // One list of rows, with its own ranks and "Show more": a section, or every checked trader.
  const rows = (list, key) => `${list.map((s, i) => row(s, i, lb.more[key])).join("")}
      ${list.length > RANKED && !lb.more[key] ? `<button type="button" class="lb-more" data-lbmore="${key}">Show ${list.length - RANKED} more</button>` : ""}`;
  // Recommended traders come in sections by tier: Sharps, then Rising, each when it has anyone. Copying is each
  // row's copy status ("Copyable only" filters on it); while nobody can be copied, the "Copying is paused"
  // callout above the list says so. "See all checked traders" stays one marked list.
  const sections = lb.all ? null : SECTIONS.map(([key, title, sub]) => {
    const list = shown.filter((s) => s.section === key);
    if (!list.length) return "";
    return `<section class="lb-section" aria-label="${title}"><div class="lb-sec"><h2>${title}</h2><p>${sub}</p></div>
      ${rows(list, key)}</section>`;
  }).join("");

  let body;
  if (shown.length) {
    body = `<div class="lb-board ${history ? "" : "lb-nohist"}">
      <div class="lb-cols lb-groups" aria-hidden="true"><span style="grid-column:3 / span 4">Track record</span><span style="grid-column:7">Style</span><span style="grid-column:8">Copying</span></div>
      <div class="lb-cols lb-head"><span>#</span><span>Trader</span>${head("consistent", "12-week consistency")}${head("profit", "Profit")}<span>Trend</span>${head("won", "Won, 30 days")}${head("active", "Usual trade, 30 days")}${head("copying", "Copy estimate")}</div>
      ${sections ?? rows(shown, "all")}</div>`;
  } else if (q && isWalletQuery(q)) {

function evidenceFacts(r) {

// Their record as Polymarket reports it (/api/record): facts, kept apart from our skill test on the same page.

function recordFacts(rec) {

  const split = st.realized_pnl != null && open_ ? ` <small class="muted">${usd(st.realized_pnl, true)} closed, ${open_}</small>` : "";

  return [
    ["Profit from trading", st.trading_pnl != null ? `${pl(st.trading_pnl, usd(st.trading_pnl, true))} all time${split}` : "—"],
    ["Volume", st.volume_usd != null ? `${usd(st.volume_usd)} traded, all time` : "—"],

    ["Open now", (open.count ? `${open.count}${open.at_least ? "+" : ""} position${open.count === 1 ? "" : "s"} over 1 contract${open.value != null ? `, worth ${usd(open.value)}` : ""}`

const PF_PERIOD = { "7d": "7 days", "30d": "30 days", "90d": "90 days" };

function pfChart(s, n) {
  const days = { "7d": 7, "30d": 30, "90d": 90 }[n];
  const raw = (s.pnl_daily || []).slice(-(days + 1)).map((p) => p[1]);
  if (raw.length < 2) return null;
  const pts = raw.map((v) => v - raw[0]); // profit over the period, from 0
  const W = 640, H = 230, L = 58, R = 12, T = 12, B = 26;
  const lo = Math.min(0, ...pts), hi = Math.max(0, ...pts), pad = (hi - lo) * 0.08 || 1, y0 = lo - pad, y1 = hi + pad;
  const X = (i) => L + (i / (pts.length - 1)) * (W - L - R), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const xy = (v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`;
  let peak = -Infinity, worst = 0;
  const peaks = pts.map((v) => { peak = Math.max(peak, v); worst = Math.max(worst, peak - v); return peak; });
  const line = pts.map(xy).join(" "), last = pts.length - 1;
  const tone = pts[last] > 0 ? "var(--gain)" : pts[last] < 0 ? "var(--loss)" : "var(--fg)";
  const ticks = [lo, 0, hi].filter((v, i, a) => a.findIndex((x) => Math.abs(x - v) <= (hi - lo) * 0.15) === i);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit over ${PF_PERIOD[n]}: ${usd(pts[last], true)}">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v === 0 ? "$0" : usd(v, true)}</text>`).join("")}
    <polygon points="${xy(0, 0)} ${line} ${X(last).toFixed(1)},${Y(0).toFixed(1)}" fill="color-mix(in srgb, ${tone} 7%, transparent)"/>
    <polygon points="${peaks.map(xy).join(" ")} ${pts.map(xy).reverse().join(" ")}" fill="var(--line)"/>
    <polyline points="${line}" fill="none" stroke="${tone}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last).toFixed(1)}" cy="${Y(pts[last]).toFixed(1)}" r="4" fill="${tone}"/>
    <text x="${L}" y="${H - 6}">${PF_PERIOD[n]} ago</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${s.window?.[1] ? ago(s.window[1]) : "Latest"}</text></svg>`; // it ends when the score was worked out
  return { svg, worst };
}

// When they last bought: the newest of their trades read now (the Activity tab's), the buys the check kept and
// the check's last buy. Which markets is the Activity tab's job.
function lastBuyAt(s, d) {
  const fresh = d && !d.error && Array.isArray(d.trades) ? d.trades.filter((x) => x.action === "buy") : [];
  return [...fresh, ...(s.recent || []), { at: s.last_buy }].map((b) => b.at).filter(Boolean)
    .reduce((m, at) => (m == null || String(at) > String(m) ? at : m), null);
}
// A copy status sentence ("Costly to copy: …", from the engine) with its status (COPY_LABELS) in bold.
const boldStatus = (t) => { const l = COPY_LABELS.find((x) => t.startsWith(x)); return l ? `<b>${l}</b>${esc(t.slice(l.length))}` : esc(t); };
const WARN_ICON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8 15 14H1z"/><path d="M8 6.2v3.6M8 11.9v.1"/></svg>`;

// "Their numbers": a trader's figures, label then value, for the profile's two columns. The definitions are the
// trader profile audit's ("Trader profile layout and definitions"); the layout draws whatever comes back.
// A row is { k: its label, v: the value (html; null shows "—", never 0), sub: what it's based on and its period,
// weeks: their weekly results for the bars }. `summary` sits at the top (on a phone, before the chart), `groups`
// below it, `fold` in "How we measure this". Only the hero (realized P&L) and the chart follow 7D/30D/90D.
// Left out until they count settled positions never redeemed (Polymarket's closed positions leave those losers
// out): the last closed positions' won/lost/sold record and the share held until the market settles. The worst
// drop from a high too, here and on the chart: it's one reading a day of the hourly curve, at the hour the score was made, so a
// game in play at that hour sets it. It comes back once the SDK works it out from the whole hourly curve. Also
// hidden until fixed (the owner's call): the win record of checked trades ("won" is the outcome they bought paying
// out, even when they sold first at a loss, and its count differs by where the score came from until #124; the
// Traders list keeps it) and the resting-orders share (its comparison feed stops at 500 rows, so it can read high).
function profileNumbers(s, d, acct, n) {
  const P = PF_PERIOD[n];
  const money = (x) => x == null ? null : pl(x, usd(x, true));
  const realized = s.periods?.[n]?.realized ?? (n === "30d" ? s.realized_window : null) ?? null; // the score's curve
  const started = s.pnl_since && Date.now() - new Date(s.pnl_since) < PERIOD_DAYS[n] * 864e5 ? s.pnl_since : null;
  // Polymarket's own all-time figures, from the trader read (/api/trader): "…" while it loads, "—" if it failed.
  // Never the score's 30-day change in open value in their place: that isn't what's open now.
  const stats = d && !d.error ? d.stats || {} : null, loading = d == null;
  const now = (k) => stats ? money(stats[k] ?? null) : loading ? "…" : null;
  const allRealized = stats?.realized_pnl ?? null;
  // Their wallet: cash (read on-chain) plus open positions, read now (else as the check read them), with when.
  // A total only when both parts were read: one part alone is said to be one part, never shown as the wallet.
  const cash = acct.cash_usd ?? null, inPositions = acct.positions_usd ?? null;
  const wallet = cash != null && inPositions != null ? cash + inPositions : null;
  const reading = pf.account === null && cash == null && inPositions == null;
  const when = acct.read_at ? `as of ${ago(acct.read_at)}` : "now";
  const up = weeksUp(s), known = weeksOf(s), weeks = s.pnl_weeks || [];
  const cats = (s.categories || []).filter((c) => c.bets), events = cats.reduce((a, c) => a + c.bets, 0);
  const shares = cats.map((c) => [c.category, Math.round((100 * c.bets) / events)]).filter(([, p]) => p >= 5).slice(0, 3);
  const band = Array.isArray(s.price_band) ? `${cents(s.price_band[0])}–${cents(s.price_band[1])}` : null;
  const perDay = s.trades_per_day, gap = s.edge_by_delay?.["60"]?.mean;
  const allTime = s.trading_pnl ?? null, without = allTime != null && s.biggest_win != null ? allTime - s.biggest_win : null;
  return {
    hero: { k: `Realized P&L, ${P}`, v: money(realized),
      sub: `${started ? `taken since their first trade, ${ago(started)}` : `taken in the last ${P}`}${
        allRealized != null ? ` · ${usd(allRealized, true)} all time` : loading ? " · all time …" : ""}` },
    summary: [
      { k: "Open P&L", v: now("unrealized_pnl"), sub: "on positions still open · Polymarket's figure" },
      { k: "Wallet", v: wallet != null ? usd(wallet) : reading ? "…" : null,
        sub: reading ? "reading their wallet" : wallet != null ? `cash ${usd(cash)} + open positions ${usd(inPositions)}, ${when}`
          : cash != null ? `cash ${usd(cash)}; open positions couldn't be read` : inPositions != null ? `open positions ${usd(inPositions)}; cash couldn't be read` : "couldn't be read just now" },
      { k: "Made money on", v: null, sub: "every closed or settled position they've had · not available yet" },
    ],
    groups: [
      { title: "Record", rows: [
        { k: "Weeks up", v: up != null && known ? `${up} of ${known}` : null, sub: known && known < 12 ? "since their first trade" : "last 12 weeks",
          weeks: up != null && known ? weeks : null },
        { k: "Markets", v: shares.length ? shares.map(([c, p]) => `${esc(c)} ${p}%`).join(" · ") : null,
          sub: events ? `of ${plural(events, "event")} checked, ${readPeriod(s)}` : readPeriod(s) },
      ] },
      { title: "How they trade", rows: [
        { k: "Usual opening buy", v: s.typical_usd != null ? usd(s.typical_usd) : null, sub: readPeriod(s) },
        { k: "Usual price paid", v: band, sub: `middle half of positions checked, ${readPeriod(s)}` },
        { k: "New positions", v: perDay == null ? null : perDay >= 1 ? `about ${Math.round(perDay)} a day`
          : Math.round(perDay * 7) ? `about ${Math.round(perDay * 7)} a week` : "fewer than one a week", sub: readPeriod(s) },
      ] },
    ],
    fold: [
      { k: "How far the price moved before you could buy", v: gap != null ? centsSigned(gap).replace("+", "") : null, sub: "a minute after they bought, on average" },
      { k: "Biggest win, all time", v: s.biggest_win != null ? usd(s.biggest_win) : null, sub: "Polymarket's figure" },
      { k: "All time without their biggest win", v: money(without), sub: "trading profit, including positions still open" },
    ],
  };
}
const weekBars = (weeks) => `<span class="lb-weeks" aria-hidden="true">${weeks.map((w) => `<i class="${w == null ? "none" : w > 0 ? "up" : w < 0 ? "down" : ""}"></i>`).join("")}</span>`;
const numberRow = (r) => `<div><dt>${esc(r.k)}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</dt><dd>${r.weeks ? weekBars(r.weeks) : ""}${r.v ?? `<span class="lb-none">—</span>`}</dd></div>`;

function renderProfile() {
  const s = pf.s, d = pf.detail, n = pf.period, app = $("#app");
  if (!s || !app) return;
  if (pf.tab === "stats") pf.tab = "positions"; // the Stats tab's figures are in Their numbers now
  const name = displayName(s.name, s.wallet);
  const cats = s.categories || [];
  const fresh = pf.account && !pf.account.error ? pf.account : null;
  const acct = fresh || { cash_usd: s.cash_usd ?? null, positions_usd: s.positions_usd ?? null, read_at: s.account_at ?? null };
  const nums = profileNumbers(s, d, acct, n);
  // when the figures from their check (chart, realized P&L, record, how they trade) were worked out: every score
  // carries it, kept (stored_at) or not, so the header always says how old they are
  const checkedAt = s.stored_at ?? s.scored_at ?? null;
  const chart = pfChart(s, n);
  const can = isCopyable(s);
  // Under Follow: their copy status, one line with a dot; "Why?" goes to the reason in Why they're here.
  const copyStatus = `<div class="pf-copy"><span class="status${can ? " in" : ""}"><i></i>${copyLabel(s)}${can && s.copy_return != null ? ` · est. ${lbPct(s.copy_return)} after fees` : ""}</span>
    · <button type="button" class="link" id="whycopy">Why?</button></div>`;
  const period = s.periods ? `<div class="lb-period" role="group" aria-label="Period">${Object.keys(PF_PERIOD).map((p) => `<button type="button" data-pfperiod="${p}" aria-pressed="${n === p}">${p.toUpperCase()}</button>`).join("")}</div>` : "";

  // why they're here: the verdict and their copy status (the engine's why_lines), the SDK's own warnings, and when
  // they last bought. How they trade is in Their numbers, their recent markets in Activity.
  const why = s.why || {};
  const risks = (s.risks || []).map(sdkText);
  const lastAt = lastBuyAt(s, d);

  // the tabs
  let body;
  if (pf.tab === "positions") {
    const open = d && !d.error ? (d.positions || []).map((p) => ({ title: p.title || p.market, outcome: p.outcome, size: p.size, price: p.avg_price, now: p.current_price, status: p.status, url: p.url, us: p.us }))
      .filter((p) => !["won", "lost", "closed"].includes(p.status)) : null;
    const closedSdk = d && Array.isArray(d.closed) ? d.closed : null;
    const settled = (s.sample || []).filter((b) => b.payout != null).slice(0, 10);
    const openRow = (p) => `<div class="pf-li"><div><div class="t">${esc(p.title)}</div><div class="s">${p.outcome ? `<span class="pf-oc">${esc(p.outcome)}</span>` : ""}${p.size != null ? `${Math.round(p.size).toLocaleString()} at ${cents(p.price)} · ${usd((p.price ?? 0) * p.size)}` : ""}${p.now != null ? ` · now ${cents(p.now)}` : ""}${p.url ? ` · ${marketLink(p.url)}` : ""}${usInline(p.us)}</div></div><div class="r">${tradeStatus({ status: p.status, price: p.price, price_now: p.now }, can)}</div></div>`;
    const closedRow = (c) => {
      const sdk = "result" in c, when = c.closed_at || c.at;
      const bought = sdk ? `${c.size != null ? `${Math.round(c.size).toLocaleString()} ` : ""}${c.avg_price != null ? `at ${cents(c.avg_price)}` : "bought"}` : `bought at ${cents(c.price)}`;
      const status = sdk ? { won: "won", lost: "lost", sold: "closed" }[c.result] : c.payout === 1 ? "won" : "lost"; // null: not settled yet
      return `<div class="pf-li"><div><div class="t">${esc(c.title || c.market)}</div><div class="s">${c.outcome ? `<span class="pf-oc">${esc(c.outcome)}</span>` : ""}${bought}${c.result === "sold" && c.exit_price != null ? ` · sold at ${cents(c.exit_price)}` : ""}${c.pnl != null ? ` · ${pl(c.pnl, usd(c.pnl, true))}` : ""}${when ? ` · ${ago(when)}` : ""}${c.url ? ` · ${marketLink(c.url)}` : ""}</div></div>
      <div class="r">${status ? statusLine(status) : ""}</div></div>`;
    };
    body = `<p class="pf-sec">Open</p>${open == null ? (d?.error ? `<p class="inline-err">${esc(d.error)}</p>` : `<div class="skel" style="width:60%;height:14px;margin:16px 0"></div>`)
        : open.length ? `<div>${open.slice(0, 12).map(openRow).join("")}</div>` : `<p class="pf-empty">No open trades.</p>`}
      <p class="pf-sec">Closed${closedSdk ? "" : " · settled trades we checked"}</p>
      ${(closedSdk || settled).length ? `<div>${(closedSdk || settled).slice(0, 12).map(closedRow).join("")}</div>` : `<p class="pf-empty">No settled trades yet. Results show up once their markets settle.</p>`}`;
  } else {
    const trades = d && !d.error ? d.trades || [] : null;
    const act = trades ? trades.map((x) => ({ sell: x.action === "sell", title: x.title || x.market, outcome: x.outcome, usd: x.usd, price: x.price, at: x.at, url: x.url, us: x.us }))
      : (s.recent || []).map((b) => ({ sell: false, title: b.title || b.market, outcome: b.outcome, usd: b.usd, price: b.price, at: b.at, url: b.url }));
    body = act.length ? `<div>${act.slice(0, 20).map((a) => `<div class="pf-li"><div><div class="t">${a.sell ? "Sold" : "Bought"} ${a.outcome ? `<span class="pf-oc">${esc(a.outcome)}</span>` : ""}${esc(a.title)}</div>
        <div class="s">${usd(a.usd)} at ${cents(a.price)}${a.url ? ` · ${marketLink(a.url)}` : ""}${usInline(a.us)}</div></div><div class="r s">${ago(a.at)}</div></div>`).join("")}</div>`
      : `<p class="pf-empty">${trades ? "No trades yet." : "No buys in the last 30 days."}</p>`;
  }

  app.innerHTML = `${pf.from === "explore" ? `<a class="back" href="#/traders/explore">← Explore</a>` : `<a class="back" href="#/traders">← Traders</a>`}
    <div class="pf-head">${avatar(s.wallet, 64)}
      <div class="grow"><div class="pf-name"><h1>${esc(name)}</h1>${tier(s.segment, true)}</div><div class="pf-tag">${[cats[0]?.category, s.last_buy ? `active ${ago(s.last_buy)}` : null, checkedAt ? `checked ${ago(checkedAt * 1000)}` : null].filter(Boolean).map(esc).join(" · ")}${cats[0] || s.last_buy || checkedAt ? " · " : ""}${profileLink(`https://polymarket.com/profile/${s.wallet}`)}</div></div>
      <div class="pf-cta"><div id="follow" class="pf-follow" data-wallet="${esc(s.wallet)}"></div>${copyStatus}</div></div>
    <div class="pf-grid">
      <section class="pf-card pf-sum" aria-label="Their numbers">
        <div class="pf-card-head"><h2>Their numbers</h2>${period}</div>
        <div class="pf-hero"><span>${esc(nums.hero.k)}</span><b>${nums.hero.v ?? "—"}</b><small>${esc(nums.hero.sub)}</small></div>
        <dl class="pf-rows">${nums.summary.map(numberRow).join("")}</dl>
      </section>
      <section class="pf-card pf-chart"><div class="pf-card-head"><h2>Trading profit, ${PF_PERIOD[n]}</h2></div>
        ${chart ? `${chart.svg}<div class="pf-legend"><span><i></i>Below their previous high</span><span>Profit taken plus positions still open</span></div>`
          : `<p class="pf-empty">Their profit history isn't available yet.</p>`}</section>
      <section class="pf-card pf-det" aria-label="More of their numbers">
        ${nums.groups.map((g) => `<h3>${esc(g.title)}</h3><dl class="pf-rows">${g.rows.map(numberRow).join("")}</dl>`).join("")}
        ${s.periods ? `<p class="pf-statnote">Only realized P&L and the chart follow ${Object.keys(PF_PERIOD).map((p) => p.toUpperCase()).join("/")}. Every other figure names its own period.</p>` : ""}
      </section>
      <div class="pf-rest">
        <section class="pf-card"><h2>Why they're here</h2>
          ${why.listed ? `<p class="pf-verdict">${esc(why.listed)}</p>` : ""}
          <p class="pf-copying" id="pfcopy">${boldStatus(why.copying || s.copy_why || `${copyLabel(s)}.`)}${s.copy_return != null ? ` ${esc(copyFigure(s))}.` : ""}</p>
          ${risks.length ? `<div class="pf-warn">${WARN_ICON}<p>${risks.map(esc).join(" ")}</p></div>` : ""}
          ${lastAt ? `<dl class="pf-facts"><dt>Last bought</dt><dd>${ago(lastAt)} · <button type="button" class="link" id="pfactivity">See activity</button></dd></dl>` : ""}
        </section>
        ${s.directory && s.directory.group === "limited" && s.directory.evidence === "quick" ? `<section class="pf-card"><h2>What we know so far</h2>
          <p class="pf-copying">Limited evidence: fewer than 8 bets in the last 30 days, which is too few to judge skill either way.</p>
          <dl class="pf-facts">${evidenceFacts(s.directory).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>` : ""}
        <div class="pf-tabs" role="tablist">${[["positions", "Positions"], ["activity", "Activity"]].map(([k, l]) => `<button type="button" role="tab" data-pftab="${k}" aria-selected="${pf.tab === k}">${l}</button>`).join("")}</div>
        <div>${body}</div>
        <details class="fold"><summary>How we measure this</summary><h3 class="pf-more">More figures</h3><dl class="pf-rows">${nums.fold.map(numberRow).join("")}</dl>${worthDetails(s)}</details>
      </div>
    </div>`;
  $$("[data-pfperiod]", app).forEach((b) => (b.onclick = () => { pf.period = b.dataset.pfperiod; renderProfile(); }));
  $$("[data-pftab]", app).forEach((b) => (b.onclick = () => { pf.tab = b.dataset.pftab; renderProfile(); }));
  $("#whycopy", app).onclick = () => {
    const el = $("#pfcopy", app);
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1800);
  };
  const act = $("#pfactivity", app);
  if (act) act.onclick = () => { pf.tab = "activity"; renderProfile(); $(".pf-tabs", app)?.scrollIntoView({ block: "start", behavior: "smooth" }); };
  bindActions(app);
  redrawFollow();
}

function worthDetails(s) {
  const mark = (p) => p === true ? "✓" : p === false ? "✗" : "?";
  const delays = [["60", "1 min"], ["300", "5 min"], ["900", "15 min"], ["3600", "1 hour"]];
  const conf = { high: "high confidence", medium: "medium confidence", low: "low confidence" }[s.confidence] || "";
  return `
    <p class="note">${esc(sdkText(s.source))} · last ${Math.round((new Date(s.window[1]) - new Date(s.window[0])) / 864e5)} days · ${plural(s.bets, "separate trade")} checked · ${conf}
      · <a class="ext" href="https://polymarket.com/profile/${esc(s.wallet)}" target="_blank" rel="noopener">${INTL} profile ↗</a></p>
    <h3>What the numbers mean</h3><ul>
      <li><b>Usual opening buy:</b> the middle of their first buys into each position over the ${readPeriod(s)}. Adding to a position isn't counted.</li>
      <li><b>New positions:</b> how many outcomes they bought into for the first time, a day.</li>
      <li><b>Closed positions</b> (the Positions tab): their last 50, from Polymarket, which leaves out settled positions they never redeemed. "Sold" means they sold at least half before the market settled.</li>
      ${readDays(s) < 30 ? `<li>They trade a lot: we read their last 5,000 fills, which go back ${readDays(s)} days, not 30.</li>` : ""}
    </ul>
    <h3>The checks</h3><ul class="checks">${s.checks.map((c) => `<li><b>${mark(c.passed)}</b><div><b>${esc(sdkText(c.title))}.</b> ${esc(sdkText(c.detail))}</div></li>`).join("")}</ul>
    <h3>How the price moved after they bought</h3><p class="note">Average over their trades, in cents a contract, with the 95% margin. Positive means it moved their way.${s.edge?.z != null ? ` How sure we are it's more than chance: z ${s.edge.z.toFixed(1)}, the average move in standard errors away from zero.` : ""}</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>After</th><th class="n">Their way</th><th class="n">± margin</th><th class="n">Trades</th></tr></thead><tbody>
      ${delays.map(([k, l]) => { const d = s.edge_by_delay[k]; return `<tr><td>${l}</td><td class="n">${pl(d?.mean, centsSigned(d?.mean))}</td><td class="n">${d ? centsSigned(d.margin).replace("+", "") : "—"}</td><td class="n">${d?.n ?? "—"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h3>By category</h3>${s.categories.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Category</th><th class="n">Trades</th><th class="n">Their way, 5 min</th><th class="n">Copying, after fees</th></tr></thead><tbody>
      ${s.categories.map((c) => `<tr><td>${esc(c.category)}${c.strong ? " ✓" : ""}</td><td class="n">${c.bets}</td><td class="n">${pl(c.edge?.mean, centsSigned(c.edge?.mean))}</td><td class="n">${pl(c.copy?.mean, centsSigned(c.copy?.mean))}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="note">No trades checked.</p>`}
    <h3>Trades we checked</h3><p class="note">"Copy" is what buying 1 to 6 minutes later made by the hour mark, after the fee.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>Trade</th><th class="n">Paid</th><th class="n">5 min</th><th class="n">1 hour</th><th class="n">Copy</th></tr></thead><tbody>
      ${(s.sample || []).slice(0, 30).map((b) => `<tr><td>${esc(b.title || b.market)}<div class="s">${esc(b.outcome || "")} · ${esc(b.category)} · ${ago(b.at)}${b.url ? ` · ${marketLink(b.url)}` : ""}</div></td>
        <td class="n">${cents(b.price)}</td><td class="n">${pl(b.moved["300"], centsSigned(b.moved["300"]))}</td><td class="n">${pl(b.moved["3600"], centsSigned(b.moved["3600"]))}</td><td class="n">${pl(b.copy, centsSigned(b.copy))}</td></tr>`).join("")}
    </tbody></table></div>`;
}

async function loadOpenTrades(s, venue = "polymarket", id = s.wallet) {
  const box = $("#open");
  let d;
  try { d = await api(`/api/trader/${venue}/${encodeURIComponent(id)}`); } catch (e) { if (box.isConnected) box.innerHTML = `<p class="inline-err">${esc(e.message)}</p>`; return; }
  if (!box.isConnected) return;
  if (d.visibility === "hidden") { box.innerHTML = `<div class="card">${emptyState("Hidden by the trader", "They hide their trades on Kalshi, so they can't be shown here.")}</div>`; return; }
  const order = { in: 0, moved: 1 };
  const bets = d.positions.map((p) => ({ title: p.title || p.market, outcome: p.outcome, price: p.avg_price, price_now: p.current_price,
    usd: p.avg_price != null ? p.avg_price * p.size : p.value, size: p.size, status: p.status, url: p.url, us: p.us, venue }))
    .sort((a, b) => (order[a.status] ?? 2) - (order[b.status] ?? 2) || (b.usd || 0) - (a.usd || 0)).slice(0, 12);
  shown = bets;
  box.innerHTML = bets.length ? `<div class="cards">${bets.map((b, i) => tradeCard(b, i, { who: false })).join("")}</div>` : `<div class="card">${emptyState("No open trades")}</div>`;
  bindActions(box);
}

// ---- a trader from the venue leaderboards (Kalshi or Polymarket) ----

  const t = d.trader, s = d.stats, hidden = d.visibility === "hidden";
  const name = displayName(t.name, t.id);
  const tiles = venue === "kalshi"
    ? [["Contracts traded", t.volume != null ? usd(t.volume).slice(1) : "—"], ["Markets traded", s.markets_traded?.toLocaleString() ?? "—"]]
    : [["Traded", usd(s.volume_usd)], ["Biggest win", usd(s.biggest_win)]];
  app.innerHTML = `${back}
    <div class="th">${avatar(`${venue}:${t.id}`, 64)}<div style="min-width:0"><h1 class="name">${esc(name)}</h1>
      <div class="badges"><span class="tier t3">${VENUE[venue]}</span>${t.x_handle ? `<span class="badge">@${esc(t.x_handle)}</span>` : ""}</div>
      ${t.url ? `<div class="badges">${profileLink(t.url, venue)}</div>` : ""}</div></div>
    ${venue === "polymarket" ? `<div class="hero"><div class="big">${pl(s.trading_pnl, usd(s.trading_pnl, true))}</div><div class="cap">Profit from trading, all time${s.income ? ` · rewards and rebates (${usd(s.income)}) not counted` : ""}</div></div>`
      : `<div class="hero"><div class="big">${pl(s.pnl, usd(s.pnl, true))}</div><div class="cap">Profit, all time</div></div>`}
    ${d.bio ? `<p class="reason">${esc(d.bio)}</p>` : ""}
    <div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><span>${k}</span><b>${v}</b></div>`).join("")}</div>
    ${venue === "polymarket" ? `<p class="foot-note"><a class="link" href="#/worth/${esc(t.id)}">Is ${esc(name)} worth following? See their record →</a></p>` : ""}
    ${kalshiOn() ? `<h2 class="h2">Same person on ${venue === "kalshi" ? "Polymarket" : "Kalshi"}?</h2><div class="card" id="links"><p class="muted" style="margin:0">Checking both venues (up to 30 seconds)…</p></div>` : ""}
    <h2 class="h2">Open trades</h2><div id="open">${skelCards(2)}</div>
    <h2 class="h2">Recent trades</h2>${hidden ? `<div class="card">${emptyState("Hidden by the trader")}</div>` : d.trades.length ? `<div class="list">${d.trades.slice(0, 20).map((x) => `<div class="row"><div><div class="t">${esc(x.title || x.market)}</div>
      <div class="s">${x.action === "buy" ? "Bought" : "Sold"} ${esc(x.outcome && x.venue === "polymarket" ? x.outcome : x.outcome ? `${x.side.toUpperCase()} · ${x.outcome}` : x.side.toUpperCase())} at ${cents(x.price)} · ${ago(x.at)}${x.url ? ` · ${marketLink(x.url, `${VENUE[x.venue]} ↗`)}` : ""}${x.venue === "polymarket" ? usInline(x.us) : ""}</div></div><div class="r">${usd(x.usd)}</div></div>`).join("")}</div>` : `<div class="card">${emptyState("No recent trades")}</div>`}`;
  loadOpenTrades(null, venue, id);
  if (kalshiOn()) loadLinks(venue, id); // it reads the other venue: only when Signals reads both
}

async function loadLinks(venue, id) {
  const box = $("#links");
  try {
    const r = await api(`/api/links/${venue}/${encodeURIComponent(id)}`);
    if (!box.isConnected) return;
    if (!r.links.length) {
      box.innerHTML = `<p style="margin:0">No account looks like the same person.</p><p class="explain">We check for the same name or X handle on an active account, and trades in the same markets, the same way, within 5 minutes.${r.needs_layer_key ? " Add a Layer API key to compare trades across venues." : ""}</p>`;
      return;
    }
    box.innerHTML = r.links.map((l) => `<div style="padding:4px 0 12px">
        <a href="#/t/${l.trader.venue}/${encodeURIComponent(l.trader.id)}" style="display:flex;align-items:center;gap:10px">${avatar(`${l.trader.venue}:${l.trader.id}`, 32)}<span class="name">${esc(displayName(l.trader.name, l.trader.id))}</span>
        <span class="tier ${l.tier === "likely" ? "t2" : "t3"}">${l.tier === "likely" ? "Likely the same person" : "Possibly the same person"}</span></a>
        <ul class="explain" style="padding-left:18px;margin:8px 0 0">${l.evidence.map((e) => `<li>${esc(sdkText(e.detail))}</li>`).join("")}</ul></div>`).join("")
      + `<p class="explain" style="margin:0">An inference from public trading, not a confirmed identity.</p>`;
  } catch (e) { if (box.isConnected) box.innerHTML = `<p class="inline-err" style="margin:0">${esc(e.message)}</p>`; }
}

// ---- an alert's "Check your price": that one trade, as a Feed card, with its sheet open ----
async function checkPage(wallet, market) {
  const app = $("#app"), back = `<a class="back" href="#/">← Feed</a>`;

// ---- routing ----
// usesignals.app with no hash lands on Traders. #/ the Feed's Following (alerts link there) · #/recommended its Recommended · #/big Big trades · #/traders[/top|/explore] · #/worth/<wallet> · #/t/<venue>/<id> ·
// #/check/<wallet>/<market> (an alert's "Check your price").
// Old links still work: Big trades used to be #/traders/big; My trades (#/mine, #/copied) went with the sandbox.
const OLD = { "#/live": "#/", "#/worth": "#/traders", "#/copied": "#/", "#/mine": "#/", "#/traders/big": "#/big" };
// ---- analytics (PostHog): how people use the page, off unless the engine has a project key (/api/config) ----
// Page views (each hash route counts as one), clicks, scroll depth and session replay. Loaded through /lyr on our
// domain (web/vercel.json) so ad blockers don't drop it. A signed-in person is known by their Clerk user id only,
// never a name, email or Telegram account: replays mask every field, and the text and pictures in Clerk's
// sign-in and account menus.
let analyticsOn = false;
const CLERK_UI = ['[class^="cl-"]', '[class*=" cl-"]'];
function startAnalytics(key) {
  loadScript("/lyr/static/array.js").then(() => {
    window.posthog.init(key, {
      api_host: "/lyr", ui_host: "https://us.posthog.com", defaults: "2026-05-30",
      capture_pageview: { path: true, hash: true },
      session_recording: { maskAllInputs: true, maskTextSelector: CLERK_UI.join(", "), blockSelector: CLERK_UI.map((c) => `${c} img`).join(", ") },
    });
    analyticsOn = true;
    if (auth.uid) window.posthog.identify(auth.uid);
  }).catch(() => {}); // blocked or down: the page works the same without it
}
// Signing in links this browser's visits to the account; signing out starts a new anonymous visitor.
function analyticsAccount(uid, was) {
  if (!analyticsOn) return;
  if (uid) window.posthog.identify(uid);
  else if (was) window.posthog.reset();
}

function routeName() {
  const h = location.hash || "#/traders"; // landing on the site: Traders, which needs no account
  if (h === "#/" || h === "#") return "feed";
  if (h === "#/big") return "feed:big";
  if (h === "#/recommended") return "feed:rec";
  if (h === "#/traders") return "traders:worth";
  if (h === "#/traders/top") return "traders:top";
  if (h === "#/traders/explore") return exploreOn ? "traders:explore" : "traders:worth";
  if (h === "#/traders/passed") return exploreOn ? "traders:passed" : "traders:worth";
  return h;
}
function venueOffPage(venue) {
  $("#app").innerHTML = `<a class="back" href="#/traders">← Traders</a>${emptyState(`${esc(VENUE[venue] || venue)} isn't in Signals right now`,
    "Signals covers Polymarket traders for now.", `<a class="btn ghost" href="#/traders">See the traders</a>`)}`;
}
function route() {
  if (OLD[location.hash]) { location.replace(OLD[location.hash]); return; }
  closeSheet(); clearTimeout(feedTimer); clearTimeout(worthTimer);
  const name = routeName();
  const w = location.hash.match(/^#\/worth\/(0x[0-9a-fA-F]{40})$/);
  const check = location.hash.match(/^#\/check\/(0x[0-9a-fA-F]{40})\/([^/]+)$/);
  const t = location.hash.match(/^#\/t\/(kalshi|polymarket)\/(.+)$/);
  const tab = name.startsWith("feed") || check ? "feed" : "traders";
  $$("[data-tab]").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  $("#app").classList.toggle("narrow", name === "traders:top" || !!t); // one width everywhere else, header included
  window.scrollTo(0, 0);
  const gated = name.startsWith("feed") || !!check; // the Feed's pages: signed in only; the rest needs no account
  const onboarding = interests === null && (name.startsWith("feed") || name === "traders:worth"); // first run; links to a trader skip it
  drawnGate = gated && !onboarding ? gateState() : null;
  if (onboarding) onboardingPage();
  else if (gated && drawnGate !== "open") signInPage();
  else if (name.startsWith("feed")) feedPage(feedView());
  else if (name.startsWith("traders:")) tradersPage(name.split(":")[1]);
  else if (w) worthTraderPage(w[1].toLowerCase());
  else if (check) checkPage(check[1].toLowerCase(), decodeURIComponent(check[2]));
  else if (t && !venuesOn.includes(t[1])) venueOffPage(t[1]); // an old link to a Kalshi trader
  else if (t) traderPage(t[1], decodeURIComponent(t[2]));
  else location.replace("#/traders");
}
window.addEventListener("hashchange", route);
api("/api/config").then((c) => {
  venuesOn = c.venues; exploreOn = !!c.explore;
  if (c.clerk_key) startAuth(c.clerk_key, c.alerts);
  if (c.posthog_key) startAnalytics(c.posthog_key);
})
  .catch(() => {}).finally(route); // without it: Polymarket only, and no signing in
</script>
</body>
</html>
