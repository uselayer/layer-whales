      ${avatar(t.trader ? `${t.venue}:${t.trader}` : "anon", 36)}
      <span class="tmain"><span class="line"><span class="name">${t.trader ? esc(displayName(t.name, t.trader)) : "Anonymous"}</span><span class="muted" style="font-size:13px">${VENUE[t.venue]} · ${ago(t.at)}</span></span>
        <span class="sub" style="color:var(--fg);font-size:14px">${esc(t.title || t.market)}</span>
        <span class="sub">${t.action === "buy" ? "Bought" : "Sold"} ${esc(t.outcome || t.side.toUpperCase())} at ${cents(t.price)}${t.url ? ` · ${marketLink(t.url, `${VENUE[t.venue]} ↗`)}` : ""}</span></span>
      <span class="tnum"><b>${usd(t.usd)}</b></span></div>`).join("")}</div>
    <p class="foot-note">Kalshi only names traders who turned on their social profile.</p>` : emptyState("No big trades right now", "Trades of $250 or more show up here as they happen."));
  bindActions(box);
}

// ---- a Polymarket trader we've scored: their profile ----
// Header with the copy action, a stat strip, the profit chart, why they're here, then Positions / Activity /
// Stats. Same helpers as the leaderboard (profitOf, weeksUp, isCopyable, lbPct), so the two always agree. A
// figure the data doesn't have yet (wallet, exits, price range: the SDK's next release) shows "—".
const pf = { period: "30d", tab: "positions", s: null, detail: null };
const PF_PERIOD = { "7d": "7 days", "30d": "30 days", "90d": "90 days" };

async function worthTraderPage(wallet) {
  const app = $("#app");
  const back = `<a class="back" href="#/traders">← Traders</a>`;
  app.innerHTML = `${back}<div class="pf-head">${avatar(wallet, 64)}<div class="grow"><div class="skel" style="width:40%;height:24px"></div><div class="skel" style="width:25%;height:14px;margin-top:10px"></div></div></div>
    <p class="muted" style="margin-top:24px">Checking this trader's trades (up to a minute)…</p>`;
  let s;
  try { s = await api(`/api/worth/${wallet}`); } catch (e) { app.innerHTML = back + errorState(e.message); bindActions(app); return; }
  if (location.hash !== `#/worth/${wallet}`) return;
  Object.assign(pf, { s, detail: null, tab: "positions", period: s.periods ? pf.period : "30d" });
  if (!copy) await loadCopy();
  renderProfile();
  try { pf.detail = await api(`/api/trader/polymarket/${wallet}`); } catch (e) { pf.detail = { error: e.message }; }
  if (location.hash === `#/worth/${wallet}` && pf.s === s) renderProfile();
}

function pfChart(s, n) {
  const days = { "7d": 7, "30d": 30, "90d": 90 }[n];
  const raw = (s.pnl_daily || []).slice(-(days + 1)).map((p) => p[1]);
  if (raw.length < 2) return null;
  const pts = raw.map((v) => v - raw[0]); // profit over the period, from 0
  const W = 640, H = 230, L = 58, R = 12, T = 12, B = 26;
  const lo = Math.min(0, ...pts), hi = Math.max(0, ...pts), pad = (hi - lo) * 0.08 || 1, y0 = lo - pad, y1 = hi + pad;
  const X = (i) => L + (i / (pts.length - 1)) * (W - L - R), Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const xy = (v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`;
  let peak = -Infinity, worst = 0;
  const peaks = pts.map((v) => { peak = Math.max(peak, v); worst = Math.max(worst, peak - v); return peak; });
  const line = pts.map(xy).join(" "), last = pts.length - 1;
  const tone = pts[last] > 0 ? "var(--gain)" : pts[last] < 0 ? "var(--loss)" : "var(--fg)";
  const ticks = [lo, 0, hi].filter((v, i, a) => a.findIndex((x) => Math.abs(x - v) <= (hi - lo) * 0.15) === i);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit over ${PF_PERIOD[n]}: ${usd(pts[last], true)}">
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/><text x="${L - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v === 0 ? "$0" : usd(v, true)}</text>`).join("")}
    <polygon points="${xy(0, 0)} ${line} ${X(last).toFixed(1)},${Y(0).toFixed(1)}" fill="color-mix(in srgb, ${tone} 7%, transparent)"/>
    <polygon points="${peaks.map(xy).join(" ")} ${pts.map(xy).reverse().join(" ")}" fill="var(--line)"/>
    <polyline points="${line}" fill="none" stroke="${tone}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last).toFixed(1)}" cy="${Y(pts[last]).toFixed(1)}" r="4" fill="${tone}"/>
    <text x="${L}" y="${H - 6}">${PF_PERIOD[n]} ago</text><text x="${W - R}" y="${H - 6}" text-anchor="end">Today</text></svg>`;
  return { svg, worst };
}

function renderProfile() {
  const s = pf.s, d = pf.detail, n = pf.period, app = $("#app");
  if (!s || !app) return;
  const t = { venue: "polymarket", id: s.wallet, name: s.name };
  const name = displayName(s.name, s.wallet);
  const cats = s.categories || [], total = cats.reduce((a, c) => a + (c.bets || 0), 0);
  const profit = profitOf(s, n), perDollar = perDollarOf(s, n), up = weeksUp(s);
  const wallet = s.cash_usd ?? s.positions_value ?? null;
  const share = wallet && s.typical_usd != null ? s.typical_usd / wallet : null;
  const allTime = s.trading_pnl ?? s.pnl;
  const without = allTime != null && s.biggest_win != null ? allTime - s.biggest_win : null;
  const gap = s.edge_by_delay?.["60"]?.mean; // how far the price had moved their way by the time a copy gets in
  const band = Array.isArray(s.price_band) ? `${cents(s.price_band[0])}–${cents(s.price_band[1])}` : null;
  const chart = pfChart(s, n);
  const copied = isCopied(t.venue, t.id), can = isCopyable(s);
  const cta = copied || can ? copyButton(t) : `<button class="btn" disabled>Copying isn't offered</button>`;
  const ctaNote = copied ? "" : can ? "Copyable: copies get similar prices" : s.segment === "too_fast" ? "Too fast to copy: the price moves before a copy gets in" : "Not recommended";
  const period = (cls) => s.periods ? `<div class="lb-period ${cls}" role="group" aria-label="Period">${Object.keys(PF_PERIOD).map((p) => `<button type="button" data-pfperiod="${p}" aria-pressed="${n === p}">${p.toUpperCase()}</button>`).join("")}</div>` : "";

  // why they're here: three plain sentences, plus the SDK's own warnings
  const consistent = [up != null ? `In profit ${up} of the last 12 weeks` : null, s.settled ? `won ${s.won} of ${s.settled} settled trades` : null].filter(Boolean).join("; ");
  const steady = without == null ? "" : without > 0 ? " Still in profit without their biggest win." : ` Most of their profit is one win (${usd(s.biggest_win)}).`;
  const how = [cats.slice(0, 2).map((c) => c.category).join(" and ") || null, band ? `buys around ${band}` : s.avg_price != null ? `pays ${cents(s.avg_price)} on average` : null,
    s.typical_usd != null ? `usually ${usd(s.typical_usd)}${share != null ? ` (${lbPct(share).replace("+", "")} of their wallet)` : ""}` : null,
    s.trades_per_day != null ? perDayText(s.trades_per_day) : null, s.held_to_settlement != null ? `holds ${Math.round(s.held_to_settlement * 100)}% to settlement` : null].filter(Boolean).join(", ");
  const copyWhy = `${can ? "Yes" : s.segment === "too_fast" ? "Not really" : "Not recommended"}: ${gap != null ? `a copy a few minutes late paid about ${centsSigned(gap).replace("+", "")} more than they did` : "we couldn't measure the price a copy would get"}${s.copy_return != null ? `, and copies made ${lbPct(s.copy_return)} after fees` : ""}.`;
  const risks = (s.risks || []).map(sdkText);

  // the tabs
  let body;
  if (pf.tab === "positions") {
    const open = d && !d.error ? (d.positions || []).map((p) => ({ title: p.title || p.market, outcome: p.outcome, size: p.size, price: p.avg_price, now: p.current_price, status: p.status, url: p.url }))
      .filter((p) => !["won", "lost", "closed"].includes(p.status)) : null;
    const closedSdk = d && Array.isArray(d.closed) ? d.closed : null;
    const settled = (s.sample || []).filter((b) => b.payout != null).slice(0, 10);
    const openRow = (p) => `<div class="pf-li"><div><div class="t">${esc(p.title)}</div><div class="s">${p.outcome ? `<span class="pf-oc">${esc(p.outcome)}</span>` : ""}${p.size != null ? `${Math.round(p.size).toLocaleString()} at ${cents(p.price)} · ${usd((p.price ?? 0) * p.size)}` : ""}${p.now != null ? ` · now ${cents(p.now)}` : ""}${p.url ? ` · ${marketLink(p.url)}` : ""}</div></div><div class="r">${statusLine(p.status)}</div></div>`;
    const closedRow = (c) => `<div class="pf-li"><div><div class="t">${esc(c.title || c.market)}</div><div class="s">${c.outcome ? `<span class="pf-oc">${esc(c.outcome)}</span>` : ""}${c.size != null ? `${Math.round(c.size).toLocaleString()} at ${cents(c.avg_price)}` : `bought at ${cents(c.price)}`}${c.exit_price != null && c.result === "sold" ? ` · sold at ${cents(c.exit_price)}` : ""}${c.pnl != null ? ` · ${pl(c.pnl, usd(c.pnl, true))}` : ""} · ${ago(c.closed_at || c.at)}${c.url ? ` · ${marketLink(c.url)}` : ""}</div></div>
      <div class="r">${statusLine(c.result === "sold" ? "closed" : c.result || (c.payout === 1 ? "won" : "lost"))}</div></div>`;
    body = `<p class="pf-sec">Open</p>${open == null ? (d?.error ? `<p class="inline-err">${esc(d.error)}</p>` : `<div class="skel" style="width:60%;height:14px;margin:16px 0"></div>`)
        : open.length ? `<div>${open.slice(0, 12).map(openRow).join("")}</div>` : `<p class="pf-empty">No open trades.</p>`}
      <p class="pf-sec">Closed${closedSdk ? "" : " · settled trades we checked"}</p>
      ${(closedSdk || settled).length ? `<div>${(closedSdk || settled).slice(0, 12).map(closedRow).join("")}</div>` : `<p class="pf-empty">No settled trades yet. Results show up once their markets settle.</p>`}`;
  } else if (pf.tab === "activity") {
    const trades = d && !d.error ? d.trades || [] : null;
    const act = trades ? trades.map((x) => ({ sell: x.action === "sell", title: x.title || x.market, outcome: x.outcome, usd: x.usd, price: x.price, at: x.at, url: x.url }))
      : (s.recent || []).map((b) => ({ sell: false, title: b.title || b.market, outcome: b.outcome, usd: b.usd, price: b.price, at: b.at, url: b.url }));
    body = act.length ? `<div>${act.slice(0, 20).map((a) => `<div class="pf-li"><div><div class="t">${a.sell ? "Sold" : "Bought"} ${a.outcome ? `<span class="pf-oc">${esc(a.outcome)}</span>` : ""}${esc(a.title)}</div>
        <div class="s">${usd(a.usd)} at ${cents(a.price)}${a.url ? ` · ${marketLink(a.url)}` : ""}</div></div><div class="r s">${ago(a.at)}</div></div>`).join("")}</div>`
      : `<p class="pf-empty">No trades in the last 30 days.</p>`;
  } else {
    const weeks = s.pnl_weeks || [];
    let run = 0, longest = 0; for (const w of weeks) { run = w < 0 ? run + 1 : 0; longest = Math.max(longest, run); }
    const worst90 = pfChart(s, "90d")?.worst;
    const dash = `<span class="lb-none">—</span>`;
    body = `<div class="pf-group"><h3>Consistency</h3><div class="pf-kv">
        <div><span>Weeks in profit</span><b>${up != null ? `${up} of 12` : dash}</b></div><div><span>Won</span><b>${s.settled ? `${s.won} of ${s.settled} settled` : dash}</b></div>
        <div><span>All time without their biggest win</span><b>${without != null ? pl(without, usd(without, true)) : dash}</b></div><div><span>Longest run of losing weeks</span><b>${weeks.length ? longest : dash}</b></div></div></div>
      <div class="pf-group"><h3>Risk</h3><div class="pf-kv">
        <div><span>Usual trade</span><b>${s.typical_usd != null ? usd(s.typical_usd) : dash}</b></div><div><span>Of their wallet</span><b>${share != null ? lbPct(share).replace("+", "") : dash}</b></div>
        <div><span>Biggest win</span><b>${s.biggest_win != null ? usd(s.biggest_win) : dash}</b></div><div><span>Worst drop from a high, 90 days</span><b>${worst90 != null ? usd(-worst90) : dash}</b></div></div></div>
      <div class="pf-group"><h3>Style</h3>
        ${total ? `<div class="pf-mix" aria-hidden="true">${cats.slice(0, 4).map((c) => `<i style="flex:${c.bets}"></i>`).join("")}</div>` : ""}
        <div class="pf-kv"><div><span>Markets</span><b>${total ? cats.slice(0, 3).map((c) => `${esc(c.category)} ${Math.round((100 * c.bets) / total)}%`).join(" · ") : dash}</b></div>
        <div><span>Usual price</span><b>${band || (s.avg_price != null ? `${cents(s.avg_price)} on average` : dash)}</b></div>
        <div><span>Trades</span><b>${s.trades_per_day != null ? perDayText(s.trades_per_day) : dash}</b></div><div><span>Held until the market settles</span><b>${s.held_to_settlement != null ? `${Math.round(s.held_to_settlement * 100)}%` : dash}</b></div></div></div>
      <div class="pf-group"><h3>Execution</h3><div class="pf-kv">
        <div><span>Resting orders (maker)</span><b>${s.maker_share != null ? `${Math.round(s.maker_share * 100)}%` : dash}</b></div><div><span>Price gap for a copy a few minutes late</span><b>${gap != null ? centsSigned(gap).replace("+", "") : dash}</b></div></div></div>
      <details class="fold"><summary>How we measure this</summary>${worthDetails(s)}</details>`;
  }

  app.innerHTML = `<a class="back" href="#/traders">← Traders</a>
    <div class="pf-head">${avatar(s.wallet, 64)}
      <div class="grow"><h1>${esc(name)}</h1><div class="pf-tag">${[cats[0]?.category, s.last_buy ? `active ${ago(s.last_buy)}` : null].filter(Boolean).map(esc).join(" · ")}${cats[0] || s.last_buy ? " · " : ""}${profileLink(`https://polymarket.com/profile/${s.wallet}`)}</div></div>
      <div class="pf-cta">${cta}${ctaNote ? `<small>${ctaNote}</small>` : ""}<small id="made" hidden></small></div></div>
    <div class="pf-stats">
      <div class="pf-stat"><span>Profit, ${PF_PERIOD[n]}</span><b>${profit != null ? pl(profit, usd(profit, true)) : "—"}</b><small>${perDollar != null ? `${lbPct(perDollar)} per $ traded` : "trading profit"}</small></div>
      <div class="pf-stat"><span>Weeks in profit</span><b>${up != null ? `${up} of 12` : "—"}</b><small>last 12 weeks</small></div>
      <div class="pf-stat"><span>Won</span><b>${s.settled ? `${s.won} of ${s.settled}` : "—"}</b><small>settled trades</small></div>
      <div class="pf-stat"><span>Usual trade</span><b>${s.typical_usd != null ? usd(s.typical_usd) : "—"}</b><small>${share != null ? `${lbPct(share).replace("+", "")} of their wallet` : s.trades_per_day != null ? perDayText(s.trades_per_day) : ""}</small></div>
      <div class="pf-stat"><span>Wallet</span><b>${wallet != null ? usd(wallet) : "—"}</b><small>on Polymarket</small></div>
    </div>
    <section class="pf-card pf-chart"><div class="pf-card-head"><h2>Profit</h2>${period("")}</div>
      ${chart ? `${chart.svg}<div class="pf-legend"><span><i></i>Below their previous high</span><span>Worst drop: ${usd(-chart.worst)}</span></div>`
        : `<p class="pf-empty">Their profit history isn't available yet.</p>`}</section>
    <section class="pf-card"><h2>Why they're here</h2><div class="pf-why">
      <div><b>Consistent</b><p>${consistent ? `${esc(consistent.charAt(0).toUpperCase() + consistent.slice(1))}.` : "Too few settled trades to say yet."}${steady}</p></div>
      <div><b>How they trade</b><p>${how ? `${esc(how.charAt(0).toUpperCase() + how.slice(1))}.` : "—"}</p></div>
      <div><b>Can you copy them</b><p>${esc(copyWhy)}</p></div>
      ${risks.length ? `<div><b>Worth knowing</b><p>${risks.map(esc).join(" ")}</p></div>` : ""}
    </div></section>
    <div class="pf-tabs" role="tablist">${[["positions", "Positions"], ["activity", "Activity"], ["stats", "Stats"]].map(([k, l]) => `<button type="button" role="tab" data-pftab="${k}" aria-selected="${pf.tab === k}">${l}</button>`).join("")}</div>
    <div>${body}</div>`;
  $$("[data-pfperiod]", app).forEach((b) => (b.onclick = () => { pf.period = b.dataset.pfperiod; renderProfile(); }));
  $$("[data-pftab]", app).forEach((b) => (b.onclick = () => { pf.tab = b.dataset.pftab; renderProfile(); }));
  bindActions(app);
  fillYouMade($("#made", app), t);
}

function worthDetails(s) {
  const mark = (p) => p === true ? "✓" : p === false ? "✗" : "?";
  const delays = [["60", "1 min"], ["300", "5 min"], ["900", "15 min"], ["3600", "1 hour"]];
  const conf = { high: "high confidence", medium: "medium confidence", low: "low confidence" }[s.confidence] || "";
  return `
    <p class="note">${esc(sdkText(s.source))} · last ${Math.round((new Date(s.window[1]) - new Date(s.window[0])) / 864e5)} days · ${plural(s.bets, "separate trade")} checked · ${conf}
      · <a class="ext" href="https://polymarket.com/profile/${esc(s.wallet)}" target="_blank" rel="noopener">Polymarket profile ↗</a></p>
    <h3>The checks</h3><ul class="checks">${s.checks.map((c) => `<li><b>${mark(c.passed)}</b><div><b>${esc(sdkText(c.title))}.</b> ${esc(sdkText(c.detail))}</div></li>`).join("")}</ul>
    <h3>How the price moved after they bought</h3><p class="note">Average over their trades, in cents a contract, with the 95% margin. Positive means it moved their way.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>After</th><th class="n">Their way</th><th class="n">± margin</th><th class="n">Trades</th></tr></thead><tbody>
      ${delays.map(([k, l]) => { const d = s.edge_by_delay[k]; return `<tr><td>${l}</td><td class="n">${pl(d?.mean, centsSigned(d?.mean))}</td><td class="n">${d ? centsSigned(d.margin).replace("+", "") : "—"}</td><td class="n">${d?.n ?? "—"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h3>By category</h3>${s.categories.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Category</th><th class="n">Trades</th><th class="n">Their way, 5 min</th><th class="n">Copying, after fees</th></tr></thead><tbody>
      ${s.categories.map((c) => `<tr><td>${esc(c.category)}${c.strong ? " ✓" : ""}</td><td class="n">${c.bets}</td><td class="n">${pl(c.edge?.mean, centsSigned(c.edge?.mean))}</td><td class="n">${pl(c.copy?.mean, centsSigned(c.copy?.mean))}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="note">No trades checked.</p>`}
    <h3>Trades we checked</h3><p class="note">"Copy" is what buying 1 to 6 minutes later made by the hour mark, after the fee.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>Trade</th><th class="n">Paid</th><th class="n">5 min</th><th class="n">1 hour</th><th class="n">Copy</th></tr></thead><tbody>
      ${(s.sample || []).slice(0, 30).map((b) => `<tr><td>${esc(b.title || b.market)}<div class="s">${esc(b.outcome || "")} · ${esc(b.category)} · ${ago(b.at)}${b.url ? ` · ${marketLink(b.url)}` : ""}</div></td>
        <td class="n">${cents(b.price)}</td><td class="n">${pl(b.moved["300"], centsSigned(b.moved["300"]))}</td><td class="n">${pl(b.moved["3600"], centsSigned(b.moved["3600"]))}</td><td class="n">${pl(b.copy, centsSigned(b.copy))}</td></tr>`).join("")}
    </tbody></table></div>`;
}

async function loadOpenTrades(s, venue = "polymarket", id = s.wallet) {
  const box = $("#open");
  let d;
  try { d = await api(`/api/trader/${venue}/${encodeURIComponent(id)}`); } catch (e) { if (box.isConnected) box.innerHTML = `<p class="inline-err">${esc(e.message)}</p>`; return; }
  if (!box.isConnected) return;
  if (d.visibility === "hidden") { box.innerHTML = `<div class="card">${emptyState("Hidden by the trader", "They hide their trades on Kalshi, so they can't be copied directly.")}</div>`; return; }
  const order = { in: 0, moved: 1 };
  const bets = d.positions.map((p) => ({ title: p.title || p.market, outcome: p.outcome, price: p.avg_price, price_now: p.current_price,
    usd: p.avg_price != null ? p.avg_price * p.size : p.value, size: p.size, status: p.status, url: p.url }))
    .sort((a, b) => (order[a.status] ?? 2) - (order[b.status] ?? 2) || (b.usd || 0) - (a.usd || 0)).slice(0, 12);
  shown = bets;
  box.innerHTML = bets.length ? `<div class="cards">${bets.map((b, i) => tradeCard(b, i, { who: false })).join("")}</div>` : `<div class="card">${emptyState("No open trades")}</div>`;
  bindActions(box);
}

// What your sandbox copies of one trader have made so far: the same numbers as My trades, open ones at what
// they'd sell for now. Fills `el` in when there's anything to say; leaves it as it is otherwise.
async function fillYouMade(el, t, lead = "") {
  let d;
  try { d = await api("/api/copied"); } catch { return; }
  if (!el.isConnected) return; // the card was redrawn while we waited
  const same = (g) => String(g.trader.id).toLowerCase() === String(t.id).toLowerCase() && (g.trader.venue || "polymarket") === t.venue;
  const mine = d.groups.filter((g) => same(g) && g.you.contracts);
  if (!mine.length) return;
  const valued = mine.filter((g) => g.you.pnl != null), open = mine.filter((g) => g.you.status === "open").length;
  const made = valued.length ? valued.reduce((a, g) => a + g.you.pnl, 0) : null;
  el.innerHTML = `${lead}You made <b style="color:var(--fg)">${pl(made, money(made, true))}</b> copying them on ${plural(mine.length, "trade")}${open ? ` (${open} still open)` : ""}. <a class="link" href="#/mine">My trades</a>`;
  el.hidden = false;
}

// The copy card on a trader's page: start copying (optionally only some categories), or stop.
async function copyBox(box, t, opts = {}) {
  if (!copy) { box.innerHTML = `<div class="skel" style="width:60%;height:14px"></div>`; await loadCopy(); }
  if (!box.isConnected) return;
  const r = copy?.rules || { size: 5 };
  const on = copy?.rules.traders.find((x) => x.venue === t.venue && x.id === t.id);
  box.classList.toggle("compact", !!on);
  if (on) { // one line: you're copying, what it has made so far, Stop
    box.innerHTML = `<div class="on-row"><div style="min-width:0"><div class="head">Copying trader ✓</div>
      <p style="margin:2px 0 0" id="made">${on.categories?.length ? `Only ${esc(on.categories.join(", "))}. ` : ""}Their new buys become sandbox orders on ${VENUE[t.venue]}.</p>
      ${on.error ? `<p class="inline-err">${esc(on.error)}</p>` : ""}</div><button class="btn ghost small" id="stop">Stop</button></div>`;
    $("#stop", box).onclick = async () => { await stopCopy(t.venue, t.id); opts.redraw ? opts.redraw() : copyBox(box, t, opts); };
    fillYouMade($("#made", box), t, on.categories?.length ? `Only ${esc(on.categories.join(", "))}. ` : "");
    return;
  }
  const cats = opts.categories || [], strong = opts.strong || [];
  box.innerHTML = `<div class="head">Copy their buys</div>
    <p>Each new buy they make becomes your own sandbox order in the same market on ${VENUE[t.venue]}: ${r.size} contracts, at most 3¢ above their price, held until it settles. Real prices and fees, no real money.${opts.note ? " " + esc(opts.note) : ""}</p>
    <p id="made" hidden></p>
    ${cats.length > 1 ? `<div class="catpick">${cats.map((c) => `<button aria-pressed="${!strong.length || strong.includes(c)}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
    <button class="btn wide" id="docopy">Copy trader</button>`;
  fillYouMade($("#made", box), t);
  $$(".catpick button", box).forEach((b) => (b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true")));
  $("#docopy", box).onclick = async () => {
    $("#docopy", box).disabled = true;
    const picked = $$(".catpick button[aria-pressed=true]", box).map((b) => b.dataset.c);
    try { await startCopy(t, cats.length > 1 && picked.length < cats.length ? picked : []); copyBox(box, t, opts); }
    catch (e) { $("#docopy", box).disabled = false; box.insertAdjacentHTML("beforeend", `<p class="inline-err">${esc(e.message)}</p>`); }
  };
}

// ---- a trader from the venue leaderboards (Kalshi or Polymarket) ----
async function traderPage(venue, id) {
  const app = $("#app");
  const back = `<a class="back" href="#/traders/top">← Traders</a>`;
  app.innerHTML = `${back}<div class="th">${avatar(`${venue}:${id}`, 64)}<div style="flex:1"><div class="skel" style="width:50%;height:22px"></div></div></div>${skelCards(2)}`;
  let d;
  try { d = await api(`/api/trader/${venue}/${encodeURIComponent(id)}`); } catch (e) { app.innerHTML = back + errorState(e.message); bindActions(app); return; }
  const t = d.trader, s = d.stats, hidden = d.visibility === "hidden";
  const name = displayName(t.name, t.id);
  const tiles = venue === "kalshi"
    ? [["Contracts traded", t.volume != null ? usd(t.volume).slice(1) : "—"], ["Markets traded", s.markets_traded?.toLocaleString() ?? "—"]]
    : [["Traded", usd(s.volume_usd)], ["Biggest win", usd(s.biggest_win)]];
  app.innerHTML = `${back}
    <div class="th">${avatar(`${venue}:${t.id}`, 64)}<div style="min-width:0"><h1 class="name">${esc(name)}</h1>
      <div class="badges"><span class="tier t3">${VENUE[venue]}</span>${t.x_handle ? `<span class="badge">@${esc(t.x_handle)}</span>` : ""}</div>
      ${t.url ? `<div class="badges">${profileLink(t.url, venue)}</div>` : ""}</div></div>
    <div class="hero"><div class="big">${pl(s.pnl, usd(s.pnl, true))}</div><div class="cap">Profit, all time</div></div>
    ${d.bio ? `<p class="reason">${esc(d.bio)}</p>` : ""}
    <div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><span>${k}</span><b>${v}</b></div>`).join("")}</div>
    ${venue === "polymarket" ? `<p class="foot-note"><a class="link" href="#/worth/${esc(t.id)}">Is ${esc(name)} worth following? See their record →</a></p>` : ""}
    <div class="card copybox" id="copybox"></div>
    <h2 class="h2">Same person on ${venue === "kalshi" ? "Polymarket" : "Kalshi"}?</h2><div class="card" id="links"><p class="muted" style="margin:0">Checking both venues (up to 30 seconds)…</p></div>
    <h2 class="h2">Open trades</h2><div id="open">${skelCards(2)}</div>
    <h2 class="h2">Recent trades</h2>${hidden ? `<div class="card">${emptyState("Hidden by the trader")}</div>` : d.trades.length ? `<div class="list">${d.trades.slice(0, 20).map((x) => `<div class="row"><div><div class="t">${esc(x.title || x.market)}</div>
      <div class="s">${x.action === "buy" ? "Bought" : "Sold"} ${esc(x.outcome && x.venue === "polymarket" ? x.outcome : x.outcome ? `${x.side.toUpperCase()} · ${x.outcome}` : x.side.toUpperCase())} at ${cents(x.price)} · ${ago(x.at)}${x.url ? ` · ${marketLink(x.url, `${VENUE[x.venue]} ↗`)}` : ""}</div></div><div class="r">${usd(x.usd)}</div></div>`).join("")}</div>` : `<div class="card">${emptyState("No recent trades")}</div>`}`;
  const box = $("#copybox");
  if (hidden) box.innerHTML = `<div class="head">Can't be copied</div><p style="margin:0">${esc(name)} hides their trades on Kalshi. If they trade on Polymarket too, you can copy that account instead (see below).</p>`;
  else copyBox(box, t);
  loadOpenTrades(null, venue, id);
  loadLinks(venue, id);
}

async function loadLinks(venue, id) {
  const box = $("#links");
  try {
    const r = await api(`/api/links/${venue}/${encodeURIComponent(id)}`);
    if (!box.isConnected) return;
    if (!r.links.length) {
      box.innerHTML = `<p style="margin:0">No account looks like the same person.</p><p class="explain">We check for the same name or X handle on an active account, and trades in the same markets, the same way, within 5 minutes.${r.needs_layer_key ? " Add a Layer API key to compare trades across venues." : ""}</p>`;
      return;
    }
    box.innerHTML = r.links.map((l) => `<div style="padding:4px 0 12px">
        <a href="#/t/${l.trader.venue}/${encodeURIComponent(l.trader.id)}" style="display:flex;align-items:center;gap:10px">${avatar(`${l.trader.venue}:${l.trader.id}`, 32)}<span class="name">${esc(displayName(l.trader.name, l.trader.id))}</span>
        <span class="tier ${l.tier === "likely" ? "t2" : "t3"}">${l.tier === "likely" ? "Likely the same person" : "Possibly the same person"}</span></a>
        <ul class="explain" style="padding-left:18px;margin:8px 0 0">${l.evidence.map((e) => `<li>${esc(sdkText(e.detail))}</li>`).join("")}</ul></div>`).join("")
      + `<p class="explain" style="margin:0">An inference from public trading, not a confirmed identity.</p>`;
  } catch (e) { if (box.isConnected) box.innerHTML = `<p class="inline-err" style="margin:0">${esc(e.message)}</p>`; }
}

// ---- my trades ----
const pct = (x) => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(Math.round(x * 100))}%`;
// Your copies against the traders' own trades, on the same trades and the same contracts.
function vsLine(v) {
  const gap = v.at_their_price - v.you;
  return `On the same ${plural(v.trades, "trade")}, buying at the traders' own prices would have made ${pl(v.at_their_price, money(v.at_their_price, true))}; you made ${pl(v.you, money(v.you, true))} after fees.`
    + (Math.abs(gap) >= 0.005 ? ` Copying ${gap > 0 ? "cost" : "saved"} you ${money(Math.abs(gap))}: ${gap > 0 ? "a higher price and fees" : "a better price"}.` : "");
}
function copiedRow(g) {
  const y = g.you, th = g.theirs, who = esc(displayName(g.trader.name, g.trader.id));
  const n = g.copies.length, settled = ["won", "lost", "void"].includes(y.status);
  const each = y.contracts ? y.avg_price + y.fees / y.contracts : null; // what one of your contracts cost, fee included
  const gap = each != null && th.price != null ? each - th.price : null;
  return `<details class="crow"><summary class="row"><div><div class="t">${esc(g.source.title || g.market)}</div>
      <div class="s">${esc(g.source.outcome || (g.side || "").toUpperCase())} · copied from <a class="link" href="${traderHref(g.trader.venue || "polymarket", g.trader.id)}">${who}</a> · ${ago(g.at)}${n > 1 ? ` · ${n} copies` : ""}</div>
      <div class="s">${y.contracts || "—"} contracts at ${cents(y.avg_price)} on ${VENUE[g.venue] || g.venue}${y.status === "open" && y.value != null ? ` · now ${cents(y.value)}` : ""}</div>
      ${th.return != null && y.return != null ? `<div class="s">You ${pl(y.return, pct(y.return))} · ${who} ${pl(th.return, pct(th.return))}</div>` : ""}</div>
    <div class="r"><b>${pl(y.pnl, money(y.pnl, true))}</b><div class="s">${y.status === "won" ? pl(1, RESULT.won) : y.status === "lost" ? pl(-1, RESULT.lost) : RESULT[y.status] || "—"}</div></div></summary>
    <div class="vs"><span></span><span class="h">You</span><span class="h">${who}</span>
      <span class="k">Paid</span><b>${cents(y.avg_price)}${y.fees > 0 ? ` + ${cents(y.fees / y.contracts)} fee` : ""}</b><b>${cents(th.price)}</b>
      <span class="k">Put in</span><b>${money(y.put_in)}</b><b>${th.put_in != null ? money(th.put_in) : "—"}</b>
      <span class="k">${settled ? "Made" : "Now"}</span><b>${pl(y.pnl, money(y.pnl, true))}</b><b>${th.pnl != null ? pl(th.pnl, money(th.pnl, true)) : "—"}</b>
      <span class="k">Return</span><b>${pl(y.return, pct(y.return))}</b><b>${pl(th.return, pct(th.return))}</b></div>
    <p class="vs-note">${settled ? `Settled: each contract paid ${money(y.value)}.` : y.value != null ? `Open: both valued at ${cents(y.value)}, what a contract sells for now.` : "Open: no buyer right now, so neither is valued yet."}
      Theirs is what their buys made if held to the end, before their fees (Polymarket doesn't show those).${gap != null ? ` Each of your contracts cost ${cents(Math.abs(gap))} ${gap >= 0 ? "more" : "less"} than theirs.` : ""}
      <a class="link" href="${traderHref(g.trader.venue || "polymarket", g.trader.id)}">See ${who}'s page →</a>${g.source.url ? ` · ${marketLink(g.source.url, "Open on Polymarket ↗")}` : ""}</p>
  </details>`;
}
const RESULT = { open: "Open", won: "Won", lost: "Lost", void: "Refunded", unfilled: "Not filled" };
async function minePage() {
  const app = $("#app");
  app.innerHTML = `<div class="hero" style="margin-top:4px"><div class="skel" style="width:140px;height:40px"></div><div class="skel" style="width:200px;height:13px;margin-top:12px"></div></div>${skelCards(2)}`;
  let d;
  try { [d, copy] = await Promise.all([api("/api/copied"), api("/api/copy")]); } catch (e) { app.innerHTML = errorState(e.message); bindActions(app); return; }
  if (routeName() !== "mine") return;
  const t = d.total, r = copy.rules;
  const skipped = copy.recent.filter((e) => e.status === "skipped");
  app.innerHTML = `
    <div class="hero" style="margin-top:4px"><div class="big">${t.trades ? pl(t.net, usd(t.net, true)) : "$0"}</div>
      <div class="cap">${t.trades ? `Sandbox profit after fees on ${plural(d.by_trade.trades, "copied trade")}${d.by_trade.copies > d.by_trade.trades ? ` (${d.by_trade.copies} copies)` : ""}<span class="sep">·</span>${d.by_trade.open} open · ${d.by_trade.won} won · ${d.by_trade.lost} lost${d.by_trade.void ? ` · ${d.by_trade.void} refunded` : ""}` : "Sandbox profit · no copied trades yet"}</div></div>
    <p class="explain">Sandbox: real prices and fees, no real money. Each copy is held until its market settles; open ones count at what they'd sell for now.</p>
    ${d.vs.trades ? `<p class="explain">${vsLine(d.vs)}</p>` : ""}
    ${d.unvalued ? `<p class="explain">${plural(d.unvalued, "open trade")} ${d.unvalued === 1 ? "has" : "have"} no buyer right now, so ${d.unvalued === 1 ? "it isn't" : "they aren't"} in the total.</p>` : ""}

    <h2 class="h2">Who you're copying</h2>
    ${r.traders.length ? `<div class="list">${r.traders.map((x) => `<div class="trow norank" style="cursor:default">
        ${avatar(x.venue === "polymarket" ? x.id : `${x.venue}:${x.id}`, 36)}
        <a class="tmain" href="${traderHref(x.venue, x.id)}"><span class="name">${esc(displayName(x.name, x.id))}</span>
          <span class="sub">${VENUE[x.venue]}${x.categories?.length ? ` · only ${esc(x.categories.join(", "))}` : ""}${x.checked_s_ago != null ? ` · checked ${Math.round(x.checked_s_ago)}s ago` : ""}</span>
          ${x.error ? `<span class="inline-err" style="margin:0">${esc(x.error)}</span>` : ""}</a>
        <button class="btn ghost small" data-rm="${esc(x.venue)}/${esc(x.id)}">Stop</button></div>`).join("")}</div>`
      : `<div class="card">${emptyState("You're not copying anyone yet", "Find someone on the Feed or in Traders, then tap Copy trader.", `<a class="btn" href="#/traders">Find traders</a>`)}</div>`}

    <h2 class="h2">Copied trades</h2>
    ${d.groups.length ? `<div class="list">${d.groups.map(copiedRow).join("")}</div><p class="foot-note">Tap a trade to compare it with theirs.</p>`
      : `<div class="card">${emptyState("Nothing copied yet", "New buys from the traders you copy show up here within seconds of them making one.")}</div>`}

    ${skipped.length ? `<details class="fold"><summary>Not copied (${skipped.length} recent)</summary><div class="list">${skipped.map((e) => `<div class="row"><div><div class="t">${esc(e.source.title || e.source.market)}</div>
      <div class="s"><span class="name" style="font-weight:500">${esc(displayName(e.trader.name, e.trader.id))}</span> · ${esc(sdkText(e.reason))}${e.source.url ? ` · ${marketLink(e.source.url)}` : ""}</div></div><div class="r s">${ago(e.at)}</div></div>`).join("")}</div></details>` : ""}

    <p class="foot-note" style="margin-top:32px;text-align:center"><button class="btn ghost small" id="reset">Reset the sandbox</button><br>Stops copying everyone and clears your copied trades, so you can start fresh.</p>`;
  $$("[data-rm]").forEach((b) => (b.onclick = async () => { const [v, id] = b.dataset.rm.split("/"); await stopCopy(v, id); minePage(); }));
  $("#reset").onclick = async () => {
    const who = r.traders.length ? `stop copying ${plural(r.traders.length, "trader")} and ` : "";
    if (!confirm(`Start over? This will ${who}clear all your copied trades. You can't undo it.`)) return;
    $("#reset").disabled = true; await api("/api/paper/reset", { method: "POST" }); minePage();
  };
}

// ---- routing ----
// #/ feed · #/traders[/top|/big] · #/mine · #/worth/<wallet> · #/t/<venue>/<id>. Old links still work.
const OLD = { "#/live": "#/", "#/worth": "#/traders", "#/copied": "#/mine" };
function routeName() {
  const h = location.hash || "#/";
  if (h === "#/" || h === "#") return "feed";
  if (h === "#/traders") return "traders:worth";
  if (h === "#/traders/top") return "traders:top";
  if (h === "#/traders/big") return "traders:big";
  if (h === "#/mine") return "mine";
  return h;
}
function route() {
  if (OLD[location.hash]) { location.replace(OLD[location.hash]); return; }
  closeSheet(); clearTimeout(feedTimer); clearTimeout(worthTimer);
  const name = routeName();
  const w = location.hash.match(/^#\/worth\/(0x[0-9a-fA-F]{40})$/);
  const t = location.hash.match(/^#\/t\/(kalshi|polymarket)\/(.+)$/);
  const tab = name === "mine" ? "mine" : name === "feed" ? "feed" : "traders";
  $$("[data-tab]").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  const wide = (name === "traders:worth" && interests !== null) || location.hash.startsWith("#/worth/"); // the leaderboard and profiles need the room
  $$(".wrap").forEach((el) => el.classList.toggle("wide", wide));
  window.scrollTo(0, 0);
  if (interests === null && (name === "feed" || name === "traders:worth")) onboardingPage(); // first run; links to a trader skip it
  else if (name === "feed") feedPage();
  else if (name.startsWith("traders:")) tradersPage(name.split(":")[1]);
  else if (name === "mine") minePage();
  else if (w) worthTraderPage(w[1].toLowerCase());
  else if (t) traderPage(t[1], decodeURIComponent(t[2]));
  else location.replace("#/");
}
window.addEventListener("hashchange", route);
loadCopy().then(() => { if (onFeed()) refreshCopyButtons(); });
route();
</script>
