<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signals</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<style>
  @font-face { font-family: "Host Grotesk"; src: url(/static/fonts/HostGrotesk-latin-var.woff2) format("woff2");
    font-weight: 300 600; font-display: swap; }
  :root {
    --bg: #fafaf9; --card: #ffffff; --fg: #111112; --muted: #6c6c72; --faint: #a1a1a6; --line: #ececea;
    --soft: #f3f3f1; --green: #12a150; --green-soft: #e9f7ef; --danger: #c43d2f;
    --gain: #087f3d; --loss: #cf3426; --amber: #a86200; --teal: #0b7a83; --blue: #2557d6;
    --shadow: 0 1px 2px rgba(17, 17, 18, .04), 0 2px 8px rgba(17, 17, 18, .03);
    --av-l: 93%; --av-fg-l: 48%; --av-s: 42%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
      --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --gain: #3ccf7e; --loss: #ff7a6b; --amber: #f2b54a; --teal: #3cc6cf; --blue: #7aa2ff;
      --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
    --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --gain: #3ccf7e; --loss: #ff7a6b; --amber: #f2b54a; --teal: #3cc6cf; --blue: #7aa2ff;
    --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "Host Grotesk", -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  body.noscroll { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--muted); }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--fg); color: var(--bg); display: grid; place-items: center; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs a { padding: 7px 12px; border-radius: 999px; color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .tabs a:hover { color: var(--fg); }
  .tabs a.on { background: var(--soft); color: var(--fg); }
  .pill { margin-left: auto; font-size: 12.5px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  @media (max-width: 359px) { .pill-more { display: none; } }
  .tabbar { display: none; }
  main.wrap { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }
  footer.foot { color: var(--faint); font-size: 12.5px; padding-top: 8px; padding-bottom: 36px; text-align: center; }
  footer.foot a { color: var(--muted); }

  /* bits */
  .av { --h: 200; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
    background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 45% var(--av-fg-l)); }
  .av svg { width: 62%; height: 62%; display: block; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tier { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.35; }
  .tier.t1 { background: var(--fg); color: var(--bg); }
  .tier.t2 { border: 1px solid var(--line); color: var(--fg); padding: 1px 7px; }
  .tier.t3 { background: var(--soft); color: var(--muted); }
  .tier.s-proven { --c: var(--gain); } .tier.s-quiet { --c: var(--teal); } .tier.s-rising { --c: var(--blue); } .tier.s-fast { --c: var(--amber); }
  .tier[class*="s-"] { background: color-mix(in srgb, var(--c) 11%, var(--card)); color: color-mix(in srgb, var(--c) 80%, var(--fg)); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .badge svg { width: 13px; height: 13px; }
  .chip { display: inline-block; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 8px; background: var(--soft); color: var(--fg); }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--fg); color: var(--bg); white-space: nowrap; transition: transform .08s ease, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.wide { width: 100%; padding: 13px 16px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.done { background: var(--soft); color: var(--fg); }
  .link { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; }
  .link:hover { text-decoration-color: currentColor; }
  .sep { color: var(--faint); margin: 0 6px; }
  .gain { color: var(--gain); } .loss { color: var(--loss); }

  /* status */
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .status.in { color: var(--gain); } .status.in i { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .status.moved { color: var(--amber); } .status.moved i { background: var(--amber); }
  .status.won { color: var(--gain); } .status.won i { background: var(--gain); }
  .status.lost { color: var(--loss); } .status.lost i { background: var(--loss); }
  .status.done { color: var(--fg); } .status.done i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }

  /* feed controls */
  .follow { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .stack { display: flex; }
  .stack .av { box-shadow: 0 0 0 2px var(--bg); }
  .stack .av + .av { margin-left: -8px; }
  .follow b { font-weight: 500; font-size: 14px; white-space: nowrap; }
  .follow .chev { color: var(--faint); }
  .feedtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .updated { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .cats { display: flex; min-width: 0; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 14px;
    font-weight: 500; padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .cats button.on { background: var(--fg); color: var(--bg); box-shadow: none; }
  .cats button .n { color: var(--faint); font-weight: 400; margin-left: 4px; }
  .cats button.on .n { color: color-mix(in srgb, var(--bg) 60%, transparent); }
  .switch { position: relative; max-width: 100%; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 36px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .track { background: var(--green); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* cards */
  .cards { display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); }
  .trade { cursor: pointer; transition: border-color .15s, transform .15s; }
  .trade:hover { border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
  .trade-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .trade-top .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 14px; }
  .when { color: var(--faint); font-size: 13px; white-space: nowrap; margin-left: auto; }
  .trade-title { font-size: 19px; line-height: 1.25; margin: 14px 0 8px; overflow-wrap: anywhere; }
  .trade-nums { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .trade-nums b { color: var(--fg); font-weight: 600; }
  .trade-nums .amt { color: var(--fg); font-weight: 500; white-space: nowrap; }
  .also { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .trade-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); min-height: 50px; }
  .trade.compact .trade-title { font-size: 17px; margin-top: 0; }
  .trade-tags { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .trade-tags .ext { margin-left: auto; white-space: nowrap; }

  /* lists */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .trow { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); cursor: pointer; }
  .trow:first-child { border-top: 0; }
  .trow:hover { background: var(--soft); }
  .trow.norank { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .rank { color: var(--faint); font-size: 14px; text-align: center; }
  .tmain { min-width: 0; display: grid; gap: 4px; }
  .tmain .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .tmain .sub { color: var(--muted); font-size: 13px; }
  .tnum { text-align: right; white-space: nowrap; }
  .tnum b { display: block; font-size: 16px; font-weight: 600; }
  .tnum small { color: var(--muted); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  details.crow { border-top: 1px solid var(--line); }
  details.crow:first-child { border-top: 0; }
  details.crow > summary { list-style: none; cursor: pointer; border-top: 0; }
  details.crow > summary::-webkit-details-marker { display: none; }
  details.crow[open] > summary { padding-bottom: 6px; }
  .vs { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 14px; margin: 0 18px 14px; padding: 12px 14px; border-radius: 12px;
    background: var(--soft); font-size: 14px; font-variant-numeric: tabular-nums; }
  .vs .h { color: var(--muted); font-size: 12.5px; }
  .vs .k { color: var(--muted); }
  .vs b { font-weight: 600; overflow-wrap: anywhere; }
  .vs-note { margin: -4px 18px 14px; color: var(--muted); font-size: 13px; }
  .row .t { font-weight: 500; overflow-wrap: anywhere; }
  .row .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row .r { text-align: right; white-space: nowrap; font-size: 14px; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 13px; color: var(--muted); font-weight: 500; cursor: pointer; }
  .more:hover { color: var(--fg); }

  /* page bits */
  .seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; margin-bottom: 16px; max-width: 100%; }
  .seg a { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg a.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lede { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
  .h2 { font-size: 17px; margin: 32px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .foot-note { color: var(--faint); font-size: 13px; margin: 14px 2px 0; }
  .foot-note a, .foot-note button { color: var(--muted); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .opts button { border: 0; background: none; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .opts button.on { color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
  .opts button:disabled { opacity: .4; cursor: default; }
  .opts .gap { width: 10px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 18px; }
  .back:hover { color: var(--fg); }
  .th { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .th h1 { font-size: 26px; line-height: 1.15; }
  .th .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .reason { font-size: 16px; margin: 18px 0 0; line-height: 1.5; }
  .hero { margin: 24px 0 6px; }
  .hero .big { font-size: 44px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .hero .cap { color: var(--muted); margin-top: 8px; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile > span { display: block; color: var(--muted); font-size: 12.5px; }
  .tile b { display: block; font-size: 17px; font-weight: 600; margin-top: 3px; }
  .tile small { color: var(--muted); font-size: 12.5px; }
  .copybox { margin-top: 20px; }
  .copybox p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .copybox .head { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .amount { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; }
  .amount .box { display: flex; align-items: center; gap: 2px; padding: 0 12px; height: 42px; border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--line); background: var(--card); flex: 1 1 0; min-width: 64px; max-width: 200px; }
  .amount .box:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .amount input { border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px;
    font-weight: 600; width: 100%; font-variant-numeric: tabular-nums; }
  .amount button { height: 36px; padding: 0 12px; flex: none; border-radius: 999px; border: 0; background: var(--soft); color: var(--fg);
    font: inherit; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; }
  .amount button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .copybox.compact { padding: 12px 16px; }
  .receipt { border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 15px; }
  .receipt div + div { border-top: 1px solid var(--line); }
  .receipt span { color: var(--muted); }
  .receipt .total span, .receipt .total b { color: var(--fg); font-weight: 600; }
  .copybox .on-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .catpick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .catpick button { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--soft); color: var(--muted); }
  .catpick button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  details.fold { margin-top: 32px; border-top: 1px solid var(--line); }
  details.fold > summary { list-style: none; cursor: pointer; padding: 16px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "Show"; color: var(--muted); font-weight: 500; font-size: 14px; }
  details.fold[open] > summary::after { content: "Hide"; }
  .fold h3 { font-size: 15px; margin: 22px 0 8px; }
  .fold p.note { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl .n { text-align: right; white-space: nowrap; }
  .tbl td .s { color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ext { color: var(--muted); font-size: 14px; font-weight: 500; }
  .ext:hover { color: var(--fg); }
  .s .ext, .sub .ext, .vs-note .ext { font-size: inherit; }

  /* interests: onboarding and the picker */
  .onb { max-width: 460px; margin: 6vh auto 0; text-align: center; }
  .onb h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; }
  .onb .lede { margin: 10px auto 0; font-size: 15.5px; max-width: 380px; }
  .pick h2 { font-size: 17px; margin: 0 0 14px; }
  .onb .pick { margin-top: 40px; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .onb .picks { justify-content: center; }
  .picks button { border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 15px;
    font-weight: 500; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  .picks button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
  .pick .alt { display: block; margin: 14px auto 0; color: var(--muted); font-weight: 500; text-decoration: none; }
  .pick .alt:hover { color: var(--fg); }

  /* Traders: a leaderboard. One bar: filters on the left, how you view the list on the right */
  .wrap.wide { max-width: 1200px; }
  .lb-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
  .lb-filters { display: flex; align-items: center; gap: 6px; flex: none; padding-block: 2px; scrollbar-width: none; }
  .lb-filters::-webkit-scrollbar { display: none; }
  .lb-view { display: flex; align-items: center; gap: 10px; flex: none; }
  .lb-divider { width: 1px; height: 20px; background: var(--line); flex: none; margin-inline: 4px; }
  .lb-chip { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; cursor: pointer; }
  .lb-chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .lb-search { position: relative; display: flex; align-items: center; }
  .lb-search svg { position: absolute; left: 11px; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
  .lb-search input { box-sizing: border-box; width: 230px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 12px 5px 32px; font: inherit; font-size: 14px; }
  .lb-search input::placeholder { color: var(--faint); }
  .lb-period { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
  .lb-period button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Sentences the SDK writes (reasons, checks, evidence) say "bet"; the page says "trade".
const sdkText = (t) => String(t ?? "").replace(/\b([Bb])et(s?)\b/g, (_, b, s) => (b === "B" ? "Trade" : "trade") + s)
  .replace(/\bat (0\.\d+) or better\b/g, (_, x) => `at ${Math.round(parseFloat(x) * 1000) / 10}¢ or better`);
const VENUE = { kalshi: "Kalshi", polymarket: "Polymarket", polymarket_us: "Polymarket US" };
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body?.detail?.message || (typeof body?.detail === "string" ? body.detail : "") || `Request failed (${r.status})`);
  return body;
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

// ---- numbers ----
// Prices in whole cents; tenths only under 1¢ (or between 99¢ and 100¢), or when two prices would look equal.
const tenths = (p) => `${Math.round(p * 1000) / 10}¢`;
function cents(p) {
  if (p == null) return "—";
  const c = p * 100;
  return c < 1 || (c > 99 && c < 100) ? tenths(p) : `${Math.round(c)}¢`;
}
function centsPair(a, b) {
  if (a == null || b == null) return [cents(a), cents(b)];
  const lookSame = Math.round(a * 100) === Math.round(b * 100) && Math.round(a * 1000) !== Math.round(b * 1000);
  return lookSame ? [tenths(a), tenths(b)] : [cents(a), cents(b)];
}
// Green for a gain, red for a loss: `text` is x already formatted with its sign.
const pl = (x, text) => x > 0 ? `<span class="gain">${text}</span>` : x < 0 ? `<span class="loss">${text}</span>` : text;
const centsSigned = (x) => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(Math.round(x * 1000) / 10)}¢`;
function usd(x, signed = false) {
  if (x == null) return "—";
  const a = Math.abs(x);
  const s = a >= 1e9 ? `${(a / 1e9).toFixed(1)}B` : a >= 1e6 ? `${(a / 1e6).toFixed(a >= 1e8 ? 0 : 1)}M`
    : a >= 1e3 ? `${(a / 1e3).toFixed(a >= 1e5 ? 0 : 1)}K` : a >= 10 ? `${Math.round(a)}` : a.toFixed(2);
  return `${x < 0 ? "−" : signed && x > 0 ? "+" : ""}$${s.replace(/\.0([KMB])$/, "$1")}`;
}
function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t)) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}
function updatedAgo(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  return `<span class="long">Updated </span>${s < 5 ? "just now" : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`}`;
}

// ---- who: names, aliases, avatars, tiers ----
// No wallet addresses on screen: a trader without a real name gets "Trader 0x91…76" and an identicon.
const ADDR = /^0x[0-9a-f]{6,}/i;
function displayName(name, id) {
  const n = String(name || "").trim();
  if (n && !ADDR.test(n)) return n;
  const w = ADDR.test(id || "") ? id : (n.match(/^0x[0-9a-f]+/i) || [""])[0];
  return w ? `Trader ${w.slice(0, 4)}…${w.slice(-2)}` : "Anonymous";
}
function hash32(s) { // FNV-1a, then a murmur3 finish so every bit is well mixed
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
function avatar(seed, size = 36) {
  seed = String(seed || "?").toLowerCase();
  const h = hash32(seed), bits = hash32(`${seed}#cells`);
  let cells = "";
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {
    if (!((bits >>> (y * 3 + x)) & 1)) continue;
    cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    if (x < 2) cells += `<rect x="${4 - x}" y="${y}" width="1" height="1"/>`;
  }
  return `<span class="av" style="--h:${h % 360};width:${size}px;height:${size}px" aria-hidden="true"><svg viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges">${cells}</svg></span>`;
}
const TIER = {
  proven: ["Proven sharp", "s-proven"], quiet: ["Quiet sharp", "s-quiet"], rising: ["Rising", "s-rising"],
  too_fast: ["Too fast to copy", "s-fast"], lucky: ["Lucky", "t3"], no_edge: ["No clear edge", "t3"], no_view: ["No view", "t3"],
  inactive: ["Not trading lately", "t3"], // uselayer 0.6: would be recommended, but no buy in 7 days
};
// A trader's page: the scored page for a Polymarket wallet, else the venue leaderboard page.
const traderHref = (venue, id) => venue === "polymarket" ? `#/worth/${esc(id)}` : `#/t/${venue}/${encodeURIComponent(id)}`;
const tier = (seg) => TIER[seg] ?`<span class="tier ${TIER[seg][1]}">${TIER[seg][0]}</span>` : "";
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function oddsEdge(s) { // how much more often their trades won than the price said they would, in points
  if (!s.settled || s.odds == null) return null;
  return Math.round(100 * (s.won / s.settled - s.odds));
}
const beatsBadge = (s) => (oddsEdge(s) ?? 0) > 0 ? `<span class="badge">${CHECK}Beats the odds</span>` : "";

// ---- trade status: one line with a dot ----
const STATUS = {
  in: ["You can still get in", "in"], moved: ["Price moved away", "moved"],
  won: ["Won", "won"], lost: ["Lost", "lost"], closed: ["Closed", "done"],
};
const statusLine = (st) => STATUS[st] ? `<span class="status ${STATUS[st][1]}"><i></i>${STATUS[st][0]}</span>` : `<span class="status"><i></i>Price unknown</span>`;
const SETTLED = new Set(["won", "lost", "closed"]);
const GET_IN = 0.03; // the same limit copying uses; and at most 5¢ below (FELL_BY in app.py)
function statusExplain(b) {
  const d = b.price_now != null && b.price != null ? b.price_now - b.price : null;
  const gap = (x) => Math.abs(x) < 0.01 ? "less than 1¢" : `${Math.round(Math.abs(x) * 100)}¢`; // rounded like the prices shown
  switch (b.status) {
    case "in": return d > 0.0005 ? `The price is ${gap(d)} above what they paid. Copies buy at most 3¢ above their price, so you can still get in.`
      : d < -0.0005 ? `The price is ${gap(d)} below what they paid, so you can still get in.` : "The price is about what they paid, so you can still get in.";
    case "moved": return d < 0 ? `The price is ${gap(d)} below what they paid: the market has turned against them since. Buying now would be a different trade from theirs.`
      : `The price is ${gap(d)} above what they paid, more than the 3¢ copying allows. Most of their edge is already in the price.`;
    case "won": return "The price is 98¢ or more: the market has settled their way, or as good as.";
    case "lost": return "The price is 2¢ or less: the market has settled against them, or as good as. Not a bargain.";
    case "closed": return "They no longer hold it: they sold, or the market settled and paid out.";
    default: return "";
  }
}

const skelCard = () => `<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="skel" style="width:28px;height:28px;border-radius:50%"></div><div class="skel" style="width:140px;height:12px"></div></div>

// ---- copying (sandbox) ----

async function loadCopy() { try { copy = await api("/api/copy"); } catch {} return copy; }
setInterval(loadCopy, 15000);

// The market's page on the venue, opened in a new tab, so the trade can be checked there.
const marketLink = (url, label = "Polymarket ↗") => url ? `<a class="ext" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : "";

// ---- trade cards (feed, and a trader's open trades) ----
let shown = []; // the trades on screen, so a card can open its sheet
// How far the price has moved since they bought, for coloring "Now": 0 when it hasn't, or isn't known.
const moveOf = (b) => b.price != null && b.price_now != null && Math.abs(b.price_now - b.price) >= 0.0005 ? b.price_now - b.price : 0;
function tradeCard(b, i, { who = true } = {}) {
  const [paid, now] = centsPair(b.price, b.price_now);
  const name = displayName(b.name, b.wallet);
  const top = who ? `<div class="trade-top">${avatar(b.wallet, 28)}<span class="who"><span class="name">${esc(name)}</span>${tier(b.segment)}</span>
      <span class="when">${[b.category, b.at ? ago(b.at) : ""].filter(Boolean).map(esc).join(" · ")}</span></div>` : "";
  const act = who && b.status === "in" && b.wallet && b.market ? `<button class="btn small" data-open-trade="${i}">Copy trade</button>`
    : who && !SETTLED.has(b.status) && b.wallet ? copyButton({ venue: "polymarket", id: b.wallet, name: b.name }, "small") : "";
  return `<article class="card trade${who ? "" : " compact"}" data-trade="${i}" tabindex="0">

    <div class="trade-nums"><span>Bought at <b>${paid}</b><span class="sep">·</span>Now <b>${pl(moveOf(b), now)}</b></span><span class="amt">${usd(b.usd)} in</span></div>
    ${alsoBought(b)}
    <div class="trade-foot">${statusLine(b.status)}${act}</div>

}
// Other traders we follow who bought the same thing (one card per trade): names only, never "the same person".
function alsoBought(b) {
  const names = (b.also || []).map((x) => esc(displayName(x.name, x.wallet)));
  if (!names.length) return "";
  const list = names.length <= 2 ? names.join(" and ") : `${names.slice(0, 2).join(", ")} and ${plural(names.length - 2, "other")}`;
  return `<p class="also">Also bought by ${list}</p>`;
}
function tradeSheet(b) {
  const [paid, now] = centsPair(b.price, b.price_now);
  const name = displayName(b.name, b.wallet);
  const panel = sheet(`
    <h2>${esc(b.title || "Untitled market")}</h2>

      ${b.at || b.category ? `<div><span>When</span><b>${b.at ? ago(b.at) : "—"}</b></div><div><span>Category</span><b>${esc(b.category || "—")}</b></div>` : ""}
    </div>
    ${b.wallet ? `<a class="sheet-who" href="#/worth/${esc(b.wallet)}">${avatar(b.wallet, 36)}<span class="grow"><span class="name">${esc(name)}</span><span class="muted" style="font-size:13px">See their record</span></span>${tier(b.segment)}</a>` : ""}
    ${b.wallet && b.status === "in" && b.market ? `<div class="card copybox" id="copynow"><div class="skel" style="width:70%;height:14px"></div></div>` : ""}
    ${b.wallet && !SETTLED.has(b.status) ? `<div style="margin-top:16px">${copyButton({ venue: "polymarket", id: b.wallet, name: b.name }, b.status === "in" ? "wide ghost" : "wide")}</div>

// "Copy this trade": buy the trade on the card now, in the sandbox, after a look at what it pays.
const oneTrade = (b) => ({ wallet: b.wallet, name: b.name, market: b.market, price: b.price, title: b.title, outcome: b.outcome, url: b.url, at: b.at, size: b.size, usd: b.usd, token: b.token });
// The two ways it can end, in the outcome's own words: "If it ends No" / "If it ends Yes", or "If Jets wins" / "If not".
const yesNo = (o) => /^(yes|no)$/i.test(o || "");
const ifWins = (o) => !o ? "If it wins" : yesNo(o) ? `If it ends ${esc(o)}` : `If ${esc(o)} wins`;
const ifLoses = (o) => yesNo(o) ? `If it ends ${/^yes$/i.test(o) ? "No" : "Yes"}` : "If not";
const PICKS = [10, 50, 100];
// "Your $50 fills at 34.2¢ on average, 0.5¢ above what they paid. With the fee, 35.3¢ a contract against their 33.7¢."
function fillExplain(p, b, spend) {
  const c = (x) => `${Math.round(x * 1000) / 10}¢`;
  const d = p.price - b.price, gap = Math.abs(d) < 0.0005 ? "about what they paid" : `${c(Math.abs(d))} ${d > 0 ? "above" : "below"} what they paid`;
  const allIn = p.total / p.contracts;
  return `Your ${money(spend)} fills at ${c(p.price)}${p.worst_price > p.price + 0.0005 ? " on average" : ""}, ${gap}. With the fee, ${c(allIn)} a contract against their ${c(b.price)}.`;
}
// Money you put in or get back, to the cent: "$49.91", "+$42.09".
const money = (x, signed = false) => x == null ? "—" : `${x < 0 ? "−" : signed && x > 0 ? "+" : ""}$${Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
async function copyNowBox(box, b, amount = 10) {
  box.innerHTML = `<div class="head">Copy this trade</div>
    <p>How much do you want to spend in total? Real prices, sandbox money.</p>
    <div class="amount"><label class="box"><span class="muted">$</span><input id="amt" inputmode="decimal" autocomplete="off" aria-label="Amount in dollars" value="${amount}"></label>
      ${PICKS.map((v) => `<button type="button" data-amt="${v}" aria-pressed="${v === amount}">$${v}</button>`).join("")}</div>
    <div id="pv"><div class="skel" style="width:70%;height:14px"></div></div>
    <button class="btn wide" id="docopynow" disabled>Copy this trade</button>`;
  const input = $("#amt", box), pv = $("#pv", box), btn = $("#docopynow", box);
  const top = document.getElementById("sheetstatus"), before = top ? top.innerHTML : "";
  const setTop = (st, why) => { if (top) top.innerHTML = `${STATUS[st] ? statusLine(st) : `<span class="status moved"><i></i>${esc(st)}</span>`}<p class="explain">${esc(why)}</p>`; };
  const resetTop = () => { if (top) top.innerHTML = before; };
  let seq = 0, timer = null, ready = null; // ready: the amount the preview on screen is for, if it can be copied
  const spendNow = () => { const v = parseFloat(String(input.value).replace(/[$,\s]/g, "")); return Number.isFinite(v) ? Math.round(v * 100) / 100 : null; };
  const show = async () => {
    const spend = spendNow(), my = ++seq;
    ready = null; btn.disabled = true;
    $$("[data-amt]", box).forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.amt === spend)));
    if (!spend || spend <= 0) { pv.innerHTML = `<p>Enter an amount above $0.</p>`; return; }
    let p;
    try { p = await post("/api/trade/preview", { ...oneTrade(b), spend }); }
    catch (e) { if (my === seq) pv.innerHTML = `<p class="inline-err">${esc(e.message)}</p>`; return; }
    if (my !== seq || !box.isConnected) return; // a newer amount is on its way
    if (!p.ok) {
      const room = p.depth_checked && p.max_spend > 0 ? Math.floor(p.max_spend * 100) / 100 : 0;
      if (p.depth_checked) setTop(room ? "Not enough for sale for this amount" : "Price moved away", sdkText(p.reason));
      pv.innerHTML = p.depth_checked
        ? (room >= 1 ? `<p><button type="button" class="btn ghost small" id="useroom">Use ${money(room)} instead</button></p>` : `<p>Nothing is for sale close to their price right now.</p>`)
        : `<p>${esc(sdkText(p.reason))}</p>`;
      const use = $("#useroom", pv);
      if (use) use.onclick = () => { input.value = room.toFixed(2); clearTimeout(timer); show(); };
      return;
    }
    if (p.depth_checked) setTop("in", fillExplain(p, b, spend));
    else resetTop();
    const avg = Math.round(p.price * 1000) / 10, worst = p.worst_price != null ? Math.round(p.worst_price * 1000) / 10 : avg;
    pv.innerHTML = `<p>${plural(p.contracts, "contract")}${b.outcome ? ` of ${esc(b.outcome)}` : ""} on Polymarket, ${p.depth_checked ? "priced from what's for sale right now" : "at the cheapest price for sale now"}.</p>
      <div class="receipt">
        <div><span>${plural(p.contracts, "contract")} × ${worst > avg ? `${avg}¢ average` : `${avg}¢`}</span><b>${money(p.cost)}</b></div>
        <div><span>Polymarket fee</span><b>${p.fee > 0 ? money(p.fee) : "No fee"}</b></div>
        <div class="total"><span>Total</span><b>${money(p.total)}</b></div>
      </div>
      <div class="kv" style="margin:0 0 14px">
        <div><span>${ifWins(b.outcome)}</span><b>You get ${money(p.payout)}</b></div><div><span>${ifLoses(b.outcome)}</span><b>You lose ${money(p.total)}</b></div>
      </div>
      <p style="margin-top:-6px">That's ${pl(p.profit_if_win, money(p.profit_if_win, true))} if it wins. Each contract pays $1 if it wins and nothing if it loses.${!p.depth_checked && p.total >= 100 ? " Polymarket's order book couldn't be read just now, so a real order this size might fill higher." : ""}</p>`;
    ready = spend; btn.disabled = false;
  };
  const later = () => { clearTimeout(timer); btn.disabled = true; timer = setTimeout(show, 350); };
  input.oninput = later;
  $$("[data-amt]", box).forEach((x) => (x.onclick = () => { input.value = x.dataset.amt; clearTimeout(timer); show(); }));
  btn.onclick = async () => {
    const spend = ready;
    if (spend == null) return;
    btn.disabled = true;
    try {
      const e = await post("/api/trade/copy", { ...oneTrade(b), spend });
      if (e.status !== "copied") { btn.disabled = false; pv.insertAdjacentHTML("beforeend", `<p class="inline-err">${esc(sdkText(e.reason))}</p>`); return; }
      btn.outerHTML = `<button class="btn done wide" data-goto="#/mine">Copied ✓ See My trades</button>`;
      input.disabled = true; $$("[data-amt]", box).forEach((x) => (x.disabled = true));
      bindActions(box);
      toast(`Copied: ${plural(e.filled, "contract")}${b.outcome ? ` of ${esc(b.outcome)}` : ""} at ${cents(e.avg_price)} for ${money(e.filled * e.avg_price + (e.fees || 0))} in the sandbox.<a href="#/mine">My trades</a>`);
    } catch (err) { btn.disabled = false; pv.insertAdjacentHTML("beforeend", `<p class="inline-err">${esc(err.message)}</p>`); }
  };
  show();
}

// one handler for the clickable things inside a container
function bindActions(root) {
  $$("[data-trade]", root).forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("button, a")) tradeSheet(shown[+el.dataset.trade]); };
    el.onkeydown = (e) => { if (e.key === "Enter" && e.target === el) tradeSheet(shown[+el.dataset.trade]); };
  });
  $$("[data-copy]", root).forEach((btn) => (btn.onclick = async (e) => {
    e.stopPropagation(); btn.disabled = true;
    try { await startCopy(JSON.parse(btn.dataset.copy)); } catch (err) { btn.disabled = false; toast(esc(err.message)); return; }
    refreshCopyButtons();
  }));
  $$("[data-open-trade]", root).forEach((btn) => (btn.onclick = (e) => { e.stopPropagation(); tradeSheet(shown[+btn.dataset.openTrade]); }));
  $$("[data-goto]", root).forEach((btn) => (btn.onclick = (e) => { e.stopPropagation(); closeSheet(); location.hash = btn.dataset.goto; }));
  $$("[data-retry]", root).forEach((btn) => (btn.onclick = () => route()));
  $$("[data-href]", root).forEach((el) => (el.onclick = (e) => { if (!e.target.closest("a")) location.hash = el.dataset.href; }));
}
function refreshCopyButtons() {
  $$("[data-copy], [data-goto='#/mine']").forEach((btn) => {
    const t = btn.dataset.copy ? JSON.parse(btn.dataset.copy) : null;
    if (t && isCopied(t.venue, t.id)) {
      btn.outerHTML = `<button class="btn done ${btn.classList.contains("small") ? "small" : ""} ${btn.classList.contains("wide") ? "wide" : ""}" data-goto="#/mine">Copying trader ✓</button>`;
    }
  });
  bindActions(document);
}

// ---- feed ----
const feed = { data: null, at: 0, err: null, cat: "All", onlyIn: true };
const BASE_CATS = ["All", "Sports", "Politics", "Crypto", "Esports"];

async function feedPage() {

  }

      <label class="switch"><input type="checkbox" id="onlyin" ${feed.onlyIn ? "checked" : ""}><span class="track"></span>Only trades I can still get into</label>
    </div>
    ${feed.err ? `<p class="inline-err">Couldn't refresh: ${esc(feed.err)}. Showing the last update.</p>` : ""}
    ${r.failed ? `<p class="foot-note" style="margin:0 0 12px">${plural(r.failed, "trader")} couldn't be read just now; retrying.</p>` : ""}`;
  $$("[data-cat]").forEach((b) => (b.onclick = () => { feed.cat = b.dataset.cat; renderFeed(); }));
  $("#onlyin").onchange = (e) => { feed.onlyIn = e.target.checked; renderFeed(); };
  $("#following").onclick = () => followingSheet(r.traders);

  shown = pool.filter((b) => feed.cat === "All" || b.category === feed.cat);
  let html;
  if (!r.bets.length) html = emptyState(`None of your traders traded in the last ${r.hours} hours`, "New trades show up here within a few minutes of being made. Polymarket shows trades a few minutes late.");
  else if (!shown.length) html = emptyState(feed.onlyIn ? "Nothing you can still get into" : `No ${esc(feed.cat)} trades`,
    feed.onlyIn ? `Every ${feed.cat === "All" ? "" : esc(feed.cat) + " "}trade from the last ${r.hours} hours has moved away or settled.` : `Nothing in ${esc(feed.cat)} in the last ${r.hours} hours.`,

setInterval(() => { const u = $("#updated"); if (u && feed.at) u.innerHTML = updatedAgo(feed.at); }, 5000);

// Traders we follow often buy the same thing, minutes apart: one card per outcome they bought. It shows the
// buy you can best still follow (you can still get in, then whoever bought first) and lists the others;
// it sorts by the newest buy of the lot.
const LEAD = { in: 0, moved: 1 };
function oneCardPerTrade(bets) {
  const by = new Map();
  for (const b of bets) {
    const k = b.token || b.market; // the exact outcome token; the outcome index is sometimes junk
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(b);
  }
  return [...by.values()].map((g) => {
    g.sort((a, b) => (LEAD[a.status] ?? 2) - (LEAD[b.status] ?? 2) || a.at.localeCompare(b.at));
    const latest = g.reduce((m, x) => (x.at > m ? x.at : m), g[0].at);
    return { ...g[0], also: g.slice(1).map((x) => ({ wallet: x.wallet, name: x.name })), latest };
  }).sort((a, b) => b.latest.localeCompare(a.latest));
}

// ---- interests: asked once per browser ----
// Kept in localStorage; [] means all markets, null not asked yet. Storage can be blocked (private windows),
// so the choice then holds for this visit only and onboarding never traps anyone.
const INTERESTS = ["Politics", "Sports", "Crypto", "Esports"];
const INTERESTS_KEY = "signals.interests";
let interests = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(INTERESTS_KEY));
    if (Array.isArray(v)) return v.filter((c) => INTERESTS.includes(c));
  } catch {}
  return null;
})();
function setInterests(v) {
  interests = v;
  try { localStorage.setItem(INTERESTS_KEY, JSON.stringify(v)); } catch {}
}
const interestNames = (cs) => cs.length < 2 ? cs.join("") : `${cs.slice(0, -1).join(", ")} or ${cs[cs.length - 1]}`;
// A trader matches when an interest is their most-traded category or one they're strong in.
const matchesInterests = (s, picked) => !picked.length || picked.includes(s.categories[0]?.category)
  || s.strong_categories.some((c) => picked.includes(c));

function interestPicker(el, { selected = [], go, alt, onDone }) {
  const picked = new Set(selected);
  el.innerHTML = `<div class="pick"><h2>What markets interest you?</h2>
    <div class="picks" role="group" aria-label="Markets">${INTERESTS.map((c) => `<button type="button" data-pick="${c}" aria-pressed="${picked.has(c)}">${c}</button>`).join("")}</div>
    <button class="btn wide" data-go ${picked.size ? "" : "disabled"}>${go}</button>
    <button class="link alt" data-alt>${alt}</button></div>`;
  $$("[data-pick]", el).forEach((b) => (b.onclick = () => {
    const c = b.dataset.pick;
    picked.has(c) ? picked.delete(c) : picked.add(c);
    b.setAttribute("aria-pressed", picked.has(c));
    $("[data-go]", el).disabled = !picked.size;
  }));
  $("[data-go]", el).onclick = () => onDone(INTERESTS.filter((c) => picked.has(c)));
  $("[data-alt]", el).onclick = () => onDone([]); // all markets, Economy, Weather and the rest included
}
function onboardingPage() {
  $$("[data-tab]").forEach((a) => a.classList.remove("on"));
  $("#app").innerHTML = `<section class="onb"><h1>Find traders worth following.</h1>
    <p class="lede">Discover interesting traders, understand how they trade, and decide who to follow.</p><div id="onbpick"></div></section>`;
  interestPicker($("#onbpick"), { go: "Discover traders →", alt: "Skip", onDone: (v) => {

}
// ---- traders: a leaderboard of the traders we recommend ----
// One bar: market chips (the onboarding interests), Copyable only, search by name or wallet, period, sort.
// Profit history (weeks in profit, trend, 7D/90D) comes from the SDK's next release; until then those columns
// show "—" and "Most consistent" waits. Never a made-up number for a real trader (sample data is local-only).
const SEG_ORDER = ["proven", "quiet", "rising", "too_fast"]; // the tiers we recommend, in order
const RANKED = 25;
let worthTimer = null, worthLast = null;
const topOpts = { venue: "all", by: "pnl" };
const lb = { copyOnly: false, q: "", sort: null, period: "30d", all: false, more: false };

async function worthView() {

const isCopyable = (s) => s.copyable ? s.copyable === "yes" : ["proven", "quiet", "rising"].includes(s.segment);
const weeksUp = (s) => Array.isArray(s.pnl_weeks) ? s.pnl_weeks.filter((x) => x > 0).length : null;
const profitOf = (s, p) => s.periods?.[p]?.trading_pnl ?? (p === "30d" ? s.trading_pnl_window ?? s.pnl_window : null) ?? null;
const perDollarOf = (s, p) => s.periods?.[p]?.return_per_dollar ?? (p === "30d" ? s.return_per_dollar : null) ?? null;
const winRateOf = (s) => s.settled ? s.won / s.settled : null;
const perDayText = (n) => n == null ? "" : n >= 1 ? `${Math.round(n)} a day` : `${Math.max(1, Math.round(n * 7))} a week`;
const isWalletQuery = (q) => /^0x[0-9a-f]{40}$/i.test(q.trim());
const PERIOD_DAYS = { "7d": 7, "30d": 30, "90d": 90 };
const byDesc = (f) => (a, b) => (f(b) ?? -Infinity) - (f(a) ?? -Infinity);
// returns here are small (copies keep fractions of a percent), so one decimal under 10%
const lbPct = (x) => {
  if (x == null) return "—";
  const v = Math.abs(x) < 0.1 ? (Math.abs(x) * 100).toFixed(1) : String(Math.round(Math.abs(x) * 100));
  return `${Number(v) === 0 ? "" : x > 0 ? "+" : "−"}${v}%`; // rounds to zero: no sign
};
const LB_SORTS = {
  recommended: ["Recommended", (a, b) => SEG_ORDER.indexOf(a.segment) - SEG_ORDER.indexOf(b.segment) || (b.edge?.z ?? -99) - (a.edge?.z ?? -99)],
  consistent: ["Most consistent", (a, b) => (weeksUp(b) ?? -1) - (weeksUp(a) ?? -1) || (profitOf(b, "30d") ?? 0) - (profitOf(a, "30d") ?? 0)],
  profit: ["Profit", byDesc((s) => profitOf(s, lb.period))],
  won: ["Win rate", byDesc(winRateOf)],
  active: ["Most active", byDesc((s) => s.trades_per_day)],
  copying: ["Copy result", byDesc((s) => s.copy_return)],
};
function lbSpark(s, days, w = 76, h = 26) {
  const pts = (s.pnl_daily || []).slice(-days).map((p) => p[1]);
  if (pts.length < 2) return `<span class="lb-none">—</span>`;
  const base = pts[0], ys = pts.map((v) => v - base), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = hi - lo || 1;
  const xy = ys.map((v, i) => [2 + (i / (ys.length - 1)) * (w - 4), h - 2 - ((v - lo) / span) * (h - 4)]);
  const [lx, ly] = xy[xy.length - 1], end = ys[ys.length - 1];
  return `<svg class="${end > 0 ? "gain" : end < 0 ? "loss" : ""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Profit trend"><polyline points="${xy.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.2" fill="currentColor"/></svg>`;
}

function renderWorth() {
  const box = $("#tview"), r = worthLast;

      : emptyState("No traders checked yet", st.error ? esc(st.error) : "", `<button class="btn" id="wrefresh">Check traders</button>`);
    const b = $("#wrefresh"); if (b) b.onclick = async () => { await api("/api/worth/refresh", { method: "POST" }); worthView(); };

    const cat = s.categories?.[0]?.category;
    const copyMain = copy == null ? `<span class="lb-none">—</span>` : `<span class="lb-main ${isCopyable(s) ? "" : "lb-muted"}">${isCopyable(s) ? pl(copy, lbPct(copy)) : lbPct(copy)}</span>`;

      <span class="lb-cons">${up == null ? `<span class="lb-none">—</span>` : `<span class="lb-weeks" aria-hidden="true">${s.pnl_weeks.map((w) => `<i class="${w > 0 ? "up" : w < 0 ? "down" : ""}"></i>`).join("")}</span><span class="lb-sub">In profit ${up} of 12 weeks</span>`}</span>
      <span class="lb-pnl">${profit == null ? `<span class="lb-none">—</span>` : `<span class="lb-main">${pl(profit, usd(profit, true))}</span><span class="lb-sub">${perDollar != null ? `${lbPct(perDollar)} per $ traded` : "30 days"}</span>`}</span>
      <span class="lb-trend">${lbSpark(s, days)}</span>
      <span class="lb-won">${s.settled ? `<span class="lb-main">${s.won} of ${s.settled}</span><span class="lb-sub">settled</span>` : `<span class="lb-none">—</span>`}</span>
      <span class="lb-usual">${s.typical_usd != null ? `<span class="lb-main">${usd(s.typical_usd)}</span><span class="lb-sub">${perDayText(s.trades_per_day)}</span>` : `<span class="lb-none">—</span>`}</span>
      <span class="lb-copy">${copyMain}<span class="lb-sub">${copySub}</span></span>
      <span class="lb-meta">${[s.settled ? `Won ${s.won} of ${s.settled}` : "", s.typical_usd != null ? `usually ${usd(s.typical_usd)}` : "", perDayText(s.trades_per_day)].filter(Boolean).join(" · ")}</span>
      <span class="lb-copyline">${copy == null ? "" : isCopyable(s) ? `Copies made <b>${pl(copy, lbPct(copy))}</b> after fees` : `<span class="lb-muted">${s.segment === "too_fast" ? "Too fast to copy" : "Not recommended"}: copies made ${lbPct(copy)}</span>`}</span>
    </a>`;
  };

  let body;
  if (shown.length) {
    body = `<div class="lb-board ${history ? "" : "lb-nohist"}">

      <div class="lb-cols lb-head"><span>#</span><span>Trader</span>${head("consistent", "Weeks in profit")}${head("profit", "Profit")}<span>Trend</span>${head("won", "Won")}${head("active", "Usual trade")}${head("copying", "If you'd copied")}</div>
      ${shown.map(row).join("")}
      ${shown.length > RANKED && !lb.more ? `<button type="button" class="lb-more" id="lbmore">Show ${shown.length - RANKED} more</button>` : ""}</div>`;
  } else if (q && isWalletQuery(q)) {
    body = emptyState("That wallet isn't in this list", "We can still check its trades, including your own wallet. It takes up to a minute.", `<a class="btn" href="#/worth/${esc(q)}">Check this wallet</a>`);
  } else if (q) {
    body = emptyState("No trader matches", `Nobody called “${esc(lb.q.trim())}” here. Paste a full wallet address to check any wallet.`, `<button class="btn ghost" id="lbclear">Clear search</button>`);
  } else if (picked.length && pool.length) {

  } else {

  const left = scores.length - recommended.length;

        ${periods ? `<div class="lb-period" role="group" aria-label="Period">${Object.keys(PERIOD_DAYS).map((p) => `<button type="button" data-lbperiod="${p}" aria-pressed="${n === p}">${p.toUpperCase()}</button>`).join("")}</div>` : ""}
        <select id="lbsort" class="lb-sort" aria-label="Sort traders">${Object.entries(LB_SORTS).map(([k, [l]]) => k === "consistent" && !history
          ? `<option value="consistent" disabled>Most consistent (coming soon)</option>` : `<option value="${k}" ${sort === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      </div>
    </div>
    ${sample ? `<p class="lb-note">Sample profit history (SIGNALS_MOCK=1): weeks in profit, trend and 7D/90D are made up here, to review the page. They never show on the hosted app.</p>` : ""}
    ${body}
    <p class="lb-foot">${st.running ? `Checking again${st.total ? ` (${st.done} of ${st.total})` : ""}…` : `Checked ${plural(scores.length, "trader")} ${ago(res.finished)} · <button class="link" id="wrefresh">Check again</button>`}
      · <button class="link" id="how">How we pick traders</button>
      ${sort === "consistent" ? " · Most consistent ranks by weeks in profit out of the last 12, then 30-day profit" : ""}
      ${history ? "" : " · Weeks in profit, trend and 7D/90D arrive with the next data update"}
      <br>${lb.all ? `Showing every checked trader except market makers and arbitrage · <button class="link" id="lbrec">Recommended only</button>` : `${left ? `${left} left out: big profit without skill, market makers, arbitrage and traders with no clear edge · <button class="link" id="lbrec">See all checked traders</button>` : ""}`}
      · <a class="link" href="#/traders/top">Top profit</a> · <a class="link" href="#/traders/big">Big trades</a>
      ${st.error ? ` · <span style="color:var(--danger)">Last check failed: ${esc(st.error)}</span>` : ""}</p>`;

  $$("[data-lbmkt]", box).forEach((b) => (b.onclick = () => {
    const c = b.dataset.lbmkt, now = new Set(interests || []);
    if (!c) now.clear(); else now.has(c) ? now.delete(c) : now.add(c);
    setInterests(INTERESTS.filter((x) => now.has(x))); renderWorth(); }));
  $("#lbcopy").onclick = () => { lb.copyOnly = !lb.copyOnly; renderWorth(); };
  $("#lbq").oninput = (e) => {

  $$("[data-lbperiod]", box).forEach((b) => (b.onclick = () => { lb.period = b.dataset.lbperiod; renderWorth(); }));

  $("#how").onclick = howSheet;
