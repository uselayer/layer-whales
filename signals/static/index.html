<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signals</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<style>
  @font-face { font-family: "Host Grotesk"; src: url(/static/fonts/HostGrotesk-latin-var.woff2) format("woff2");
    font-weight: 300 600; font-display: swap; }
  :root {
    --bg: #fafaf9; --card: #ffffff; --fg: #111112; --muted: #6c6c72; --faint: #a1a1a6; --line: #ececea;
    --soft: #f3f3f1; --green: #12a150; --green-soft: #e9f7ef; --danger: #c43d2f;
    --gain: #087f3d; --loss: #cf3426; --amber: #a86200; --teal: #0b7a83; --blue: #2557d6;
    --accent: #4b3fe0; --on-accent: #ffffff; /* Signals' own color: never used for gains, losses or statuses */
    --shadow: 0 1px 2px rgba(17, 17, 18, .04), 0 2px 8px rgba(17, 17, 18, .03);
    --av-l: 93%; --av-fg-l: 48%; --av-s: 42%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
      --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --gain: #3ccf7e; --loss: #ff7a6b; --amber: #f2b54a; --teal: #3cc6cf; --blue: #7aa2ff;
      --accent: #9d97ff; --on-accent: #0d0d0e;
      --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
    --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --gain: #3ccf7e; --loss: #ff7a6b; --amber: #f2b54a; --teal: #3cc6cf; --blue: #7aa2ff;
      --accent: #9d97ff; --on-accent: #0d0d0e;
    --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "Host Grotesk", -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  body.noscroll { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; } /* one width for the header, every tab and the footer */
  main.wrap.narrow { max-width: 680px; } /* a reading column: Top profit and a venue trader's page */
  .muted { color: var(--muted); }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs a { padding: 7px 12px; border-radius: 999px; color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .tabs a:hover { color: var(--fg); }
  .tabs a.on { background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); }
  .account { margin-left: auto; display: flex; align-items: center; min-height: 32px; }
  .tabbar { display: none; }
  main.wrap { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }
  footer.foot { color: var(--faint); font-size: 12.5px; padding-top: 8px; padding-bottom: 36px; text-align: center; }
  footer.foot a { color: var(--muted); }

  /* bits */
  .av { --h: 200; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
    background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 45% var(--av-fg-l)); }
  .av svg { width: 62%; height: 62%; display: block; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tier { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.35; }
  .tier.t1 { background: var(--fg); color: var(--bg); }
  .tier.t2 { border: 1px solid var(--line); color: var(--fg); padding: 1px 7px; }
  .tier.t3 { background: var(--soft); color: var(--muted); }
  .tier.s-proven { --c: var(--gain); } .tier.s-quiet { --c: var(--teal); } .tier.s-rising { --c: var(--blue); }
  .tier[class*="s-"] { background: color-mix(in srgb, var(--c) 11%, var(--card)); color: color-mix(in srgb, var(--c) 80%, var(--fg)); }
  button.tier { border: 0; font: inherit; font-size: 12px; font-weight: 500; line-height: 1.35; cursor: pointer; }
  button.tier:hover { background: color-mix(in srgb, var(--c) 20%, var(--card)); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .badge svg { width: 13px; height: 13px; }
  .chip { display: inline-block; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 8px; background: var(--soft); color: var(--fg); }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--accent); color: var(--on-accent); white-space: nowrap; transition: transform .08s ease, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.wide { width: 100%; padding: 13px 16px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; }
  .link:hover { text-decoration-color: currentColor; }
  .sep { color: var(--faint); margin: 0 6px; }
  .gain { color: var(--gain); } .loss { color: var(--loss); }

  /* status */
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .status.in { color: var(--gain); } .status.in i { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .status.moved { color: var(--amber); } .status.moved i { background: var(--amber); }
  .status.won { color: var(--gain); } .status.won i { background: var(--gain); }
  .status.lost { color: var(--loss); } .status.lost i { background: var(--loss); }
  .status.done { color: var(--fg); } .status.done i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }

  /* feed controls */
  .follow { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .stack { display: flex; }
  .stack .av { box-shadow: 0 0 0 2px var(--bg); }
  .stack .av + .av { margin-left: -8px; }
  .follow b { font-weight: 500; font-size: 14px; white-space: nowrap; }
  .follow .chev { color: var(--faint); }
  .feedtop { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 16px; }
  .updated { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .fresh { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--faint); font-size: 13px; white-space: nowrap; }
  .lag { position: relative; }
  .lag-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: help; }
  .lag-btn svg { width: 14px; height: 14px; }
  .lag-btn:hover, .lag.open .lag-btn { color: var(--muted); }
  .lag-tip { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 260px; max-width: calc(100vw - 32px); padding: 10px 12px; border-radius: 12px;
    background: var(--card); color: var(--muted); box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(17, 17, 18, .08); font-size: 13px; line-height: 1.45; white-space: normal; }
  .lag:hover .lag-tip, .lag-btn:focus-visible + .lag-tip, .lag.open .lag-tip { display: block; }
  .paused { display: flex; gap: 10px; align-items: flex-start; background: var(--soft); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-size: 13.5px; color: var(--muted); }
  .paused svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--fg); }
  .paused p { margin: 0; }
  .paused b { color: var(--fg); font-weight: 500; }
  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .mkts { font-size: 14px; color: var(--muted); min-width: 0; }
  .mkts b { color: var(--fg); font-weight: 500; }
  .switch { position: relative; max-width: 100%; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 36px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* cards */
  .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; } /* a long name truncates, never widens the cards */
  #flist .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  #flist .card { display: flex; flex-direction: column; }
  #flist .card > :has(+ .trade-foot) { margin-bottom: 12px; }
  #flist .trade-foot { margin-top: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); }
  .trade { cursor: pointer; transition: border-color .15s, transform .15s; }
  .trade:hover { border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
  .trade-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .trade-top .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 14px; }
  .when { color: var(--faint); font-size: 13px; white-space: nowrap; margin-left: auto; }
  .trade-title { font-size: 19px; line-height: 1.25; margin: 14px 0 8px; overflow-wrap: anywhere; }
  .trade-nums { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .trade-nums b { color: var(--fg); font-weight: 600; }
  .trade-nums .amt { color: var(--fg); font-weight: 500; white-space: nowrap; }
  .also { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .trade-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); min-height: 50px; }
  .trade.compact .trade-title { font-size: 17px; margin-top: 0; }
  .trade-tags { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .trade-tags .ext { margin-left: auto; white-space: nowrap; }

  /* lists */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .trow { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); cursor: pointer; }
  .trow:first-child { border-top: 0; }
  .trow:hover { background: var(--soft); }
  .trow.norank { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .rank { color: var(--faint); font-size: 14px; text-align: center; }
  .tmain { min-width: 0; display: grid; gap: 4px; }
  .tmain .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .tmain .sub { color: var(--muted); font-size: 13px; }
  .tnum { text-align: right; white-space: nowrap; }
  .tnum b { display: block; font-size: 16px; font-weight: 600; }
  .tnum small { color: var(--muted); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .t { font-weight: 500; overflow-wrap: anywhere; }
  .row .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row .r { text-align: right; white-space: nowrap; font-size: 14px; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 13px; color: var(--muted); font-weight: 500; cursor: pointer; }
  .more:hover { color: var(--fg); }

  /* page bits */
  .seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; margin-bottom: 16px; max-width: 100%; }
  .seg a { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg a.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lede { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
  .h2 { font-size: 17px; margin: 32px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .foot-note { color: var(--faint); font-size: 13px; margin: 14px 2px 0; }
  .foot-note a, .foot-note button { color: var(--muted); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .opts button { border: 0; background: none; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .opts button.on { color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
  .opts button:disabled { opacity: .4; cursor: default; }
  .opts .gap { width: 10px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 18px; }
  .back:hover { color: var(--fg); }
  .th { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .th h1 { font-size: 26px; line-height: 1.15; }
  .th .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .reason { font-size: 16px; margin: 18px 0 0; line-height: 1.5; }
  .hero { margin: 24px 0 6px; }
  .hero .big { font-size: 44px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .hero .cap { color: var(--muted); margin-top: 8px; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile > span { display: block; color: var(--muted); font-size: 12.5px; }
  .tile b { display: block; font-size: 17px; font-weight: 600; margin-top: 3px; }
  .tile small { color: var(--muted); font-size: 12.5px; }
  .copybox { margin-top: 20px; }
  .copybox p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .copybox .head { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .amount { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; }
  .amount .box { display: flex; align-items: center; gap: 2px; padding: 0 12px; height: 42px; border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--line); background: var(--card); flex: 1 1 0; min-width: 64px; max-width: 200px; }
  .amount .box:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .amount input { border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px;
    font-weight: 600; width: 100%; font-variant-numeric: tabular-nums; }
  .amount button { height: 36px; padding: 0 12px; flex: none; border-radius: 999px; border: 0; background: var(--soft); color: var(--fg);
    font: inherit; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; }
  .amount button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .receipt { border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 15px; }
  .receipt div + div { border-top: 1px solid var(--line); }
  .receipt span { color: var(--muted); }
  .receipt .total span, .receipt .total b { color: var(--fg); font-weight: 600; }
  details.fold { margin-top: 32px; border-top: 1px solid var(--line); }
  details.fold > summary { list-style: none; cursor: pointer; padding: 16px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "Show"; color: var(--muted); font-weight: 500; font-size: 14px; }
  details.fold[open] > summary::after { content: "Hide"; }
  .fold h3 { font-size: 15px; margin: 22px 0 8px; }
  .fold p.note { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl .n { text-align: right; white-space: nowrap; }
  .tbl td .s { color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ext { color: var(--muted); font-size: 14px; font-weight: 500; }
  .ext:hover { color: var(--fg); }
  .s .ext, .sub .ext { font-size: inherit; }

  /* interests: onboarding and the picker */
  .onb { max-width: 460px; margin: 6vh auto 0; text-align: center; }
  .onb h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; }
  .onb .lede { margin: 10px auto 0; font-size: 15.5px; max-width: 380px; }
  .pick h2 { font-size: 17px; margin: 0 0 14px; }
  .onb .pick { margin-top: 40px; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .onb .picks { justify-content: center; }
  .picks button { border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 15px;
    font-weight: 500; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  .picks button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
  .pick .alt { display: block; margin: 14px auto 0; color: var(--muted); font-weight: 500; text-decoration: none; }
  .pick .alt:hover { color: var(--fg); }

  /* Traders: a leaderboard. One bar: filters on the left, how you view the list on the right */
  .lb-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
  .lb-filters { display: flex; align-items: center; gap: 6px; flex: none; padding-block: 2px; scrollbar-width: none; }
  .lb-filters::-webkit-scrollbar { display: none; }
  .lb-view { display: flex; align-items: center; gap: 10px; flex: none; }
  .lb-divider { width: 1px; height: 20px; background: var(--line); flex: none; margin-inline: 4px; }
  .lb-chip { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; cursor: pointer; }
  .lb-chip[aria-disabled="true"] { color: var(--faint); cursor: not-allowed; }
  .lb-chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .lb-search { position: relative; display: flex; align-items: center; }
  .lb-search svg { position: absolute; left: 11px; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
  .lb-search input { box-sizing: border-box; width: 230px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 12px 5px 32px; font: inherit; font-size: 14px; }
  .lb-search input::placeholder { color: var(--faint); }
  .lb-period { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Sentences the SDK writes (reasons, checks, evidence) say "bet"; the page says "trade".
const sdkText = (t) => String(t ?? "").replace(/\b([Bb])et(s?)\b/g, (_, b, s) => (b === "B" ? "Trade" : "trade") + s)
  .replace(/\bat (0\.\d+) or better\b/g, (_, x) => `at ${Math.round(parseFloat(x) * 1000) / 10}¢ or better`);
const VENUE = { kalshi: "Kalshi", polymarket: "Polymarket", polymarket_us: "Polymarket US" };
// The venues Signals reads (SIGNALS_VENUES on the engine, from /api/config): Polymarket only for now. Kalshi's
// views (Top profit's venue choice, Kalshi trader pages, "Same person on Kalshi?") show only when it's on.
let venuesOn = ["polymarket"];
const kalshiOn = () => venuesOn.includes("kalshi");
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;

async function api(path, opts = {}) {
  if (path.startsWith("/api/me")) { // your follows: sent with Clerk's short-lived session token
    const t = await window.Clerk?.session?.getToken().catch(() => null);
    if (t) opts = { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${t}` } };
  }
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body?.detail?.message || (typeof body?.detail === "string" ? body.detail : "") || `Request failed (${r.status})`);
  return body;
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

// ---- signing in (Clerk: Google or Telegram), only to follow traders ----
// Browsing needs no account. Clerk loads only when the engine has a publishable key (/api/config), from the
// Frontend API the key names. `me` is who you follow and whether Telegram alerts are connected.
const auth = { on: false, alerts: false, ready: false, loading: false, failed: false, me: null, meErr: null, uid: null, then: null };
const signedIn = () => !!window.Clerk?.isSignedIn;
function loadScript(src, attrs = {}) {
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    Object.assign(s, { src, async: true, crossOrigin: "anonymous", onload: ok, onerror: fail });
    for (const [k, v] of Object.entries(attrs)) s.setAttribute(k, v);
    document.head.appendChild(s);
  });
}
async function startAuth(key, alerts) {
  const m = /^pk_(test|live)_(.+)$/.exec(key || "");
  let fapi = "";
  try { fapi = m ? atob(m[2].replace(/-/g, "+").replace(/_/g, "/")).replace(/\$$/, "") : ""; } catch {}
  if (!/^[a-z0-9.-]+$/i.test(fapi)) return;
  auth.loading = true; // the Feed's Following waits for it rather than asking a signed-in person to sign in
  try {

// Prices in whole cents; tenths only under 1¢ (or between 99¢ and 100¢), or when two prices would look equal.
const tenths = (p) => `${Math.round(p * 1000) / 10}¢`;
function cents(p) {

}
function centsPair(a, b) {
  if (a == null || b == null) return [cents(a), cents(b)];
  const lookSame = Math.round(a * 100) === Math.round(b * 100) && Math.round(a * 1000) !== Math.round(b * 1000);
  return lookSame ? [tenths(a), tenths(b)] : [cents(a), cents(b)];
}

const centsSigned = (x) => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(Math.round(x * 1000) / 10)}¢`;
function usd(x, signed = false) {

    : a >= 1e3 ? `${(a / 1e3).toFixed(a >= 1e5 ? 0 : 1)}K` : a >= 10 ? Math.round(a).toLocaleString("en-US") : a.toFixed(2);
  return `${x < 0 ? "−" : signed && x > 0 ? "+" : ""}$${s.replace(/\.0([KMB])$/, "$1")}`;
}

function slippageLine(p) {
  if (p.best_price == null || p.price == null) return "";
  const c = (x) => `${Math.round(x * 1000) / 10}¢`, slip = p.price - p.best_price;
  return slip > 0.0005
    ? `<p>Slippage: your average fill, ${c(p.price)}, is ${c(slip)} above the best price for sale, ${c(p.best_price)}, because this amount buys into pricier offers.</p>`
    : `<p>Slippage: none. It all fills at the best price for sale, ${c(p.best_price)}.</p>`;
}
// Money you put in or get back, to the cent: "$49.91", "+$42.09".
const money = (x, signed = false) => x == null ? "—" : `${x < 0 ? "−" : signed && x > 0 ? "+" : ""}$${Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
async function costBox(box, b, amount = 10) {
  box.innerHTML = `<div class="head">What copying it costs</div>
    <p>${b.at ? `They bought ${ago(b.at)}${b.price != null ? ` at ${cents(b.price)}` : ""}. ` : ""}How much would you put in, fee included? Priced from what's for sale on Polymarket right now.</p>
    <div class="amount"><label class="box"><span class="muted">$</span><input id="amt" inputmode="decimal" autocomplete="off" aria-label="Amount in dollars" value="${amount}"></label>
      ${PICKS.map((v) => `<button type="button" data-amt="${v}" aria-pressed="${v === amount}">$${v}</button>`).join("")}</div>
    <div id="pv"><div class="skel" style="width:70%;height:14px"></div></div>
    <p>Prices can change before you buy on Polymarket.</p>
    ${b.url ? `<a class="btn wide" id="buyon" href="${esc(b.url)}" target="_blank" rel="noopener" style="display:block;text-align:center">Buy on Polymarket ↗</a>
      <p class="fine">Signals places no orders: you buy on Polymarket yourself.</p>` : ""}`;
  const input = $("#amt", box), pv = $("#pv", box);
  const top = document.getElementById("sheetstatus"), before = top ? top.innerHTML : "";
  const setTop = (st, why) => { if (top) top.innerHTML = `${STATUS[st] ? statusLine(st) : `<span class="status moved"><i></i>${esc(st)}</span>`}<p class="explain">${esc(why)}</p>`; };
  const resetTop = () => { if (top) top.innerHTML = before; };
  let seq = 0, timer = null;
  const spendNow = () => { const v = parseFloat(String(input.value).replace(/[$,\s]/g, "")); return Number.isFinite(v) ? Math.round(v * 100) / 100 : null; };
  const show = async () => {
    const spend = spendNow(), my = ++seq;
    $$("[data-amt]", box).forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.amt === spend)));
    if (!spend || spend <= 0) { pv.innerHTML = `<p>Enter an amount above $0.</p>`; return; }
    let p;
    try { p = await post("/api/trade/preview", { ...oneTrade(b), spend }); }
    catch (e) { if (my === seq) pv.innerHTML = `<p class="inline-err">${esc(e.message)}</p>`; return; }
    if (my !== seq || !box.isConnected) return; // a newer amount is on its way
    if (!p.ok) {
      const np = notPriced(p, spend);
      // Said once: in the status line at the top when the sheet has one, else here.
      if (np.status && top) { setTop(np.status, np.line); pv.innerHTML = ""; }
      else { resetTop(); pv.innerHTML = `<p>${esc(np.line)}</p>`; }
      if (np.room >= 1) pv.innerHTML += `<p><button type="button" class="btn ghost small" id="useroom">Use ${money(np.room)} instead</button></p>`;
      const use = $("#useroom", pv);
      if (use) use.onclick = () => { input.value = np.room.toFixed(2); clearTimeout(timer); show(); };
      return;
    }
    if (p.depth_checked) setTop("in", fillExplain(p, b, spend));
    else resetTop();
    const avg = Math.round(p.price * 1000) / 10, worst = p.worst_price != null ? Math.round(p.worst_price * 1000) / 10 : avg;
    pv.innerHTML = `<p>${plural(p.contracts, "contract")}${b.outcome ? ` of ${esc(b.outcome)}` : ""} on Polymarket, ${p.depth_checked ? "priced from what's for sale right now" : "at the cheapest price for sale now"}.</p>
      <div class="receipt">
        <div><span>${plural(p.contracts, "contract")} × ${worst > avg ? `${avg}¢ average` : `${avg}¢`}</span><b>${money(p.cost)}</b></div>
        <div><span>Polymarket fee</span><b>${p.fee > 0 ? money(p.fee) : "No fee"}</b></div>
        <div class="total"><span>Total</span><b>${money(p.total)}</b></div>
      </div>
      <div class="kv" style="margin:0 0 14px">
        <div><span>${ifWins(b.outcome)}</span><b>You get ${money(p.payout)}</b></div><div><span>${ifLoses(b.outcome)}</span><b>You lose ${money(p.total)}</b></div>
      </div>
      <p style="margin-top:-6px">That's ${pl(p.profit_if_win, money(p.profit_if_win, true))} if it wins. Each contract pays $1 if it wins and nothing if it loses.${!p.depth_checked ? " Polymarket's order book couldn't be read just now, so an order this size might fill higher." : ""}</p>
      ${slippageLine(p)}`;
  };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(show, 350); };
  $$("[data-amt]", box).forEach((x) => (x.onclick = () => { input.value = x.dataset.amt; clearTimeout(timer); show(); }));
  show();
}

// one handler for the clickable things inside a container
function bindActions(root) {
  $$("[data-trade]", root).forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("button, a")) tradeSheet(shown[+el.dataset.trade]); };
    el.onkeydown = (e) => { if (e.key === "Enter" && e.target === el) tradeSheet(shown[+el.dataset.trade]); };
  });
  $$("[data-open-trade]", root).forEach((btn) => (btn.onclick = (e) => { e.stopPropagation(); tradeSheet(shown[+btn.dataset.openTrade]); }));
  $$("[data-retry]", root).forEach((btn) => (btn.onclick = () => route()));
  $$("[data-href]", root).forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("a")) location.hash = el.dataset.href; };
    el.onkeydown = (e) => { if (e.key === "Enter" && e.target === el) location.hash = el.dataset.href; };
  });
}

// ---- feed ----
// Two parts: Following (#/, the default: trades of the traders you follow, signed in; a short sign-in prompt when
// signed out) and Recommended (#/recommended: $1,000 or more from Traders' three sections, quieter on purpose and
// never above Following). Both show your markets, the ones picked at onboarding or with Traders' chips; the chips
// live on Traders only, the Feed says which markets it shows and Change opens the same picker as onboarding.
// Big trades (#/big: $250 or more right now) stays reachable from the foot of Recommended.
const feed = { data: null, at: 0, err: null, mine: null, mineAt: 0, mineErr: null, onlyIn: true, big: null, bigAt: 0, bigErr: null, seq: 0 };
let feedTimer = null;
const onFeed = () => routeName().startsWith("feed");
const feedView = () => ({ "feed:big": "big", "feed:rec": "rec" })[routeName()] || "follow";
const FEED_PARTS = [["follow", "#/", "Following"], ["rec", "#/recommended", "Recommended"]];
// What each view keeps: [data, updated at, error] keys in `feed`.
const FEED_KEYS = { follow: ["mine", "mineAt", "mineErr"], rec: ["data", "at", "err"], big: ["big", "bigAt", "bigErr"] };

async function feedPage(view) {
  $("#app").innerHTML = `<nav class="seg" aria-label="Feed">${FEED_PARTS
    .map(([k, href, l]) => `<a href="${href}" class="${view === k ? "on" : ""}"${view === k ? ' aria-current="page"' : ""}>${l}</a>`).join("")}</nav>
    <div id="fbar"></div><div id="flist">${skelCards(3)}</div>`;
  if (feed[FEED_KEYS[view][0]] || (view === "follow" && !canFollowFeed())) renderFeed();
  await loadFeed();
}
// Following needs to know who you follow: signed in, with your follows read.
const canFollowFeed = () => auth.on && signedIn() && !!auth.me;
async function loadFeed() {
  clearTimeout(feedTimer);
  const my = ++feed.seq; // a newer call (the Clerk listener, a tab switch) makes this one stale: one 30 s loop only
  const view = feedView(), [k, at, err] = FEED_KEYS[view];
  if (view === "follow" && !canFollowFeed()) { renderFeed(); return; } // signed out: the prompt, nothing to read
  const uid = auth.uid;
  let data = null, error = null;
  try { data = await api(view === "big" ? "/api/trading-now?min_usd=250" : view === "rec" ? "/api/live" : "/api/me/feed"); }
  catch (e) { error = e.message; }
  if (my !== feed.seq || (view === "follow" && uid !== auth.uid)) return; // stale, or someone else signed in since
  if (error) feed[err] = error; else { feed[k] = data; feed[at] = Date.now(); feed[err] = null; }
  if (!onFeed() || feedView() !== view) return; // the other view, or another page, since
  clearTimeout(feedTimer);
  feedTimer = setTimeout(() => { if (onFeed()) loadFeed(); }, 30000);
  renderFeed();
}
// Who is signed in (Clerk's user id, or null). Another account, or none: the last one's Following goes.
function accountIs(uid) {
  if (uid === auth.uid) return;
  auth.uid = uid;
  Object.assign(feed, { mine: null, mineAt: 0, mineErr: null });
}
// Who you follow (/api/me). A failure is kept, so Following shows it with "Try again", never loading forever.
async function readMe() {
  if (!signedIn()) { Object.assign(auth, { me: null, meErr: null }); return; }
  try { auth.me = await api("/api/me"); auth.meErr = null; } catch (e) { auth.me = null; auth.meErr = e.message || "Couldn't read your account."; }
}

// Which markets the Feed shows, in one line: "Your markets: Politics, Sports · Change".
function marketLine() {
  const picked = interests || [];
  return `<span class="mkts">Your markets: <b>${picked.length ? esc(picked.join(", ")) : "All"}</b><span class="sep">·</span><button class="link" id="mktchange">Change</button></span>`;
}
const inMarkets = (cat) => !(interests || []).length || interests.includes(cat);
function marketsSheet() {
  const panel = sheet(`<div id="mktpick"></div><p class="explain" style="margin:18px 0 0;text-align:center;font-size:13px">Traders shows the same markets.</p>`);
  interestPicker($("#mktpick", panel), { selected: (interests || []).filter((c) => INTERESTS.includes(c)), go: "Show these markets",
    alt: "All markets", onDone: (v) => { setInterests(v, { picked: true }); closeSheet(); renderFeed(); } });
}
function bindFeedMarkets() {
  const change = $("#mktchange"); if (change) change.onclick = marketsSheet;
  const all = $("#feedall"); if (all) all.onclick = () => { toggleInterest(""); renderFeed(); };
}

function renderFeed() {
  const view = feedView();
  if (view === "big") return renderBig();
  if (view === "follow") return renderFollowing();
  const r = feed.data;
  if (!r) { $("#fbar").innerHTML = ""; $("#flist").innerHTML = errorState(feed.err || "No answer from the app."); bindActions($("#flist")); return; }
  if (!r.traders.length) {
    $("#fbar").innerHTML = "";
    $("#flist").innerHTML = emptyState("No traders to recommend yet",
      "The first check of Polymarket traders takes 20–30 minutes. Recommended fills in once it finds traders worth following.",
      `<a class="btn ghost" href="#/traders">See the traders</a>`);
    return;
  }
  const min = `$${Math.round(r.min_usd ?? 1000).toLocaleString("en-US")}`; // "$1,000", as everywhere else
  renderTrades(r, feed.at, feed.err, {
    who: `${plural(r.traders.length, "trader")} we recommend`,
    note: `<p class="foot-note" style="margin:0 0 12px">Only trades of ${min} or more from Sharps and Rising traders. ${NOT_A_TIP}</p>
      ${r.traders.some((t) => t.copy_ok) ? "" : pausedNote(`Their trades still show here. <a class="link" href="#/traders">Why?</a>`)}`,
    none: [`No trades of ${min} or more in the last ${r.hours} hours`, "Recommended shows only bigger trades, so it's often quiet. Trades show up here a few minutes after they're made."],
    sheet: () => followingSheet(r.traders, "rec"),
    foot: `<p class="foot-note"><a class="link" href="#/big">All big trades right now</a></p>`,
  });
}

// Following: the traders you follow, for alerts or research, whoever they are. Signed out, one short prompt.
function renderFollowing() {
  if (!canFollowFeed()) {
    $("#fbar").innerHTML = "";
    const meFailed = auth.on && signedIn() && !auth.me && auth.meErr;
    const loading = auth.loading || (auth.on && signedIn() && !auth.me && !auth.meErr);
    const rec = `<a class="btn ghost" href="#/recommended">See Recommended</a>`;
    $("#flist").innerHTML = loading ? skelCards(3)
      : meFailed ? `<div class="state err"><b>Couldn't load who you follow</b><p>${esc(auth.meErr)}</p><button class="btn ghost" id="meretry">Try again</button></div>`
      : auth.on ? emptyState("See the trades of traders you follow", "Sign in, then follow traders from their page: their trades show up here, and alerts can go to Telegram.",
        `<button class="btn" id="feedsignin">Sign in</button> ${rec}`)
      : auth.failed ? emptyState("Signing in couldn't load just now", "Following needs signing in. Try again in a minute; Recommended shows trades from the traders we recommend.", rec)
      : emptyState("Following needs signing in", "Signing in isn't switched on here. Recommended shows trades from the traders we recommend.", rec);
    const b = $("#feedsignin"); if (b) b.onclick = () => window.Clerk.openSignIn();
    const again = $("#meretry"); if (again) again.onclick = async () => { auth.meErr = null; renderFollowing(); await readMe(); loadFeed(); };
    return;
  }
  const r = feed.mine;
  if (!r) { $("#fbar").innerHTML = ""; $("#flist").innerHTML = feed.mineErr ? errorState(feed.mineErr) : skelCards(3); bindActions($("#flist")); return; }
  if (!r.traders.length) {
    $("#fbar").innerHTML = "";
    $("#flist").innerHTML = emptyState("You don't follow anyone yet", "Follow a trader from their page to see their trades here.", `<a class="btn" href="#/traders">Find traders</a>`);
    return;
  }
  renderTrades(r, feed.mineAt, feed.mineErr, {
    who: `${plural(r.traders.length, "trader")} you follow`, note: "",
    none: [`None of the traders you follow traded in the last ${r.hours} hours`, "New trades show up here a few minutes after they're made."],
    sheet: () => followingSheet(r.traders, "follow"), foot: "",
  });
}

// One list of trade cards (Following or Recommended): who, when it was updated, your markets, the switch, notes,
// then one card per outcome ("Also bought by" for the rest) and the empty states.
function renderTrades(r, at, err, { who, note, none, sheet: openSheet, foot }) {
  const cards = oneCardPerTrade(r.bets);
  const pool = cards.filter((b) => !feed.onlyIn || b.status === "in");
  const names = interestNames(interests || []);
  $("#fbar").innerHTML = `
    <div class="feedtop">
      <button class="follow" id="following">${`<span class="stack">${r.traders.slice(0, 5).map((t) => avatar(t.wallet, 28)).join("")}</span>`}
        <b>${who}</b><span class="chev">›</span></button>
      ${fresh(at)}
    </div>
    <div class="filters">
      ${marketLine()}
      <label class="switch"><input type="checkbox" id="onlyin" ${feed.onlyIn ? "checked" : ""}><span class="track"></span>Only trades I can still get into</label>
    </div>
    ${err ? `<p class="inline-err">Couldn't refresh: ${esc(err)}. Showing the last update.</p>` : ""}
    ${note}
    ${r.failed ? `<p class="foot-note" style="margin:0 0 12px">${plural(r.failed, "trader")} couldn't be read just now; retrying.</p>` : ""}`;
  $("#onlyin").onchange = (e) => { feed.onlyIn = e.target.checked; renderFeed(); };
  $("#following").onclick = openSheet;
  bindLag();

  shown = pool.filter((b) => inMarkets(b.category));
  const anyHere = cards.some((b) => inMarkets(b.category)); // before "Only trades I can still get into"
  let html;
  if (!r.bets.length) html = emptyState(none[0], none[1]);
  else if (!shown.length && anyHere) html = emptyState("Nothing you can still get into",
    `Every ${names ? esc(names) + " " : ""}trade here from the last ${r.hours} hours has moved away or settled.`, `<button class="btn ghost" id="showall">Show all trades</button>`);
  else if (!shown.length) html = emptyState(`No ${esc(names)} trades`, `Nothing in ${esc(names)} in the last ${r.hours} hours.`, `<button class="btn ghost" id="feedall">Show all markets</button>`);
  else html = `<div class="cards">${shown.map((b, i) => tradeCard(b, i)).join("")}</div>`;
  $("#flist").innerHTML = html + foot;
  const all = $("#showall");
  if (all) all.onclick = () => { feed.onlyIn = false; renderFeed(); };
  bindFeedMarkets();
  bindActions($("#flist"));
}

// Big trades: trades of $250 or more on the venues Signals reads, one card each, in the Feed's card style.
// Polymarket only (for now), every trade knows its market, so Big trades opens on your markets like the rest of
// the Feed. With Kalshi on, it shows everything: the SDK has no categories for Kalshi markets, and almost all
// big trades are Kalshi's, so a filter would mostly hide them. The SDK's big trades have no price now, so there
// is no "You can still get in" here; a named trader's card opens their page.
function renderBig() {
  const rows = feed.big;
  if (!rows) { $("#fbar").innerHTML = ""; $("#flist").innerHTML = errorState(feed.bigErr || "No answer from the app."); bindActions($("#flist")); return; }
  const filtered = !kalshiOn();
  const names = interestNames(filtered ? interests || [] : []);
  const list = filtered ? rows.filter((t) => inMarkets(t.category)) : rows;
  const where = venuesOn.map((v) => VENUE[v]).join(" and ");
  $("#fbar").innerHTML = `
    <div class="feedtop"><span class="muted" style="font-size:14px">${filtered ? "Trades" : "Every trade"} of $250 or more right now, on ${where}.</span>
      ${fresh(feed.bigAt)}</div>
    ${filtered ? `<div class="filters">${marketLine()}</div>` : ""}
    ${feed.bigErr ? `<p class="inline-err">Couldn't refresh: ${esc(feed.bigErr)}. Showing the last update.</p>` : ""}`;
  let html;
  if (!rows.length) html = emptyState("No big trades right now", "Trades of $250 or more show up here as they happen.");
  else if (!list.length) html = emptyState(`No big ${esc(names)} trades right now`, `None of the last ${plural(rows.length, "big trade")} ${rows.length === 1 ? "is" : "are"} in ${esc(names)}.`,
    `<button class="btn ghost" id="feedall">Show all markets</button>`);
  else html = `<div class="cards">${list.map(bigCard).join("")}</div>${kalshiOn() ? `<p class="foot-note">Kalshi names only traders who turned on their social profile.</p>` : ""}`;
  $("#flist").innerHTML = html;
  bindLag();
  bindFeedMarkets();
  bindActions($("#flist"));
}
function bigCard(t) {
  const href = t.trader ? `#/t/${t.venue}/${encodeURIComponent(t.trader)}` : "";
  const pick = t.outcome && t.venue === "polymarket" ? t.outcome : t.outcome ? `${t.side.toUpperCase()} · ${t.outcome}` : t.side.toUpperCase();
  return `<article class="card${href ? " trade" : ""}"${href ? ` data-href="${href}" tabindex="0"` : ""}>
    <div class="trade-top">${avatar(t.trader ? `${t.venue}:${t.trader}` : "anon", 28)}<span class="who"><span class="name">${t.trader ? esc(displayName(t.name, t.trader)) : "Anonymous trader"}</span></span>
      <span class="when">${[t.category, kalshiOn() ? VENUE[t.venue] : null, ago(t.at)].filter(Boolean).map(esc).join(" · ")}</span></div>
    <h3 class="trade-title">${esc(t.title || t.market)}</h3>
    <div class="trade-tags"><span class="chip">${esc(pick)}</span>${marketLink(t.url, `${VENUE[t.venue]} ↗`)}</div>
    <div class="trade-nums"><span>${t.action === "buy" ? "Bought" : "Sold"} at <b>${cents(t.price)}</b></span><span class="amt">${usd(t.usd)}</span></div>
    ${t.trader ? "" : `<div class="trade-foot"><span class="muted" style="font-size:14px">Anonymous: ${VENUE[t.venue] || "the venue"} doesn't name this trader.</span></div>`}
  </article>`;
}
setInterval(() => { const u = $("#updated"), at = feed[FEED_KEYS[feedView()][1]]; if (u && at) u.innerHTML = updatedAgo(at); }, 5000);

// Traders we follow often buy the same thing, minutes apart: one card per outcome they bought. It shows the
// buy you can best still follow (you can still get in, then whoever bought first) and lists the others;
// it sorts by the newest buy of the lot.
const LEAD = { in: 0, moved: 1 };
// Among buys you can still get into, one copying is offered for leads, so a neutral card never hides it.
const leadOf = (b) => (LEAD[b.status] ?? 2) * 2 + (b.status === "in" && b.copy_ok === true ? 0 : 1);
function oneCardPerTrade(bets) {
  const by = new Map();
  for (const b of bets) {
    const k = b.token || b.market; // the exact outcome token; the outcome index is sometimes junk
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(b);
  }
  return [...by.values()].map((g) => {
    g.sort((a, b) => leadOf(a) - leadOf(b) || a.at.localeCompare(b.at));
    const latest = g.reduce((m, x) => (x.at > m ? x.at : m), g[0].at);
    return { ...g[0], also: g.slice(1).map((x) => ({ wallet: x.wallet, name: x.name })), latest };
  }).sort((a, b) => b.latest.localeCompare(a.latest));
}

function followingSheet(traders, kind = "rec") {
  const panel = sheet(`<h2>${plural(traders.length, "trader")} ${kind === "follow" ? "you follow" : "we recommend"}</h2>
    <p class="explain">${kind === "follow" ? "Following shows every trade of theirs from the last day. Follow or unfollow from a trader's page."
      : "Recommended shows trades of $1,000 or more from the traders in Sharps and Rising."} <button class="link" id="howlink">How we pick traders</button></p>
    <div class="list" style="margin-top:16px">${traders.map((t) => `<a class="trow norank" href="#/worth/${esc(t.wallet)}">${avatar(t.wallet, 36)}
      <span class="tmain"><span class="name">${esc(displayName(t.name, t.wallet))}</span></span>${tier(t.segment)}</a>`).join("")}</div>`);
  $$("a", panel).forEach((a) => a.addEventListener("click", closeSheet));
  $("#howlink", panel).onclick = () => howSheet();
}

// "How we pick traders": The checks (what we look at), The tiers (what passing earns, and where it's listed) and
// Copying (a separate question, never part of the tier). `tab` opens one of them; `focus` marks a check, a tier
// ("proven", …) or a copy status ("costly", …) and scrolls to it.
const HOW_CHECKS = [
  ["edge", "The price moves their way.", "A few minutes after they buy, has the market come round to their view? That's the main sign of skill."],
  ["n", "Enough trades to trust it.", "One good week isn't a record. Trades on the same game count once."],
  ["luck", "Not one lucky win.", "Their edge has to hold without their best trades, and their profit without their biggest win."],
  ["profit", "Profitable from trading.", "They made money from trading over the last 30 days. Rewards and rebates don't count."],
  ["side", "They take a side.", "Market makers and arbitrage traders have no view to follow, so they're left out."],
  ["active", "Still trading.", "Nobody who hasn't bought anything in a week is recommended."],
];
const HOW_TIERS = [
  ["proven", "Passes every check over at least 40 separate trades, on an account the leaderboards list or a big one."],
  ["quiet", "The same over at least 25 trades, on a small account no leaderboard lists."],
  ["rising", "Good early signs, too few trades to be sure yet."],
];
// Every trader's copy status, in the engine's words (copy_status): what copies a minute or more after them kept.
const HOW_COPY = [
  ["copyable", "Copyable", "Copies kept money after fees, and not by luck: even the low end of our estimate is above zero, over at least 8 trades. Only for Proven sharps, Quiet sharps and Rising."],
  ["not_proven", "Copy not proven", "What copies kept isn't reliably above zero, or too few of their trades had prices after the buy to tell."],
  ["costly", "Costly to copy", "Copies lost money after fees in the trades we checked: even the high end of our estimate is below zero. Usually the price has moved their way before a copy gets in."],
  ["not_offered", "Not offered", "Copies kept money, but the trader's own record doesn't pass the checks."],
];

// ---- interests: asked once per browser ----
// Kept in localStorage; [] means all markets, null not asked yet. Storage can be blocked (private windows),

// the Feed's Change all set the same choice, from the four markets.
const INTERESTS = ["Politics", "Sports", "Crypto", "Esports"];
const INTERESTS_KEY = "signals.interests";
let interests = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(INTERESTS_KEY));
    if (Array.isArray(v)) return v.filter((c) => typeof c === "string" && c && c.length <= 40);
  } catch {}
  return null;
})();
// `picked`: the choice came from onboarding's question or the Feed's "Your markets · Change", the two places that
// ask which markets interest you. Only such a choice is kept on your account; Traders' chips only filter the view.
function setInterests(v, { picked = false } = {}) {
  interests = v;
  try { localStorage.setItem(INTERESTS_KEY, JSON.stringify(v)); } catch {}
  if (picked) {
    try { localStorage.setItem(PICKED_KEY, "1"); } catch {}
    saveInterests();
  }
}
const PICKED_KEY = "signals.interests.picked";
const wasPicked = () => { try { return localStorage.getItem(PICKED_KEY) === "1"; } catch { return false; } };
// Signed in, a picked choice is also kept on your account (the engine's /api/me/interests), so big trades in those
// markets can alert you on Telegram. Nobody saved, or [] (Skip, all markets: no choice made), gets none.
function saveInterests() {
  if (!signedIn() || !auth.me || !Array.isArray(interests)) return;
  const v = interests.filter((c) => INTERESTS.includes(c));
  if (JSON.stringify(auth.me.interests) === JSON.stringify(v)) return;
  api("/api/me/interests", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ interests: v }) })
    .then((me) => { auth.me = me; }, () => {});
}
// On signing in: markets picked before signing in go to the account (never an unchosen [] over a saved choice);
// a new browser takes the account's.
function syncInterests() {
  if (auth.me.interests == null) { if (wasPicked() && interests?.length) saveInterests(); return; }
  if (interests === null) {
    interests = auth.me.interests;
    try { localStorage.setItem(INTERESTS_KEY, JSON.stringify(interests)); localStorage.setItem(PICKED_KEY, "1"); } catch {}
    if ($(".onb")) route(); // past onboarding: they've answered it already
  }
}
// A market chip on Traders (and the Feed's "Show all markets"): "" (All) clears them; any other turns that market on or off.
function toggleInterest(c) {
  const now = new Set(interests || []);
  if (!c) now.clear(); else now.has(c) ? now.delete(c) : now.add(c);
  setInterests([...INTERESTS.filter((x) => now.has(x)), ...[...now].filter((x) => !INTERESTS.includes(x)).sort()]);
}
const interestNames = (cs) => cs.length < 2 ? cs.join("") : `${cs.slice(0, -1).join(", ")} or ${cs[cs.length - 1]}`;
// A trader matches when an interest is their most-traded category or one they're strong in.
const matchesInterests = (s, picked) => !picked.length || picked.includes(s.categories[0]?.category)
  || s.strong_categories.some((c) => picked.includes(c));

// ---- traders: a leaderboard of the traders we recommend ----
// One bar: market chips (the onboarding interests), Copyable only, search by name or wallet, period, sort.

const SEG_ORDER = ["proven", "quiet", "rising"]; // the tiers we recommend, in order
const RANKED = 25;
let worthTimer = null, worthLast = null;
const topOpts = { venue: "all", by: "pnl" };
const lb = { copyOnly: false, q: "", sort: null, period: "30d", all: false, more: {} }; // more: "Show more" pressed, per section
// Traders' sections, from the engine's section_of: by tier alone, so the list and its tests agree. Copying is
// each row's copy status, and "Copyable only" filters on it.
const SECTIONS = [
  ["sharp", "Sharps", "The price moves their way after they buy, over enough trades to trust it. Each one's copy status is apart."],
  ["rising", "Rising", "Good early signs, too few trades to be sure yet."],

// Copying is offered by one rule, the engine's (copy_offer): a recommended tier, and copies a few minutes late
// reliably above zero after fees (the bottom of the 95% range). Traders, a profile, the Feed and the copy routes
// all use it, so none can offer what another refuses.
const isCopyable = (s) => s.copy_ok === true;
// A trader's copy status, apart from their tier, in the engine's words (copy_status): Copyable, Copy not proven,
// Costly to copy or Not offered.
const COPY_LABELS = ["Copyable", "Copy not proven", "Costly to copy", "Not offered"];
const copyLabel = (s) => isCopyable(s) ? "Copyable" : COPY_LABELS.includes(s?.copy_label) ? s.copy_label : "Copy not proven";
// What a copy kept after fees is an estimate: always with its 95% range, and never shown as a gain unless the
// whole range is above zero.
const copyRange = (s) => s.copy_return_low != null && s.copy_return_high != null ? `${lbPct(s.copy_return_low)} to ${lbPct(s.copy_return_high)}` : null;
const copyFigure = (s) => s.copy_return == null ? null : `Estimated copy return: ${lbPct(s.copy_return)} after fees${copyRange(s) ? ` (95% range ${copyRange(s)})` : ""}`;
// with no reason beside it (a list row), a positive estimate says why it still isn't copyable
const copyEstimate = (s) => s.copy_return == null ? null : `${copyFigure(s)}${!isCopyable(s) && s.copy_return > 0 ? ", but it isn't reliably above zero." : "."}`;
// Weeks in profit out of the weeks they have history for: a week before their first trade isn't a losing week.
const weeksUp = (s) => s.weeks_up ?? null;
// What "up" means for a week: trading profit, so open trades count at their value that week.
const WEEK_COUNTS = "A week counts profit taken plus the change in value of trades still open.";
const weeksOf = (s) => s.weeks_known ?? null;
// Trading profit only: never Polymarket's own figure (rewards and rebates in) when it's missing.
const profitOf = (s, p) => s.periods?.[p]?.trading_pnl ?? (p === "30d" ? s.trading_pnl_window : null) ?? null;
const perDollarOf = (s, p) => s.periods?.[p]?.return_per_dollar ?? (p === "30d" ? s.return_per_dollar : null) ?? null;
// Sorts rank by the bottom of each figure's 95% range, and only from enough of a sample (the engine leaves the
// rest null, at the bottom): 1 of 1 settled isn't the best win rate, 2 of 2 weeks isn't the most consistent.
const winRateOf = (s) => s.win_low ?? null;
// New markets they bought into (adding to a trade they already have isn't a new one), from the SDK's decisions.
const perDayText = (n) => n == null ? "" : n >= 1 ? `${plural(Math.round(n), "market")} a day`
  : Math.round(n * 7) ? `${plural(Math.round(n * 7), "market")} a week` : "fewer than one market a week"; // never a made-up one
// The days their win record, usual trade and markets a day cover: 30, or fewer for a busy trader whose last
// 5,000 fills (all the SDK reads) start later than that (covered_days, from the engine).
const readDays = (s) => s.covered_days != null && s.covered_days < 29 ? s.covered_days : 30;
const readPeriod = (s) => `last ${readDays(s)} days`;
const isWalletQuery = (q) => /^0x[0-9a-f]{40}$/i.test(q.trim());
const PERIOD_DAYS = { "7d": 7, "30d": 30, "90d": 90 };
const byDesc = (f) => (a, b) => (f(b) ?? -Infinity) - (f(a) ?? -Infinity);
// returns here are small (copies keep fractions of a percent), so one decimal under 10%
const lbPct = (x) => {
  if (x == null) return "—";
  const v = Math.abs(x) < 0.1 ? (Math.abs(x) * 100).toFixed(1) : String(Math.round(Math.abs(x) * 100));
  return `${Number(v) === 0 ? "" : x > 0 ? "+" : "−"}${v}%`; // rounds to zero: no sign
};
const LB_SORTS = {
  recommended: ["Recommended", (a, b) => SEG_ORDER.indexOf(a.segment) - SEG_ORDER.indexOf(b.segment) || (b.edge?.z ?? -99) - (a.edge?.z ?? -99)],
  consistent: ["Most consistent", (a, b) => (b.consistency_low ?? -1) - (a.consistency_low ?? -1) || (profitOf(b, "30d") ?? 0) - (profitOf(a, "30d") ?? 0)],
  profit: ["Profit", byDesc((s) => profitOf(s, lb.period))],
  won: ["Win rate", byDesc(winRateOf)],
  active: ["Most active", byDesc((s) => s.trades_per_day)],
  copying: ["Copy estimate", byDesc((s) => s.copy_rank)],
};
function lbSpark(s, days, w = 76, h = 26) {
  const pts = (s.pnl_daily || []).slice(-(days + 1)).map((p) => p[1]); // n days: n + 1 end-of-day points
  if (pts.length < 2) return `<span class="lb-none">—</span>`;
  const base = pts[0], ys = pts.map((v) => v - base), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys), span = hi - lo || 1;
  const xy = ys.map((v, i) => [2 + (i / (ys.length - 1)) * (w - 4), h - 2 - ((v - lo) / span) * (h - 4)]);
  const [lx, ly] = xy[xy.length - 1], end = ys[ys.length - 1];
  return `<svg class="${end > 0 ? "gain" : end < 0 ? "loss" : ""}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Profit trend"><polyline points="${xy.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.2" fill="currentColor"/></svg>`;
}

function renderWorth() {
  const box = $("#tview"), r = worthLast;
  if (!box || !r || routeName() !== "traders:worth") return;
  const st = r.status, res = r.result;
  if (!res) {
    box.innerHTML = st.running
      ? emptyState("Checking traders", `Reading about 200 Polymarket traders' last 30 days of trades${st.total ? ` (${st.done} of ${st.total} done)` : ""}. The first check takes 20–30 minutes; after that the last result shows at once.`)
      : emptyState("No traders checked yet", st.error ? esc(st.error) : "", `<button class="btn" id="wrefresh">Check traders</button>`);
    const b = $("#wrefresh"); if (b) b.onclick = async () => { await api("/api/worth/refresh", { method: "POST" }); worthView(); };
    return;
  }
  const scores = res.scores;
  const paused = !scores.some(isCopyable); // nobody's copies are offered: "Copyable only" has nothing to show
  if (paused) lb.copyOnly = false;
  const history = scores.some((s) => Array.isArray(s.pnl_weeks));
  const periods = scores.some((s) => s.periods);
  if (!periods) lb.period = "30d";
  const sort = lb.sort && (lb.sort !== "consistent" || history) ? lb.sort : "recommended";
  const n = lb.period, days = PERIOD_DAYS[n];
  const picked = interests || [], names = interestNames(picked), q = lb.q.trim().toLowerCase();
  const recommended = scores.filter((s) => SEG_ORDER.includes(s.segment));

    .filter((s) => !q || (s.name || "").toLowerCase().includes(q) || s.wallet.startsWith(q))

    return `<a class="lb-cols lb-row" href="#/worth/${esc(s.wallet)}" ${i >= RANKED && !open ? "hidden" : ""}>

      <span class="lb-cons">${up == null || !known ? `<span class="lb-none">—</span>` : `<span class="lb-weeks" aria-hidden="true">${s.pnl_weeks.map((w) => `<i class="${w == null ? "none" : w > 0 ? "up" : w < 0 ? "down" : ""}"></i>`).join("")}</span><span class="lb-sub">${up} of ${known} weeks up</span>`}</span>
      <span class="lb-pnl">${profit == null ? `<span class="lb-none">—</span>` : `<span class="lb-main">${pl(profit, usd(profit, true))}</span><span class="lb-sub">${perDollar != null ? `${lbPct(perDollar)} per $ traded` : `${days} days`}</span>`}</span>
      <span class="lb-trend">${lbSpark(s, days)}</span>
      <span class="lb-won">${s.settled ? `<span class="lb-main">${s.won} of ${s.settled}</span><span class="lb-sub">${readDays(s) < 30 ? `settled · ${readDays(s)} days` : "settled"}</span>` : `<span class="lb-none">—</span>`}</span>
      <span class="lb-usual">${s.typical_usd != null ? `<span class="lb-main">${usd(s.typical_usd)}</span><span class="lb-sub">${perDayText(s.trades_per_day)}</span>` : `<span class="lb-none">—</span>`}</span>
      <span class="lb-copy">${copyMain}<span class="lb-sub">${copySub}</span></span>
      <span class="lb-meta">${[s.settled ? `${readPeriod(s).replace("l", "L")}: won ${s.won} of ${s.settled}` : "", s.typical_usd != null ? `usually ${usd(s.typical_usd)}` : "", perDayText(s.trades_per_day)].filter(Boolean).join(" · ")}</span>
      <span class="lb-copyline">${isCopyable(s) ? `Copyable.${copy != null ? ` ${copyEstimate(s)}` : ""}` : `<span class="lb-muted">${copyLabel(s)}.${copy != null ? ` ${copyEstimate(s)}` : ""}</span>`}</span>

  // Recommended traders come in sections by tier: Sharps, then Rising, each when it has anyone. Copying is each
  // row's copy status ("Copyable only" filters on it); while nobody can be copied, the "Copying is paused"
  // callout above the list says so. "See all checked traders" stays one marked list.
  const sections = lb.all ? null : SECTIONS.map(([key, title, sub]) => {
    const list = shown.filter((s) => s.section === key);

  let body;
