<style>
  @font-face { font-family: "Host Grotesk"; src: url(/static/fonts/HostGrotesk-latin-var.woff2) format("woff2");
    font-weight: 300 600; font-display: swap; }
  :root {
    --bg: #fafaf9; --card: #ffffff; --fg: #111112; --muted: #6c6c72; --faint: #a1a1a6; --line: #ececea;
    --soft: #f3f3f1; --green: #12a150; --green-soft: #e9f7ef; --danger: #c43d2f;
    --gain: #087f3d; --loss: #cf3426; --amber: #a86200; --teal: #0b7a83; --blue: #2557d6;
    --accent: #4b3fe0; --on-accent: #ffffff; /* Signals' own color: never used for gains, losses or statuses */
    --shadow: 0 1px 2px rgba(17, 17, 18, .04), 0 2px 8px rgba(17, 17, 18, .03);
    --av-l: 93%; --av-fg-l: 48%; --av-s: 42%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
      --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --gain: #3ccf7e; --loss: #ff7a6b; --amber: #f2b54a; --teal: #3cc6cf; --blue: #7aa2ff;
      --accent: #9d97ff; --on-accent: #0d0d0e;
      --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0e; --card: #161618; --fg: #f2f2f3; --muted: #9b9ba1; --faint: #636368; --line: #26262a;
    --soft: #1e1e21; --green: #3ccf7e; --green-soft: #12291c; --danger: #ff7a6b;
      --gain: #3ccf7e; --loss: #ff7a6b; --amber: #f2b54a; --teal: #3cc6cf; --blue: #7aa2ff;
      --accent: #9d97ff; --on-accent: #0d0d0e;
    --shadow: none; --av-l: 22%; --av-fg-l: 66%; --av-s: 30%;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 15px/1.45 "Host Grotesk", -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  body.noscroll { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.015em; margin: 0; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; } /* one width for the header, every tab and the footer */
  main.wrap.narrow { max-width: 680px; } /* a reading column: Top profit and a venue trader's page */
  .muted { color: var(--muted); }

  /* header */
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tabs a { padding: 7px 12px; border-radius: 999px; color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .tabs a:hover { color: var(--fg); }
  .tabs a.on { background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); }
  .account { margin-left: auto; display: flex; align-items: center; min-height: 32px; }
  .tabbar { display: none; }
  main.wrap { flex: 1 0 auto; width: 100%; padding-top: 28px; padding-bottom: 40px; } /* takes the slack: the footer stays at the bottom */
  footer.foot { width: 100%; color: var(--faint); font-size: 12.5px; padding-top: 8px; padding-bottom: 36px; text-align: center; }
  footer.foot a { color: var(--muted); }

  /* bits */
  .av { --h: 200; flex: none; display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden;
    background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) 45% var(--av-fg-l)); }
  .av svg { width: 62%; height: 62%; display: block; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tier { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.35; }
  .tier.t1 { background: var(--fg); color: var(--bg); }
  .tier.t2 { border: 1px solid var(--line); color: var(--fg); padding: 1px 7px; }
  .tier.t3 { background: var(--soft); color: var(--muted); }
  .tier.s-proven { --c: var(--gain); } .tier.s-quiet { --c: var(--teal); } .tier.s-rising { --c: var(--blue); }
  .tier[class*="s-"] { background: color-mix(in srgb, var(--c) 11%, var(--card)); color: color-mix(in srgb, var(--c) 80%, var(--fg)); }
  button.tier { border: 0; font: inherit; font-size: 12px; font-weight: 500; line-height: 1.35; cursor: pointer; }
  button.tier:hover { background: color-mix(in srgb, var(--c) 20%, var(--card)); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .badge svg { width: 13px; height: 13px; }
  .chip { display: inline-block; font-size: 13px; font-weight: 500; padding: 3px 10px; border-radius: 8px; background: var(--soft); color: var(--fg); }
  .btn { border: 0; border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--accent); color: var(--on-accent); white-space: nowrap; transition: transform .08s ease, opacity .15s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.wide { width: 100%; padding: 13px 16px; font-size: 15px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .link { color: var(--fg); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; }
  .link:hover { text-decoration-color: currentColor; }
  .sep { color: var(--faint); margin: 0 6px; }
  .gain { color: var(--gain); } .loss { color: var(--loss); }

  /* status */
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .status.in { color: var(--gain); } .status.in i { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .status.moved { color: var(--amber); } .status.moved i { background: var(--amber); }
  .status.won { color: var(--gain); } .status.won i { background: var(--gain); }
  .status.lost { color: var(--loss); } .status.lost i { background: var(--loss); }
  .status.done { color: var(--fg); } .status.done i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }

  /* feed controls */
  .follow { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  .stack { display: flex; }
  .stack .av { box-shadow: 0 0 0 2px var(--bg); }
  .stack .av + .av { margin-left: -8px; }
  .follow b { font-weight: 500; font-size: 14px; white-space: nowrap; }
  .follow .chev { color: var(--faint); }
  .feedtop { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 16px; }
  .updated { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .fresh { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--faint); font-size: 13px; white-space: nowrap; }
  .lag { position: relative; }
  .lag-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: help; }
  .lag-btn svg { width: 14px; height: 14px; }
  .lag-btn:hover, .lag.open .lag-btn { color: var(--muted); }
  .lag-tip { display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 260px; max-width: calc(100vw - 32px); padding: 10px 12px; border-radius: 12px;
    background: var(--card); color: var(--muted); box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(17, 17, 18, .08); font-size: 13px; line-height: 1.45; white-space: normal; }
  .lag:hover .lag-tip, .lag-btn:focus-visible + .lag-tip, .lag.open .lag-tip { display: block; }
  .paused { display: flex; gap: 10px; align-items: flex-start; background: var(--soft); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-size: 13.5px; color: var(--muted); }
  .paused svg { flex: none; width: 16px; height: 16px; margin-top: 2px; color: var(--fg); }
  .paused p { margin: 0; }
  .paused b { color: var(--fg); font-weight: 500; }
  .filters { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .mkts { font-size: 14px; color: var(--muted); min-width: 0; }
  .mkts b { color: var(--fg); font-weight: 500; }
  .switch { position: relative; max-width: 100%; display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 36px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* cards */
  .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; } /* a long name truncates, never widens the cards */
  #flist .cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  #flist .card { display: flex; flex-direction: column; }
  #flist .card > :has(+ .trade-foot) { margin-bottom: 12px; }
  #flist .trade-foot { margin-top: auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); }
  .trade { cursor: pointer; transition: border-color .15s, transform .15s; }
  .trade:hover { border-color: color-mix(in srgb, var(--fg) 18%, var(--line)); }
  .trade-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .trade-top .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; font-size: 14px; }
  .when { color: var(--faint); font-size: 13px; white-space: nowrap; margin-left: auto; }
  .trade-title { font-size: 19px; line-height: 1.25; margin: 14px 0 8px; overflow-wrap: anywhere; }
  .trade-nums { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; font-size: 15px; color: var(--muted); flex-wrap: wrap; }
  .trade-nums b { color: var(--fg); font-weight: 600; }
  .trade-nums .amt { color: var(--fg); font-weight: 500; white-space: nowrap; }
  .also { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
  .venue { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .venue .ext { white-space: nowrap; }
  .usbox ul { margin: 0 0 14px; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .usbox li + li { margin-top: 4px; }
  .trade-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); min-height: 50px; }
  .trade.compact .trade-title { font-size: 17px; margin-top: 0; }
  .trade-tags { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .trade-tags .ext { margin-left: auto; white-space: nowrap; }

  /* lists */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .trow { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); cursor: pointer; }
  .trow:first-child { border-top: 0; }
  .trow:hover { background: var(--soft); }
  .trow.norank { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .rank { color: var(--faint); font-size: 14px; text-align: center; }
  .tmain { min-width: 0; display: grid; gap: 4px; }
  .tmain .line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .tmain .sub { color: var(--muted); font-size: 13px; }
  .tnum { text-align: right; white-space: nowrap; }
  .tnum b { display: block; font-size: 16px; font-weight: 600; }
  .tnum small { color: var(--muted); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .t { font-weight: 500; overflow-wrap: anywhere; }
  .row .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row .r { text-align: right; white-space: nowrap; font-size: 14px; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 13px; color: var(--muted); font-weight: 500; cursor: pointer; }
  .more:hover { color: var(--fg); }

  /* page bits */
  .seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; margin-bottom: 16px; max-width: 100%; }
  .seg a { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg a.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lede { color: var(--muted); margin: 0 0 16px; font-size: 14.5px; }
  .h2 { font-size: 17px; margin: 32px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .foot-note { color: var(--faint); font-size: 13px; margin: 14px 2px 0; }
  .foot-note a, .foot-note button { color: var(--muted); }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .opts button { border: 0; background: none; box-shadow: inset 0 0 0 1px var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .opts button.on { color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
  .opts button:disabled { opacity: .4; cursor: default; }
  .opts .gap { width: 10px; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 18px; }
  .back:hover { color: var(--fg); }
  .th { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .th h1 { font-size: 26px; line-height: 1.15; }
  .th .badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .reason { font-size: 16px; margin: 18px 0 0; line-height: 1.5; }
  .hero { margin: 24px 0 6px; }
  .hero .big { font-size: 44px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .hero .cap { color: var(--muted); margin-top: 8px; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tile > span { display: block; color: var(--muted); font-size: 12.5px; }
  .tile b { display: block; font-size: 17px; font-weight: 600; margin-top: 3px; }
  .tile small { color: var(--muted); font-size: 12.5px; }
  .copybox { margin-top: 20px; }
  .copybox p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .copybox .head { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .amount { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; }
  .amount .box { display: flex; align-items: center; gap: 2px; padding: 0 12px; height: 42px; border-radius: 12px;
    box-shadow: inset 0 0 0 1px var(--line); background: var(--card); flex: 1 1 0; min-width: 64px; max-width: 200px; }
  .amount .box:focus-within { box-shadow: inset 0 0 0 1.5px var(--fg); }
  .amount input { border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 17px;
    font-weight: 600; width: 100%; font-variant-numeric: tabular-nums; }
  .amount button { height: 36px; padding: 0 12px; flex: none; border-radius: 999px; border: 0; background: var(--soft); color: var(--fg);
    font: inherit; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; }
  .amount button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .receipt { border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
  .receipt div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 15px; }
  .receipt div + div { border-top: 1px solid var(--line); }
  .receipt span { color: var(--muted); }
  .receipt .total span, .receipt .total b { color: var(--fg); font-weight: 600; }
  .copybox .qnote { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .copybox .qwarn { font-size: 14px; color: var(--fg); background: color-mix(in srgb, var(--fg) 5%, transparent); border-radius: 10px; padding: 10px 12px; }
  details.qmore { margin: 0 0 16px; border-top: 1px solid var(--line); }
  details.qmore > summary { list-style: none; cursor: pointer; padding: 12px 0 0; font-size: 14px; font-weight: 500; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  details.qmore > summary::-webkit-details-marker { display: none; }
  details.qmore > summary::after { content: "+"; font-size: 18px; line-height: 1; color: var(--faint); }
  details.qmore[open] > summary::after { content: "−"; }
  details.qmore[open] > summary { padding-bottom: 10px; }
  details.qmore p { font-size: 13px; margin: 0 0 8px; }
  .qfacts { margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .qfacts div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
  .qfacts dt { color: var(--muted); }
  .qfacts dd { margin: 0; color: var(--fg); text-align: right; }
  details.fold { margin-top: 32px; border-top: 1px solid var(--line); }
  details.fold > summary { list-style: none; cursor: pointer; padding: 16px 0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "Show"; color: var(--muted); font-weight: 500; font-size: 14px; }
  details.fold[open] > summary::after { content: "Hide"; }
  .fold h3 { font-size: 15px; margin: 22px 0 8px; }
  .fold p.note { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl .n { text-align: right; white-space: nowrap; }
  .tbl td .s { color: var(--muted); font-size: 13px; }
  .scroll { overflow-x: auto; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ext { color: var(--muted); font-size: 14px; font-weight: 500; }
  .ext:hover { color: var(--fg); }
  .s .ext, .sub .ext { font-size: inherit; }

  /* interests: onboarding and the picker */
  .onb { max-width: 460px; margin: 6vh auto 0; text-align: center; }
  .onb h1 { font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; }
  .onb .lede { margin: 10px auto 0; font-size: 15.5px; max-width: 380px; }
  .pick h2 { font-size: 17px; margin: 0 0 14px; }
  .onb .pick { margin-top: 40px; }
  .picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .onb .picks { justify-content: center; }
  .picks button { border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 15px;
    font-weight: 500; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  .picks button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
  .pick .alt { display: block; margin: 14px auto 0; color: var(--muted); font-weight: 500; text-decoration: none; }
  .pick .alt:hover { color: var(--fg); }

  /* Traders: a leaderboard. One bar: filters on the left, how you view the list on the right */
  .lb-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
  .lb-filters { display: flex; align-items: center; gap: 6px; flex: none; padding-block: 2px; scrollbar-width: none; }
  .lb-filters::-webkit-scrollbar { display: none; }
  .lb-view { display: flex; align-items: center; gap: 10px; flex: none; }
  .lb-divider { width: 1px; height: 20px; background: var(--line); flex: none; margin-inline: 4px; }
  .lb-chip { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 13px; font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; cursor: pointer; }
  .lb-chip[aria-disabled="true"] { color: var(--faint); cursor: not-allowed; }
  .lb-chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .lb-search { position: relative; display: flex; align-items: center; }
  .lb-search svg { position: absolute; left: 11px; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
  .lb-search input { box-sizing: border-box; width: 230px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 12px 5px 32px; font: inherit; font-size: 14px; }
  .lb-search input::placeholder { color: var(--faint); }
  .lb-period { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
  .lb-period button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .lb-period button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lb-sort { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 14px; font-weight: 500; }
  .lb-note { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; }
  .tr-tabs { display: flex; gap: 4px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
  .tr-tabs a { padding: 8px 4px 10px; margin-right: 18px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tr-tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
  /* Explore: search first, then the groups beside Filters and Sort, then rows of a few named figures */
  .ex-search { position: relative; display: flex; align-items: center; margin: 0 0 14px; }
  .ex-search svg { position: absolute; left: 16px; width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
  .ex-search input { box-sizing: border-box; width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 14px; padding: 12px 16px 12px 44px; font: inherit; font-size: 16px; box-shadow: var(--shadow); }
  .ex-search input::placeholder { color: var(--faint); }
  .ex-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .ex-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 10px; }
  .ex-groups { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .ex-groups::-webkit-scrollbar { display: none; }
  .ex-groups button { flex: none; border: 0; background: none; padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .ex-groups button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ex-groups .n, .ex-title .n { color: var(--faint); font-weight: 500; }
  .ex-tools { display: flex; align-items: center; gap: 8px; }
  .ex-tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .ex-tool svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
  .ex-tool .n { background: var(--accent); color: var(--on-accent); border-radius: 999px; font-size: 11.5px; min-width: 18px; padding: 1px 5px; text-align: center; box-sizing: border-box; }
  .ex-sort select { border: 0; background: none; color: inherit; font: inherit; padding: 0; cursor: pointer; }
  .ex-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
  .ex-chips .link { font-size: 13px; margin-left: 4px; }
  .ex-chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: color-mix(in srgb, var(--accent) 10%, var(--card)); color: color-mix(in srgb, var(--accent) 85%, var(--fg)); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; font-weight: 500; }
  button.ex-chip { cursor: pointer; } .ex-chip span { opacity: .7; font-size: 15px; line-height: 1; }
  .ex-about { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .ex-about .link { font-size: 13px; }
  .ex-results { margin: 0; font-size: 14px; color: var(--muted); } .ex-results .link { font-size: 14px; }
  .ex-title { margin: 0; justify-content: flex-start; gap: 8px; }

  .ex-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 384px 156px; grid-template-areas: "av who stats badges"; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--line); color: inherit; }
  .ex-row:first-child { border-top: 0; }
  .ex-row:hover { background: var(--soft); }
  .ex-row > .av { grid-area: av; }
  .ex-who { grid-area: who; display: grid; gap: 3px; min-width: 0; }
  .ex-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-badges { grid-area: badges; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .ex-badges .tier { white-space: normal; text-align: right; border-radius: 10px; } /* a long label wraps in its column */
  .ex-stats { grid-area: stats; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ex-stat { display: grid; gap: 2px; min-width: 0; }
  .ex-stat .k { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex-stat .v { font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .ex-stat .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .ex-stat .v.u { color: var(--faint); font-weight: 500; }
  .ex-all { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding: 14px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: inherit; }
  .ex-all:hover { background: var(--soft); }
  .ex-all > span:first-child { display: grid; gap: 2px; } .ex-all .muted { font-size: 13px; } .ex-all .n { color: var(--faint); font-weight: 500; margin-left: 4px; }
  #sheet .ex-fset h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 18px 0 8px; }
  .ex-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .ex-opts button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
  .ex-opts button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .ex-factions { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  @media (max-width: 1040px) {
    .ex-row { grid-template-columns: 40px minmax(0, 1fr) 330px 150px; } /* fixed, so every row's figures line up */
  }
  .lb-board { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .lb-cols { display: grid; grid-template-columns: 28px minmax(0, 1fr) 180px 120px 96px 104px 116px 136px; gap: 12px; align-items: center; padding: 14px 18px; }
  .lb-groups { padding-block: 10px 0; background: var(--soft); font-size: 12px; color: var(--muted); font-weight: 500; }
  .lb-groups span { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .lb-head { padding-block: 8px 10px; background: var(--soft); font-size: 12px; color: var(--muted); }
  .lb-head button { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; color: inherit; text-align: left; cursor: pointer; }
  .lb-head button[aria-pressed="true"] { color: var(--fg); font-weight: 600; }
  .lb-row { border-top: 1px solid var(--line); color: inherit; }
  .lb-row:hover { background: var(--soft); }
  .lb-rank { color: var(--faint); font-size: 14px; }
  .lb-who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .lb-who .nm { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-sub { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .lb-main { display: block; font-weight: 600; }
  .lb-none { color: var(--faint); }
  .lb-weeks { display: flex; gap: 2px; margin-bottom: 4px; }
  .lb-weeks i { width: 7px; height: 12px; border-radius: 2px; background: var(--line); }
  .lb-weeks i.up { background: var(--gain); }
  .lb-weeks i.down { background: color-mix(in srgb, var(--loss) 45%, var(--line)); }
  .lb-weeks i.none { background: none; box-shadow: inset 0 0 0 1px var(--line); }
  .lb-trend { display: flex; align-items: center; color: var(--fg); }
  .lb-muted { color: var(--faint); }
  .lb-meta, .lb-copyline { display: none; }
  .lb-more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; padding: 12px; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .lb-sec { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding: 18px 18px 10px; border-top: 1px solid var(--line); }
  .lb-sec h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .lb-sec p { margin: 0; font-size: 13px; color: var(--muted); min-width: 0; }
  .lb-head + .lb-section .lb-sec { border-top: 0; }
  .lb-sec + .lb-row { border-top: 0; }
  .lb-secnone { margin: 0; padding: 0 18px 18px; font-size: 14px; color: var(--muted); }
  .lb-foot { margin-top: 12px; font-size: 13px; color: var(--faint); line-height: 1.7; }
  .lb-foot .link { font-size: 13px; }
  /* A trader's profile: header, then two columns: Their numbers | profit chart, why they're here, Positions / Activity */
  .pf-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .pf-head .grow { flex: 1; min-width: 0; }
  .pf-head h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
  .pf-tag { color: var(--muted); margin-top: 2px; font-size: 15px; }
  .pf-tag .ext { font-size: inherit; }
  .pf-cta { display: grid; gap: 6px; justify-items: end; text-align: right; }
  .pf-cta small { color: var(--muted); font-size: 13px; max-width: 280px; }
  .pf-cta .btn[disabled] { background: var(--soft); color: var(--faint); cursor: default; }
  .pf-follow { display: contents; }
  /* Their numbers: a summary (realized and open P&L, wallet, win rate) beside the chart, the rest of the figures under
     it beside why they're here and their trades. On a phone: summary, chart, the rest of the figures, then the rest. */
  .pf-grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); grid-template-areas: "sum chart" "det rest"; gap: 16px 20px; align-items: start; margin-top: 22px; }
  .pf-grid > * { min-width: 0; }
  .pf-grid > .pf-card { margin-top: 0; }
  .pf-sum { grid-area: sum; } .pf-grid > .pf-chart { grid-area: chart; } .pf-det { grid-area: det; } .pf-rest { grid-area: rest; }
  .pf-rest > .pf-card:first-child, .pf-det h3:first-child { margin-top: 0; }
  .pf-hero { padding: 6px 0 4px; }
  .pf-hero > span { display: block; font-size: 13px; color: var(--muted); }
  .pf-hero b { display: block; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-top: 2px; }
  .pf-hero small { font-size: 13px; color: var(--muted); }
  .pf-det h3, .fold h3.pf-more { font-size: 13px; font-weight: 600; margin: 20px 0 0; }
  .pf-rows { margin: 0; font-size: 14px; }
  .pf-rows div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .pf-rows div:last-child { border-bottom: 0; }
  .pf-rows dt { color: var(--muted); min-width: 0; flex: 1 1 auto; }
  .pf-rows dt small { display: block; font-size: 12px; color: var(--faint); margin-top: 1px; }
  .pf-rows dd { margin: 0; font-weight: 600; text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .pf-rows dd .lb-weeks { margin: 0; }
  .pf-statnote { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }
  .pf-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 16px; }
  .pf-card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .pf-card h2 { font-size: 16px; margin: 0; }
  .pf-card h2 small { font-size: 13px; font-weight: 400; margin-left: 6px; }
  .pf-sub { font-size: 14px; margin: 18px 0 0; }
  .pf-facts.pf-pos { grid-template-columns: minmax(0, 1fr) auto; }
  .pf-facts.pf-pos dd { text-align: right; }
  .pf-chart svg { width: 100%; height: auto; display: block; }
  .pf-chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .pf-legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .pf-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; background: var(--line); }
  /* Why they're here: the verdict, their copy status, a warning, then the facts */
  .pf-verdict { margin: 10px 0 0; font-size: 15px; }
  .pf-copying { margin: 10px 0 0; color: var(--muted); font-size: 14px; border-radius: 10px; transition: background .3s, box-shadow .3s; }
  .pf-copying b { color: var(--fg); font-weight: 600; }
  .pf-copying.hl { background: var(--soft); box-shadow: 0 0 0 8px var(--soft); }
  .pf-warn { display: flex; gap: 10px; align-items: flex-start; background: var(--soft); border-radius: 12px; padding: 10px 14px; margin-top: 14px; font-size: 14px; }
  .pf-warn svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
  .pf-warn p { margin: 0; }
  .pf-facts { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 16px; margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .pf-facts dt { color: var(--muted); }
  .pf-facts dd { margin: 0; }
  .pf-name { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .pf-copy { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .pf-copy .status { font-size: 13px; }
  .pf-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 26px; }
  .pf-tabs button { border: 0; background: none; padding: 10px 14px; font: inherit; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
  .pf-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .pf-sec { font-size: 13px; color: var(--muted); margin: 18px 0 2px; }
  .pf-li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
  .pf-li .t { font-weight: 500; overflow-wrap: anywhere; }
  .pf-li .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .pf-li .r { text-align: right; }
  .pf-oc { display: inline-block; font-size: 12px; background: var(--soft); border-radius: 6px; padding: 1px 7px; margin-right: 6px; color: var(--fg); }
  .pf-empty { color: var(--muted); padding: 18px 2px; }
  @media (max-width: 920px) { .pf-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "sum" "chart" "det" "rest"; } }
  @media (max-width: 760px) {
    .pf-facts { grid-template-columns: 100px minmax(0, 1fr); gap: 8px 12px; }
    .pf-cta { justify-items: start; text-align: left; width: 100%; }
    .pf-head h1 { font-size: 24px; }
    .pf-hero b { font-size: 30px; }
  }

  @media (max-width: 1180px) {
    .lb-cols { grid-template-columns: 28px minmax(0, 1fr) 160px 108px 88px 96px 104px 128px; }
  }
  @media (max-width: 1040px) {
    .lb-toolbar { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 10px; }
    .lb-filters { flex: 1 1 auto; min-width: 0; overflow-x: auto; }
    .lb-view { flex: 1 1 auto; min-width: 0; justify-content: space-between; flex-wrap: wrap; }
    .lb-search { flex: 1 1 100%; min-width: 0; } .lb-search input { width: 100%; }
    .lb-groups, .lb-head { display: none; }
    .lb-cols { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "who trend pnl" "cons cons cons" "meta meta meta" "copy copy copy"; gap: 6px 12px; padding: 16px; }
    .lb-rank, .lb-won, .lb-usual, .lb-copy { display: none; }
    .lb-who { grid-area: who; } .lb-pnl { grid-area: pnl; text-align: right; } .lb-trend { grid-area: trend; }
    .lb-cons { grid-area: cons; display: flex; align-items: center; gap: 8px; margin-top: 4px; } .lb-cons .lb-weeks { margin: 0; }
    .lb-meta { grid-area: meta; display: block; font-size: 14px; color: var(--muted); }
    .lb-copyline { grid-area: copy; display: block; font-size: 14px; }
    .lb-sub { white-space: normal; }
    .lb-nohist .lb-cons, .lb-nohist .lb-trend { display: none; } /* no profit history yet: nothing to show on a card */
  }

  /* states */
  .state { text-align: center; padding: 44px 24px; color: var(--muted); }
  .state b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 6px; }
  .state p { margin: 0 auto 16px; max-width: 380px; }
  .state.err b { color: var(--danger); }
  .inline-err { color: var(--danger); font-size: 13.5px; margin: 10px 0; }
  .skel { background: linear-gradient(90deg, var(--soft) 25%, color-mix(in srgb, var(--soft) 40%, var(--card)) 50%, var(--soft) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius: 8px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

  /* sheet + toast */
  #sheet { position: fixed; inset: 0; z-index: 50; display: none; }
  #sheet.on { display: block; }
  #sheet .scrim { position: absolute; inset: 0; background: rgba(10, 10, 12, .38); animation: fade .18s ease; }
  #sheet .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px));
    max-height: calc(100% - 48px); overflow-y: auto; background: var(--card); border-radius: 22px; padding: 24px 22px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .18); animation: pop .2s ease; }
  #sheet .x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
  #sheet h2 { font-size: 21px; line-height: 1.25; padding-right: 36px; }
  #sheet ol, #sheet ul { padding-left: 20px; margin: 10px 0; } #sheet li { margin: 8px 0; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; margin: 18px 0; }
  .kv div { background: var(--card); padding: 11px 14px; }
  .kv > div > span { display: block; color: var(--muted); font-size: 12.5px; }
  .kv b { font-weight: 600; font-size: 16px; }
  .explain { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  /* How we pick traders: two tabs, The checks and The tiers */

<script>
const $ = (s, el = document) => el.querySelector(s);

let venuesOn = ["polymarket"];

const SIGNED = /^\/api\/(me|live|trading-now|bet)(\/|\?|$)/;

// ---- signing in (Clerk: Google or Telegram): for the Feed, and to follow traders ----
// Traders, Top profit and trader pages need no account; the Feed (Following, Recommended, Big trades, an alert's

    accountIs(signedIn() ? window.Clerk.user?.id || null : null);
    await readMe();
    if (auth.me) syncInterests();

    if (auth.me && auth.then) { const f = auth.then; auth.then = null; await f(); }

// Where the Feed stands for this visit: "open" (signed in, or nothing to sign in to), "loading", "failed" or "closed".
const gateState = () => !auth.wanted ? "open" : auth.loading ? "loading" : auth.failed ? "failed" : auth.on && signedIn() ? "open" : "closed";

function feedGate() {

}
// The Feed's sign-in page: what the Feed is, Sign in (Clerk's), and the way to what needs no account.
function signInPage() {

  $("#app").innerHTML = st === "loading" ? skelCards(3)

    : emptyState("Sign in to see the Feed", "The trades of the traders you follow and of the traders we recommend, a few minutes after they're made. Traders and their pages need no account.",
      `<button class="btn" id="gatesignin">Sign in</button> ${traders}`);

document.addEventListener("click", (e) => {

// The Follow control on a trader's page (#follow, data-wallet): Follow, or Following ✓ with Telegram alerts.

  const alerts = !auth.alerts ? `<small>Alerts aren't switched on yet.</small>`

async function connectTelegram(btn) {
  const win = window.open("", "_blank");
  let link;
  try { ({ link } = await post("/api/me/telegram", {})); } catch (e) { win?.close(); toast(esc(e.message)); return; }

// ---- numbers ----
// Prices in whole cents; tenths only under 1¢ (or between 99¢ and 100¢), or when two prices would look equal.
const tenths = (p) => `${Math.round(p * 1000) / 10}¢`;
function cents(p) {
  if (p == null) return "—";
  const c = p * 100;
  return c < 1 || (c > 99 && c < 100) ? tenths(p) : `${Math.round(c)}¢`;
}
function centsPair(a, b) {
  if (a == null || b == null) return [cents(a), cents(b)];

  return lookSame ? [tenths(a), tenths(b)] : [cents(a), cents(b)];

// Green for a gain, red for a loss: `text` is x already formatted with its sign.
const pl = (x, text) => x > 0 ? `<span class="gain">${text}</span>` : x < 0 ? `<span class="loss">${text}</span>` : text;
const centsSigned = (x) => x == null ? "—" : `${x > 0 ? "+" : x < 0 ? "−" : ""}${Math.abs(Math.round(x * 1000) / 10)}¢`;

  if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;

// One "Copying is paused" callout for the Feed and Traders, shown while no trader's copies are offered.
const PAUSED_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>`;

const NOT_A_TIP = "Use their trades to learn what they're doing, not as a signal to buy: we haven't found that buying after them makes money.";

// Next to "Updated" on the Feed: the delay in a few words, the full sentence behind the ⓘ (tap or hover).

  traders: ["Typically read every 30–60 s", "Signals typically reads each of these traders' trades on Polymarket every 30 seconds (Recommended traders about once a minute); it can take longer when Polymarket is busy. “Updated” is when the oldest of them was last read; each trade's time is when it was made."],

// ---- who: names, aliases, avatars, tiers ----
// No wallet addresses on screen: a trader without a real name gets "Trader 0x91…76" and an identicon.
const ADDR = /^0x[0-9a-f]{6,}/i;
const SHORT_ADDR = /^0x[0-9a-f]{2,}\s*(…|\.{2,3})\s*[0-9a-f]{2,}$/i; // Polymarket names some wallets "0xd654…23e3"

function hash32(s) { // FNV-1a, then a murmur3 finish so every bit is well mixed

  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) {

// The tier: skill and track record only (uselayer 0.10). Whether copying pays is the copy status (copyLabel), apart.
const TIER = {

  edge_losing: ["Edge, but lost money lately", "t3"], parlays: ["Parlays: skill unmeasured", "t3"],

// A trader's page: the scored page for a Polymarket wallet, else the venue leaderboard page.
const traderHref = (venue, id) => venue === "polymarket" ? `#/worth/${esc(id)}` : `#/t/${venue}/${encodeURIComponent(id)}`;
// `tap`: the pill opens what the tier means. Only where it isn't inside a link (a Feed card, not a list row).
const tier = (seg, tap) => !TIER[seg] ? "" : tap && SEG_ORDER.includes(seg)

// ---- trade status: one line with a dot ----
const STATUS = {
  in: ["You can still get in", "in"], moved: ["Price moved away", "moved"],
  won: ["Won", "won"], lost: ["Lost", "lost"], closed: ["Closed", "done"],
};
const statusLine = (st) => STATUS[st] ? `<span class="status ${STATUS[st][1]}"><i></i>${STATUS[st][0]}</span>` : `<span class="status"><i></i>Price unknown</span>`;
// For a trader copying isn't offered for, an open trade says only where the price is: no colour, nothing that
// reads as a cue to buy. Settled trades say how they ended, as for anyone.
const OPEN = new Set(["in", "moved"]);
const neutralStatus = (paid, now) => {
  if (now == null || paid == null) return `<span class="status"><i></i>Price unknown</span>`;
  const [p, n] = centsPair(paid, now);
  return `<span class="status"><i></i>Now ${n} · they paid ${p}</span>`;
};
const tradeStatus = (b, offered) => offered || !OPEN.has(b.status) ? statusLine(b.status) : neutralStatus(b.price, b.price_now);
const SETTLED = new Set(["won", "lost", "closed"]);
const GET_IN = 0.03; // at most 3¢ above (GET_IN in app.py), and at most 5¢ below (FELL_BY)
function statusExplain(b) {
  const d = b.price_now != null && b.price != null ? b.price_now - b.price : null;
  const gap = (x) => Math.abs(x) < 0.01 ? "less than 1¢" : `${Math.round(Math.abs(x) * 100)}¢`; // rounded like the prices shown
  switch (b.status) {
    case "in": return d > 0.0005 ? `The price is ${gap(d)} above what they paid. Up to 3¢ above still counts, so you can still get in.`
      : d < -0.0005 ? `The price is ${gap(d)} below what they paid, so you can still get in.` : "The price is about what they paid, so you can still get in.";
    case "moved": return d < 0 ? `The price is ${gap(d)} below what they paid: the market has turned against them since. Buying now would be a different trade from theirs.`
      : `The price is ${gap(d)} above what they paid, more than 3¢. Most of their edge is already in the price.`;
    case "won": return "The price is 98¢ or more: the market has settled their way, or as good as.";
    case "lost": return "The price is 2¢ or less: the market has settled against them, or as good as. Not a bargain.";
    case "closed": return "They no longer hold it: they sold, or the market settled and paid out.";
    default: return "";
  }
}

// Every trader Signals follows trades on Polymarket International (its trades are public); Signals sees no trades on
// Polymarket US. A trade's ``us`` (the engine's us_match) is the market's verified twin there, matched by Layer through

// "What buying now costs": what buying the outcome on the card would cost you now, whoever the trader, priced
// from Polymarket's order book by the engine (market status and price read there, not taken from the card). An
// estimate, never a promised fill. Signals places no orders: the button opens the market on Polymarket.
const oneTrade = (b) => ({ wallet: b.wallet, name: b.name, market: b.market, price: b.price, title: b.title, outcome: b.outcome, url: b.url, at: b.at, size: b.size, usd: b.usd, token: b.token });
// The two ways it can end, in the outcome's own words: "If it ends No" / "If it ends Yes", or "If Jets wins" / "If not".
const yesNo = (o) => /^(yes|no)$/i.test(o || "");
const ifWins = (o) => !o ? "If it wins" : yesNo(o) ? `If it ends ${esc(o)}` : `If ${esc(o)} wins`;
const ifLoses = (o) => yesNo(o) ? `If it ends ${/^yes$/i.test(o) ? "No" : "Yes"}` : "If not";
const PICKS = [10, 50, 100];
const c1 = (x) => `${Math.round(x * 1000) / 10}¢`; // a price to a tenth of a cent: "34.2¢"
// "Your $50 fills at 34.2¢ on average. With the fee, 35.3¢ a contract." Their price is context, said apart.
const fillExplain = (p, spend) =>
  `Your ${money(spend)} fills at ${c1(p.price)}${p.worst_price > p.price + 0.0005 ? " on average" : ""}. With the fee, ${c1(p.total / p.contracts)} a contract.`;
// When the amount can't be priced (p.ok false). Only when it's MORE than the book holds within the limit is it
// "Only $340 is for sale…", with "Use $340 instead" from $1; a closed market, an amount too small for Polymarket's
// smallest order, or anything else gets the SDK's own reason.
function notPriced(p, spend) {
  const short = !!p.depth_checked && p.max_spend != null && spend > p.max_spend + 0.01;
  if (!short) return { line: sdkText(p.reason), room: 0 };
  const room = Math.floor(p.max_spend * 100) / 100;
  return room > 0 ? { line: `Only ${money(room).replace(/\.00$/, "")} is for sale within 3¢ of the cheapest price, fee included: not enough for this amount.`, room }
    : { line: "Nothing is for sale near the price right now.", room: 0 };
}
// Slippage, named: your average fill against the best price for sale now (best_price, from the engine). Shown
// up front only when there is some: it changes what you pay. None is a row in the fold.
const slipOf = (p) => p.best_price == null || p.price == null ? null : p.price - p.best_price;
function slippageLine(p) {
  const slip = slipOf(p);
  return slip != null && slip > 0.0005
    ? `<p class="qwarn">Estimated slippage: your average fill, ${c1(p.price)}, is ${c1(slip)} above the best price for sale, ${c1(p.best_price)}, because this amount buys into pricier offers.</p>` : "";
}
const readAt = (p) => { const at = p.priced_at ? new Date(p.priced_at) : null; return at && !isNaN(at) ? at.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }) : null; };
// Data freshness: when the engine read the book and the market's status; their trade's time is Polymarket's own.
const TRADE_TIME = "Their trade's time is when it was made on Polymarket, not when Signals saw it.";
function freshLine(p) {
  const when = readAt(p) ? `Order book and market status read at ${readAt(p)}. ` : "";
  return `<p class="fine">${when}${TRADE_TIME}</p>`;
}
// The one line always shown under a quote: whose book it is, how fresh, and that it's no promise.
const quoteNote = (p) => `<p class="qnote">${INTL} estimate${readAt(p) ? ` · read ${readAt(p)}` : ""} · not a guaranteed fill</p>`;
// Everything behind the numbers, folded: the facts as rows, then the rules in a sentence each.
function quoteFold(p) {
  const slip = slipOf(p), row = (k, v) => v ? `<div><dt>${k}</dt><dd>${v}</dd></div>` : "";
  return `<details class="qmore"><summary>How this estimate works</summary>
    <dl class="qfacts">
      ${row("Best price for sale", p.best_price != null ? c1(p.best_price) : null)}
      ${row("Your average fill", p.price != null ? `${c1(p.price)}${slip != null ? slip > 0.0005 ? ` (+${c1(slip)} slippage)` : " (no slippage)" : ""}` : null)}
      ${row("Per contract, with the fee", p.contracts ? c1(p.total / p.contracts) : null)}
      ${row("Price limit", p.limit != null ? `${c1(p.limit)} at most` : null)}
      ${row("For sale up to the limit", p.depth_checked && p.max_spend != null ? `${money(p.max_spend)}, fee included` : null)}
      ${row("Order book read", readAt(p))}
    </dl>
    ${p.best_price != null && p.limit != null ? `<p>Priced up to 3¢ above the cheapest price for sale: offers above ${c1(p.limit)} aren't counted.</p>` : ""}
    <p>Each contract pays $1 if it wins and nothing if it loses.</p>
    <p>An estimate, not a guaranteed fill: the order book can change before your order reaches ${INTL}, so it may fill higher, only in part, or not at all.</p>
    <p>This estimate is for ${INTL} only. Polymarket US has its own order book and fees, so it doesn't apply there.</p>
    <p>${TRADE_TIME}</p>
  </details>`;
}
// Money you put in or get back, to the cent: "$49.91", "+$42.09".
const money = (x, signed = false) => x == null ? "—" : `${x < 0 ? "−" : signed && x > 0 ? "+" : ""}$${Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
async function costBox(box, b, amount = 10) {
  box.innerHTML = `<div class="head">What buying now costs</div>
    <p>How much would you put in, fee included?${b.price != null ? ` They paid ${cents(b.price)}${b.at ? ` ${ago(b.at)}` : ""}, for context.` : ""}</p>
    <div class="amount"><label class="box"><span class="muted">$</span><input id="amt" inputmode="decimal" autocomplete="off" aria-label="Amount in dollars" value="${amount}"></label>
      ${PICKS.map((v) => `<button type="button" data-amt="${v}" aria-pressed="${v === amount}">$${v}</button>`).join("")}</div>
    <div id="pv"><div class="skel" style="width:70%;height:14px"></div></div>
    ${buyButtons(b)}`;
  const input = $("#amt", box), pv = $("#pv", box);
  let seq = 0, timer = null;
  const spendNow = () => { const v = parseFloat(String(input.value).replace(/[$,\s]/g, "")); return Number.isFinite(v) ? Math.round(v * 100) / 100 : null; };
  const show = async () => {
    const spend = spendNow(), my = ++seq;
    $$("[data-amt]", box).forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.amt === spend)));
    if (!spend || spend <= 0) { pv.innerHTML = `<p>Enter an amount above $0.</p>`; return; }
    let p;
    try { p = await post("/api/trade/preview", { ...oneTrade(b), spend }); }
    catch (e) {
      if (my !== seq) return;
      pv.innerHTML = `<p class="inline-err">Couldn't get a quote: ${esc(e.message)}</p><p><button type="button" class="btn ghost small" id="requote">Refresh quote</button></p>`;
      $("#requote", pv).onclick = () => { clearTimeout(timer); show(); };
      return;
    }
    if (my !== seq || !box.isConnected) return; // a newer amount is on its way
    if (!p.ok && p.price_changed) { // the book moved between the engine's reads: no estimate, never a stale price
      pv.innerHTML = `<p><b>Price changed—refresh quote</b></p><p>The cheapest price for sale moved while we read Polymarket's order book, so there's no estimate right now.</p>
        <p><button type="button" class="btn ghost small" id="requote">Refresh quote</button></p>${freshLine(p)}`;
      $("#requote", pv).onclick = () => { clearTimeout(timer); show(); };
      return;
    }
    if (!p.ok) {
      const np = notPriced(p, spend);
      pv.innerHTML = `<p>${esc(np.line)}</p>${quoteNote(p)}${quoteFold(p)}`;
      if (np.room >= 1) pv.innerHTML += `<p><button type="button" class="btn ghost small" id="useroom">Use ${money(np.room)} instead</button></p>`;
      const use = $("#useroom", pv);
      if (use) use.onclick = () => { input.value = np.room.toFixed(2); clearTimeout(timer); show(); };
      return;
    }
    const avg = Math.round(p.price * 1000) / 10, worst = p.worst_price != null ? Math.round(p.worst_price * 1000) / 10 : avg;
    pv.innerHTML = `<p>${plural(p.contracts, "contract")}${b.outcome ? ` of ${esc(b.outcome)}` : ""}. ${p.depth_checked ? fillExplain(p, spend) : "At the cheapest price for sale now."}</p>
      <div class="receipt">
        <div><span>${plural(p.contracts, "contract")} × ${worst > avg ? `${avg}¢ average` : `${avg}¢`}</span><b>${money(p.cost)}</b></div>
        <div><span>${INTL} fee</span><b>${p.fee > 0 ? money(p.fee) : "No fee"}</b></div>
        <div class="total"><span>Estimated total</span><b>${money(p.total)}</b></div>
      </div>
      <div class="kv" style="margin:0 0 14px">
        <div><span>${ifWins(b.outcome)}</span><b>You get ${money(p.payout)}</b></div><div><span>${ifLoses(b.outcome)}</span><b>You lose ${money(p.total)}</b></div>
      </div>
      ${!p.depth_checked ? `<p class="qwarn">${INTL}'s order book couldn't be read just now, so an order this size might fill higher.</p>` : ""}
      ${slippageLine(p)}${quoteNote(p)}${quoteFold(p)}`;
  };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(show, 350); };
  $$("[data-amt]", box).forEach((x) => (x.onclick = () => { input.value = x.dataset.amt; clearTimeout(timer); show(); }));
  show();
}

// one handler for the clickable things inside a container
function bindActions(root) {
  $$("[data-trade]", root).forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("button, a")) tradeSheet(shown[+el.dataset.trade]); };
    el.onkeydown = (e) => { if (e.key === "Enter" && e.target === el) tradeSheet(shown[+el.dataset.trade]); };
  });
  $$("[data-open-trade]", root).forEach((btn) => (btn.onclick = (e) => { e.stopPropagation(); tradeSheet(shown[+btn.dataset.openTrade]); }));
  $$("[data-retry]", root).forEach((btn) => (btn.onclick = () => route()));
  $$("[data-href]", root).forEach((el) => {
    el.onclick = (e) => { if (!e.target.closest("a")) location.hash = el.dataset.href; };
    el.onkeydown = (e) => { if (e.key === "Enter" && e.target === el) location.hash = el.dataset.href; };
  });
}

// ---- feed ----
// Signed in only (signInPage otherwise). Two parts: Following (#/, the default: trades of the traders you follow)
// and Recommended (#/recommended: $1,000 or more from Traders' three sections, quieter on purpose and
// never above Following). Both show your markets, the ones picked at onboarding or with Traders' chips; the chips
// live on Traders only, the Feed says which markets it shows and Change opens the same picker as onboarding.
// Big trades (#/big: $250 or more right now) stays reachable from the foot of Recommended.
const feed = { data: null, at: 0, err: null, mine: null, mineAt: 0, mineErr: null, onlyIn: true, big: null, bigAt: 0, bigErr: null, seq: 0 };
let feedTimer = null;
const onFeed = () => routeName().startsWith("feed");
const feedView = () => ({ "feed:big": "big", "feed:rec": "rec" })[routeName()] || "follow";
const FEED_PARTS = [["follow", "#/", "Following"], ["rec", "#/recommended", "Recommended"]];
// What each view keeps: [data, updated at, error] keys in `feed`.
const FEED_KEYS = { follow: ["mine", "mineAt", "mineErr"], rec: ["data", "at", "err"], big: ["big", "bigAt", "bigErr"] };

async function feedPage(view) {
  $("#app").innerHTML = `<nav class="seg" aria-label="Feed">${FEED_PARTS
    .map(([k, href, l]) => `<a href="${href}" class="${view === k ? "on" : ""}"${view === k ? ' aria-current="page"' : ""}>${l}</a>`).join("")}</nav>
    <div id="fbar"></div><div id="flist">${skelCards(3)}</div>`;
  if (feed[FEED_KEYS[view][0]] || (view === "follow" && !canFollowFeed())) renderFeed();
  await loadFeed();
}
// Following needs to know who you follow: signed in, with your follows read.
const canFollowFeed = () => auth.on && signedIn() && !!auth.me;
async function loadFeed() {
  clearTimeout(feedTimer);
  const my = ++feed.seq; // a newer call (the Clerk listener, a tab switch) makes this one stale: one 30 s loop only
  const view = feedView(), [k, at, err] = FEED_KEYS[view];
  if (view === "follow" && !canFollowFeed()) { renderFeed(); return; } // signed out: the prompt, nothing to read
  const uid = auth.uid;
  let data = null, error = null;
  try { data = await api(view === "big" ? "/api/trading-now?min_usd=250" : view === "rec" ? "/api/live" : "/api/me/feed"); }
  catch (e) { error = e.message; }
  if (my !== feed.seq || (view === "follow" && uid !== auth.uid)) return; // stale, or someone else signed in since
  // "Updated": when the oldest of it was read from Polymarket (as_of), not when this page asked
  if (error) feed[err] = error; else { feed[k] = data; feed[at] = Math.min(Date.now(), data?.as_of || Infinity); feed[err] = null; }
  if (!onFeed() || feedView() !== view) return; // the other view, or another page, since
  clearTimeout(feedTimer);
  feedTimer = setTimeout(() => { if (onFeed()) loadFeed(); }, 30000);
  renderFeed();
}
// Who is signed in (Clerk's user id, or null). Another account, or none: the last one's Following goes.
function accountIs(uid) {
  if (uid === auth.uid) return;
  analyticsAccount(uid, auth.uid);
  auth.uid = uid;
  Object.assign(feed, { mine: null, mineAt: 0, mineErr: null });
}
// Who you follow (/api/me). A failure is kept, so Following shows it with "Try again", never loading forever.
async function readMe() {
  if (!signedIn()) { Object.assign(auth, { me: null, meErr: null }); return; }
  try { auth.me = await api("/api/me"); auth.meErr = null; } catch (e) { auth.me = null; auth.meErr = e.message || "Couldn't read your account."; }
}

// Which markets the Feed shows, in one line: "Your markets: Politics, Sports · Change".
function marketLine() {
  const picked = interests || [];
  return `<span class="mkts">Your markets: <b>${picked.length ? esc(picked.join(", ")) : "All"}</b><span class="sep">·</span><button class="link" id="mktchange">Change</button></span>`;
}
const inMarkets = (cat) => !(interests || []).length || interests.includes(cat);
function marketsSheet() {
  const panel = sheet(`<div id="mktpick"></div><p class="explain" style="margin:18px 0 0;text-align:center;font-size:13px">Traders shows the same markets.</p>`);
  interestPicker($("#mktpick", panel), { selected: (interests || []).filter((c) => INTERESTS.includes(c)), go: "Show these markets",
    alt: "All markets", onDone: (v) => { setInterests(v, { picked: true }); closeSheet(); renderFeed(); } });
}
function bindFeedMarkets() {
  const change = $("#mktchange"); if (change) change.onclick = marketsSheet;
  const all = $("#feedall"); if (all) all.onclick = () => { toggleInterest(""); renderFeed(); };
}

function renderFeed() {
  const view = feedView();
  if (view === "big") return renderBig();
  if (view === "follow") return renderFollowing();
  const r = feed.data;
  if (!r) { $("#fbar").innerHTML = ""; $("#flist").innerHTML = errorState(feed.err || "No answer from the app."); bindActions($("#flist")); return; }
  if (!r.traders.length) {
    $("#fbar").innerHTML = "";
    $("#flist").innerHTML = emptyState("No traders to recommend yet",
      "The first check of Polymarket traders takes 20–30 minutes. Recommended fills in once it finds traders worth following.",
      `<a class="btn ghost" href="#/traders">See the traders</a>`);
    return;
  }
  const min = `$${Math.round(r.min_usd ?? 1000).toLocaleString("en-US")}`; // "$1,000", as everywhere else
  renderTrades(r, feed.at, feed.err, {
    who: `${plural(r.traders.length, "trader")} we recommend`,
    note: `<p class="foot-note" style="margin:0 0 12px">Only trades of ${min} or more from Sharps and Rising traders. ${NOT_A_TIP}</p>
      ${r.traders.some((t) => t.copy_ok) ? "" : pausedNote(`Their trades still show here. <a class="link" href="#/traders">Why?</a>`)}`,
    none: [`No trades of ${min} or more in the last ${r.hours} hours`, "Recommended shows only bigger trades, so it's often quiet. Trades show up here a few minutes after they're made."],
    sheet: () => followingSheet(r.traders, "rec"),

// Following: the traders you follow, for alerts or research, whoever they are. Signed out the Feed is the sign-in
// page; here, signed in while who you follow is read (or couldn't be), or signing in isn't switched on (locally).
function renderFollowing() {
  if (!canFollowFeed()) {
    $("#fbar").innerHTML = "";
    const rec = `<a class="btn ghost" href="#/recommended">See Recommended</a>`;
    $("#flist").innerHTML = !auth.wanted ? emptyState("Following needs signing in", "Signing in isn't switched on here. Recommended shows trades from the traders we recommend.", rec)
      : auth.meErr ? `<div class="state err"><b>Couldn't load who you follow</b><p>${esc(auth.meErr)}</p><button class="btn ghost" id="meretry">Try again</button></div>`
      : skelCards(3);
    const again = $("#meretry"); if (again) again.onclick = async () => { auth.meErr = null; renderFollowing(); await readMe(); loadFeed(); };
    return;
  }
  const r = feed.mine;
  if (!r) { $("#fbar").innerHTML = ""; $("#flist").innerHTML = feed.mineErr ? errorState(feed.mineErr) : skelCards(3); bindActions($("#flist")); return; }

    sheet: () => followingSheet(r.traders, "follow"), foot: "",
  });
}

// What the Feed hasn't got (the engine's pending and failed counts, and how old the oldest of it is): a note for
// each, and, with no trades to show, an empty state that doesn't claim "no trades" for traders not read yet.
const STALE_NOTE_MS = 5 * 60 * 1000;
function feedGaps(r, at, now) {
  const notes = [], unread = (r.pending || 0) + (r.failed || 0);
  if (r.failed) notes.push(`${plural(r.failed, "trader")} couldn't be read just now; retrying.`);
  if (r.pending) notes.push(`Still reading ${plural(r.pending, "trader")}; their trades show in a minute.`);
  if (r.stale) notes.push(`${plural(r.stale, "trader")} couldn't be refreshed just now: showing their trades from the last good read; retrying.`);
  if (at && now - at > STALE_NOTE_MS) notes.push(`Some of these traders were last read ${Math.round((now - at) / 60000)} minutes ago.`);
  const empty = !unread ? null
    : unread >= r.traders.length ? (r.pending ? ["Still reading their trades", "Their trades from the last day show here in a minute."]
      : ["Their trades couldn't be read just now", "Polymarket didn't answer. We'll try again in a moment."])
    : ["No trades from the traders read so far", "The rest show here once they've been read."];
  return { notes, empty };
}

// One list of trade cards (Following or Recommended): who, when it was updated, your markets, the switch, notes,
// then one card per outcome ("Also bought by" for the rest) and the empty states.
function renderTrades(r, at, err, { who, note, none, sheet: openSheet, foot }) {
  const cards = oneCardPerTrade(r.bets);
  const pool = cards.filter((b) => !feed.onlyIn || b.status === "in" || b.side === "sell"); // a sell always shows
  const names = interestNames(interests || []);
  const gaps = feedGaps(r, at, Date.now());
  $("#fbar").innerHTML = `
    <div class="feedtop">
      <button class="follow" id="following">${`<span class="stack">${r.traders.slice(0, 5).map((t) => avatar(t.wallet, 28)).join("")}</span>`}
        <b>${who}</b><span class="chev">›</span></button>
      ${fresh(at)}
    </div>
    <div class="filters">
      ${marketLine()}
      <label class="switch"><input type="checkbox" id="onlyin" ${feed.onlyIn ? "checked" : ""}><span class="track"></span>Only buys I can still get into</label>
    </div>
    ${err ? `<p class="inline-err">Couldn't refresh: ${esc(err)}. Showing the last update.</p>` : ""}
    ${note}
    ${gaps.notes.map((n) => `<p class="foot-note" style="margin:0 0 12px">${n}</p>`).join("")}`;
  $("#onlyin").onchange = (e) => { feed.onlyIn = e.target.checked; renderFeed(); };
  $("#following").onclick = openSheet;
  bindLag();

  shown = pool.filter((b) => inMarkets(b.category));
  const anyHere = cards.some((b) => inMarkets(b.category)); // before "Only buys I can still get into"
  let html;
  if (!r.bets.length) html = emptyState(...(gaps.empty || none));
  else if (!shown.length && anyHere) html = emptyState("Nothing you can still get into",
    `Every ${names ? esc(names) + " " : ""}trade here from the last ${r.hours} hours has moved away or settled.`, `<button class="btn ghost" id="showall">Show all trades</button>`);
  else if (!shown.length) html = emptyState(`No ${esc(names)} trades`, `Nothing in ${esc(names)} in the last ${r.hours} hours.`, `<button class="btn ghost" id="feedall">Show all markets</button>`);
  else html = `<div class="cards">${shown.map((b, i) => b.side === "sell" ? sellCard(b) : tradeCard(b, i)).join("")}</div>`;
  $("#flist").innerHTML = html + foot;
  const all = $("#showall");
  if (all) all.onclick = () => { feed.onlyIn = false; renderFeed(); };
  bindFeedMarkets();
  bindActions($("#flist"));
}

// Big trades: trades of $250 or more on the venues Signals reads, one card each, in the Feed's card style.
// Polymarket only (for now), every trade knows its market, so Big trades opens on your markets like the rest of
// the Feed. With Kalshi on, it shows everything: the SDK has no categories for Kalshi markets, and almost all
// big trades are Kalshi's, so a filter would mostly hide them. The SDK's big trades have no price now, so there
// is no "You can still get in" here; a named trader's card opens their page.
function renderBig() {
  const rows = feed.big;
  if (!rows) { $("#fbar").innerHTML = ""; $("#flist").innerHTML = errorState(feed.bigErr || "No answer from the app."); bindActions($("#flist")); return; }
  const filtered = !kalshiOn();
  const names = interestNames(filtered ? interests || [] : []);
  const list = filtered ? rows.filter((t) => inMarkets(t.category)) : rows;
  const where = venuesOn.map((v) => VENUE[v]).join(" and ");
  $("#fbar").innerHTML = `
    <div class="feedtop"><span class="muted" style="font-size:14px">${filtered ? "Trades" : "Every trade"} of $250 or more right now, on ${where}.</span>
      ${fresh(feed.bigAt, "big")}</div>
    ${filtered ? `<div class="filters">${marketLine()}</div>` : ""}
    ${feed.bigErr ? `<p class="inline-err">Couldn't refresh: ${esc(feed.bigErr)}. Showing the last update.</p>` : ""}`;
  let html;
  if (!rows.length) html = emptyState("No big trades right now", "Trades of $250 or more show up here as they happen.");
  else if (!list.length) html = emptyState(`No big ${esc(names)} trades right now`, `None of the last ${plural(rows.length, "big trade")} ${rows.length === 1 ? "is" : "are"} in ${esc(names)}.`,
    `<button class="btn ghost" id="feedall">Show all markets</button>`);
  else html = `<div class="cards">${list.map(bigCard).join("")}</div>${kalshiOn() ? `<p class="foot-note">Kalshi names only traders who turned on their social profile.</p>` : ""}`;
  $("#flist").innerHTML = html;
  bindLag();
  bindFeedMarkets();
  bindActions($("#flist"));
}
function bigCard(t) {
  const href = t.trader ? `#/t/${t.venue}/${encodeURIComponent(t.trader)}` : "";
  const pick = t.outcome && t.venue === "polymarket" ? t.outcome : t.outcome ? `${t.side.toUpperCase()} · ${t.outcome}` : t.side.toUpperCase();
  return `<article class="card${href ? " trade" : ""}"${href ? ` data-href="${href}" tabindex="0"` : ""}>
    <div class="trade-top">${avatar(t.trader ? `${t.venue}:${t.trader}` : "anon", 28)}<span class="who"><span class="name">${t.trader ? esc(displayName(t.name, t.trader)) : "Anonymous trader"}</span></span>
      <span class="when">${[t.category, kalshiOn() ? VENUE[t.venue] : null, ago(t.at)].filter(Boolean).map(esc).join(" · ")}</span></div>
    <h3 class="trade-title">${esc(t.title || t.market)}</h3>
    <div class="trade-tags"><span class="chip">${esc(pick)}</span>${marketLink(t.url, `${VENUE[t.venue]} ↗`)}</div>
    ${t.venue === "polymarket" ? venueNote(t.us) : ""}
    <div class="trade-nums"><span>${t.action === "buy" ? "Bought" : "Sold"} at <b>${cents(t.price)}</b></span><span class="amt">${usd(t.usd)}</span></div>
    ${t.trader ? "" : `<div class="trade-foot"><span class="muted" style="font-size:14px">Anonymous: ${VENUE[t.venue] || "the venue"} doesn't name this trader.</span></div>`}
  </article>`;
}
setInterval(() => { const u = $("#updated"), at = feed[FEED_KEYS[feedView()][1]]; if (u && at) u.innerHTML = updatedAgo(at); }, 5000);

// Traders we follow often buy the same thing, minutes apart: one card per outcome they bought. It shows the
// buy you can best still follow (you can still get in, then whoever bought first) and lists the others;
// it sorts by the newest buy of the lot.
const LEAD = { in: 0, moved: 1 };
// Among buys you can still get into, one copying is offered for leads, so a neutral card never hides it.
const leadOf = (b) => (LEAD[b.status] ?? 2) * 2 + (b.status === "in" && b.copy_ok === true ? 0 : 1);
function oneCardPerTrade(bets) {
  const by = new Map();
  for (const b of bets) {
    const k = `${b.side === "sell" ? "sell:" : ""}${b.token || b.market}`; // the exact outcome token (the index is sometimes junk), per side
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(b);
  }
  return [...by.values()].map((g) => {
    g.sort((a, b) => leadOf(a) - leadOf(b) || a.at.localeCompare(b.at));
    const latest = g.reduce((m, x) => (x.at > m ? x.at : m), g[0].at);
    return { ...g[0], also: g.slice(1).map((x) => ({ wallet: x.wallet, name: x.name })), latest };
  }).sort((a, b) => b.latest.localeCompare(a.latest));
}

function followingSheet(traders, kind = "rec") {
  const panel = sheet(`<h2>${plural(traders.length, "trader")} ${kind === "follow" ? "you follow" : "we recommend"}</h2>
    <p class="explain">${kind === "follow" ? "Following shows every trade of theirs from the last day. Follow or unfollow from a trader's page."
      : "Recommended shows trades of $1,000 or more from the traders in Sharps and Rising."} <button class="link" id="howlink">How we pick traders</button></p>
    <div class="list" style="margin-top:16px">${traders.map((t) => `<a class="trow norank" href="#/worth/${esc(t.wallet)}">${avatar(t.wallet, 36)}
      <span class="tmain"><span class="name">${esc(displayName(t.name, t.wallet))}</span></span>${tier(t.segment)}</a>`).join("")}</div>`);
  $$("a", panel).forEach((a) => a.addEventListener("click", closeSheet));
  $("#howlink", panel).onclick = () => howSheet();
}

// "How we pick traders": The checks (what we look at), The tiers (what passing earns, and where it's listed) and
// Copying (a separate question, never part of the tier). `tab` opens one of them; `focus` marks a check, a tier
// ("proven", …) or a copy status ("costly", …) and scrolls to it.
const HOW_CHECKS = [
  ["edge", "The price moves their way.", "A few minutes after they buy, has the market come round to their view? That's the main sign of skill."],
  ["n", "Enough trades to trust it.", "One good week isn't a record. Trades on the same game count once."],
  ["luck", "Not one lucky win.", "Their edge has to hold without their best trades, and their profit without their biggest win."],
  ["profit", "Profitable from trading.", "They made money from trading over the last 30 days. Rewards and rebates don't count."],
  ["side", "They take a side.", "Market makers and arbitrage traders have no view to follow, so they're left out."],
  ["active", "Still trading.", "Nobody who hasn't bought anything in a week is recommended."],
];
const HOW_TIERS = [
  ["proven", "Passes every check over at least 40 separate trades, on an account the leaderboards list or a big one."],
  ["quiet", "The same over at least 25 trades, on a small account no leaderboard lists."],
  ["rising", "Good early signs, too few trades to be sure yet."],
];
// Every trader's copy status, as the engine decides it (copy_status), in plain words: "buying after them", never
// "copies" as a noun, so someone who has never heard of copy trading can follow it.
const HOW_COPY = [
  ["copyable", "Copyable", "Buying after them made money, and often enough that it isn't just luck (we need at least 8 of their trades to say so). We only say this about traders who also pass our skill checks."],
  ["not_proven", "Copy not proven", "We can't tell. Buying after them sometimes made money and sometimes lost it, or we had too few trades to check."],
  ["costly", "Costly to copy", "Buying after them lost money. Usually the price had already moved by the time you could buy."],
  ["not_offered", "Not offered", "Buying after them made money, but the trader doesn't pass our skill checks, so we don't suggest it."],
];
const howMore = ([label, text]) => `<details class="how-more"><summary>${label}</summary><p>${text}</p></details>`;

function howSheet(tab = "checks", focus = null) {
  const tabs = [["checks", "The checks"], ["tiers", "The tiers"], ["copying", "Copying"]];
  const panel = sheet(`<h2>How we pick traders</h2>
    <div class="how-tabs" role="tablist" aria-label="How we pick traders">${tabs.map(([k, l]) => `<button type="button" role="tab" id="howtab-${k}" aria-controls="howpanel-${k}" data-howtab="${k}">${l}</button>`).join("")}</div>
    <div class="how" role="tabpanel" id="howpanel-checks" aria-labelledby="howtab-checks">
      <p class="explain" style="margin-top:12px">We look at Polymarket traders on the leaderboards and in busy markets, and check up to 60 of each one's trades from the last 30 days against Polymarket's own price history.</p>
      <ol>${HOW_CHECKS.map(([k, head, line, more]) => `<li data-howfocus="${k}"><b>${head}</b> ${line}${more ? howMore(more) : ""}</li>`).join("")}</ol>
      <p class="explain">A trader who passes gets a tier. Whether copying them pays is a separate question, never part of the tier. <button type="button" class="link" data-howtab="tiers">See the tiers →</button></p>
    </div>
    <div class="how" role="tabpanel" id="howpanel-tiers" aria-labelledby="howtab-tiers">
      <p class="explain" style="margin-top:12px">The tier says how sure we are of a trader's skill and record. Copying never moves it: a Proven sharp can be costly to copy. Each trader's copy status is apart. <button type="button" class="link" data-howtab="copying">Copying →</button></p>
      ${HOW_TIERS.map(([k, text]) => `<div class="how-tier" data-howfocus="${k}">${tier(k)}<p>${text}</p></div>`).join("")}
      <h3>Where they're listed</h3>
      <ul>${SECTIONS.map(([, title, sub]) => `<li><b>${title}:</b> ${sub}</li>`).join("")}</ul>

  const show = (k) => {
