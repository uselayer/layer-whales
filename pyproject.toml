[project]
name = "signals"
version = "0.1.0"
description = "Signals: top traders on Polymarket (and Kalshi) and what copying their trades really costs, on the uselayer SDK. Runs on your machine."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "uselayer>=0.7.0",  # client.whales: top traders, scores, copy trading (0.7.0: closed positions, held share, price band, wallet value)
]

[project.scripts]
signals = "signals.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
