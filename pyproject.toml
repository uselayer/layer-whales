[project]
name = "layer-whales"
version = "0.1.0"
description = "Whale tracking and copy trading across Kalshi and Polymarket, on the uselayer SDK. Runs on your machine."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "uselayer>=0.5.4",  # client.whales: top traders, scores, copy trading (0.5.4: copy a trade by dollars)
]

[project.scripts]
whales-demo = "whales_demo.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whales_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
